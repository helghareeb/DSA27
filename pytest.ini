[pytest]
testpaths = tests
python_files = test_*.py

markers =
    challenge: an exercise that is unimplemented until you write it
    lab: a weeks 1-3 lab exercise (labs/); also marked challenge
    practice: a question-bank coding problem (practice/); also marked challenge

# Run only the setup check:        pytest -m "not challenge"
# Run only the exercises:          pytest -m challenge
# Run only the lab exercises:      pytest -m lab
# Run only the practice problems:  pytest -m practice
# Run one topic:                   pytest tests/test_sorting.py -v
# Stop at the first failure:       pytest -x
# Test the worked solutions:       pytest --solutions tests/test_stack_queue.py
addopts = --strict-markers
