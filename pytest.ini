[pytest]
testpaths = tests
python_files = test_*.py

markers =
    challenge: an exercise that is unimplemented until you write it

# Run only the setup check:        pytest -m "not challenge"
# Run only the exercises:          pytest -m challenge
# Run one topic:                   pytest tests/test_sorting.py -v
# Stop at the first failure:       pytest -x
addopts = --strict-markers
