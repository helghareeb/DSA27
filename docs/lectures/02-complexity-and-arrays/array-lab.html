<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Array Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen classroom console. Code | variables | the array, transport bar along the bottom. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --panel-2: #f4f6f9;
  --ink: #142033;
  --muted: #5a6679;
  --line: #d3d9e2;
  --accent: #c76a00;        /* the running line, the active frame: a highlighter */
  --accent-bg: #ffefcc;
  --wait: #3456c7;          /* paused frames */
  --wait-bg: #e6ecfc;
  --done: #23803a;          /* returned */
  --done-bg: #e2f4e6;
  --err: #c92a3a;
  --err-bg: #fde4e7;
  --hit: #0b7a8a;           /* memo lookup */
  --hit-bg: #dcf3f6;
  --kw: #8a2bb8; --str: #237a3a; --num: #b4520b; --com: #7b8798; --fn: #1d5fd0;
  --shadow: 0 1px 2px rgba(20,32,51,.06), 0 4px 14px rgba(20,32,51,.06);
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", Consolas, "Cascadia Mono", ui-monospace, monospace;
  --code-size: clamp(14px, 1.18vw, 21px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121a; --panel: #151c27; --panel-2: #1b2431; --ink: #e5eaf2; --muted: #95a1b4; --line: #2a3546;
    --accent: #f3a43a; --accent-bg: #3b2a0e; --wait: #8ea6ff; --wait-bg: #1d2747; --done: #5fd07a; --done-bg: #15301d;
    --err: #ff7a86; --err-bg: #3d1820; --hit: #4fd2e2; --hit-bg: #123338;
    --kw: #d39bff; --str: #8ad79a; --num: #ffb86b; --com: #7d8aa0; --fn: #7fb0ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121a; --panel: #151c27; --panel-2: #1b2431; --ink: #e5eaf2; --muted: #95a1b4; --line: #2a3546;
  --accent: #f3a43a; --accent-bg: #3b2a0e; --wait: #8ea6ff; --wait-bg: #1d2747; --done: #5fd07a; --done-bg: #15301d;
  --err: #ff7a86; --err-bg: #3d1820; --hit: #4fd2e2; --hit-bg: #123338;
  --kw: #d39bff; --str: #8ad79a; --num: #ffb86b; --com: #7d8aa0; --fn: #7fb0ff;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  display: flex; flex-direction: column;
  padding-inline: 16px; padding-block: 10px;
  gap: 10px;
}
body, code, pre, .mono, svg text, input { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
code, pre, .mono { font-family: var(--f-code); }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 22px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.picker { display: flex; align-items: center; gap: 8px; flex: 1 1 320px; min-width: 0; }
.picker select {
  flex: 1 1 auto; min-width: 0; max-width: 520px;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  font-size: 16px; font-weight: 700;
}
.top .tools { display: flex; gap: 6px; }

/* ---------- main grid ---------- */
main {
  flex: 1 1 auto; min-height: 0;
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, .72fr) minmax(0, 1.25fr);
}
.pane {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
}
.pane-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.pane-head .meta { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--f-code); font-size: 12px; }

/* ---------- code pane ---------- */
.about { padding: 10px 14px 0; display: flex; flex-direction: column; gap: 4px; }
.about h1 { margin: 0; font-size: 20px; line-height: 1.2; text-wrap: balance; }
.about p { margin: 0; color: var(--muted); font-size: 14px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.badge.works { background: var(--done-bg); color: var(--done); }
.badge.wrong { background: var(--err-bg); color: var(--err); }
.badge.cost { background: var(--accent-bg); color: var(--accent); }
.badge.ex { background: var(--wait-bg); color: var(--wait); }

.callstrip {
  margin: 10px 14px 0; padding: 8px 10px; border-radius: 8px; background: var(--panel-2);
  font-family: var(--f-code); font-size: var(--code-size);
  display: flex; align-items: center; flex-wrap: wrap; gap: 2px;
}
.callstrip .ps { color: var(--muted); margin-right: 6px; }
.callstrip input {
  font-family: var(--f-code); font-size: inherit; padding: 1px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--num);
  min-width: 2.5ch; field-sizing: content;
}
.callstrip input.bad { border-color: var(--err); background: var(--err-bg); }
.callstrip .run { margin-left: auto; }
.callerr { margin: 4px 14px 0; color: var(--err); font-size: 13px; min-height: 0; }

.code {
  margin: 10px 14px; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line);
  font-family: var(--f-code); font-size: var(--code-size); line-height: 1.6;
  overflow-x: auto; flex: 0 0 auto;
}
.ln { display: flex; align-items: center; min-width: max-content; padding-right: 10px; position: relative; }
.ln .no { width: 3ch; text-align: right; color: var(--com); padding-right: 12px; flex: 0 0 auto; user-select: none; }
.ln .src { white-space: pre; flex: 0 0 auto; }
.ln .tags { display: flex; gap: 4px; margin-left: 14px; flex: 0 0 auto; }
.ln .tag { font-family: var(--f-body); font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 999px; line-height: 1.6; }
.ln .tag.w { background: var(--wait-bg); color: var(--wait); }
.ln .tag.a { background: var(--accent); color: var(--panel); }
.ln .tag.r { background: var(--done); color: var(--panel); }
.ln .tag.e { background: var(--err); color: var(--panel); }
.ln.cur { background: var(--accent-bg); box-shadow: inset 4px 0 0 var(--accent); }
.ln.ret { background: var(--done-bg); box-shadow: inset 4px 0 0 var(--done); }
.ln.errl { background: var(--err-bg); box-shadow: inset 4px 0 0 var(--err); }
.ln.waitl { box-shadow: inset 4px 0 0 var(--wait); }
.t-kw { color: var(--kw); font-weight: 600; } .t-str { color: var(--str); } .t-num { color: var(--num); }
.t-com { color: var(--com); font-style: italic; } .t-fn { color: var(--fn); font-weight: 700; } .t-bi { color: var(--fn); }

.narr { margin: 0 14px 12px; flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.say { font-size: clamp(16px, 1.25vw, 21px); line-height: 1.45; max-width: 60ch; }
.say code, .qtext code, .choice code, .why code { font-size: .92em; background: var(--panel-2); padding: 0 4px; border-radius: 4px; }
.say.err { color: var(--err); }
.narr:has(.qcard) .say { font-size: clamp(14px, 1.05vw, 18px); }

/* question card */
.qcard { border: 2px solid var(--accent); border-radius: 10px; padding: 12px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 10px; }
.qlabel { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.qtext { font-size: clamp(17px, 1.4vw, 23px); font-weight: 700; line-height: 1.35; text-wrap: balance; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.choice {
  display: flex; gap: 10px; align-items: flex-start; text-align: left;
  padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer;
  font-size: clamp(14px, 1.05vw, 18px); line-height: 1.3;
}
.choice:hover { border-color: var(--accent); }
.choice .k { font-family: var(--f-code); font-weight: 700; color: var(--accent); flex: 0 0 auto; }
.choice.right { border-color: var(--done); background: var(--done-bg); }
.choice.wrong { border-color: var(--err); background: var(--err-bg); }
.choice[disabled] { cursor: default; }
.why { font-size: clamp(15px, 1.1vw, 19px); line-height: 1.45; padding: 8px 12px; border-radius: 8px; background: var(--panel-2); }
.why b { color: var(--done); }
.qactions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- stack pane ---------- */
.stackwrap { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.limit { border: 1px dashed var(--err); border-radius: 8px; padding: 6px 10px; color: var(--err); font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
.limit .bar { height: 8px; border-radius: 4px; background: var(--err-bg); overflow: hidden; }
.limit .bar i { display: block; height: 100%; background: var(--err); transition: width .25s; }
.frame {
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--panel);
  display: flex; flex-direction: column; gap: 4px;
}
.frame .fh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.frame .fname { font-family: var(--f-code); font-weight: 700; font-size: clamp(14px, 1.05vw, 18px); overflow-wrap: anywhere; }
.frame .chip { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.frame .locals { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 10px; row-gap: 1px; font-family: var(--f-code); font-size: clamp(13px, .95vw, 16px); }
.frame .locals .k { color: var(--muted); }
.frame .locals .v { overflow-wrap: anywhere; }
.frame .locals .tmp { font-style: italic; }
.frame .locals .ref { color: var(--hit); }
.frame .fnote { font-size: 13px; color: var(--muted); }
.frame.active { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1px var(--accent); }
.frame.active .chip { background: var(--accent); color: var(--panel); }
.frame.waiting { border-color: var(--wait); }
.frame.waiting .chip { background: var(--wait-bg); color: var(--wait); }
.frame.returning { border-color: var(--done); background: var(--done-bg); box-shadow: 0 0 0 1px var(--done); }
.frame.returning .chip { background: var(--done); color: var(--panel); }
.frame.error { border-color: var(--err); background: var(--err-bg); }
.frame.error .chip { background: var(--err); color: var(--panel); }
.frame.module { background: var(--panel-2); border-style: dashed; }
.frame.module .chip { background: var(--line); color: var(--muted); }
.frame.compact { padding: 3px 10px; flex-direction: row; align-items: center; justify-content: space-between; }
.frame.compact .fname { font-size: 13px; font-weight: 600; }
.frame.compact .locals, .frame.compact .fnote { display: none; }
.frame.new { animation: push .32s ease-out; }
@keyframes push { from { transform: translateY(-10px); opacity: .2; } to { transform: none; opacity: 1; } }
.stackfoot { padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* ---------- picture pane: the array, slot by slot ---------- */
.views { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 14px; }
.vlabel { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.vlabel .meta { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--f-code); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 2px solid; }

.block { --cw: clamp(36px, 3.1vw, 54px); }
.block.old { opacity: .62; }
.block.old .vlabel span:first-child { color: var(--err); }
.cells { display: flex; gap: 4px; flex-wrap: wrap; align-items: flex-end; row-gap: 22px; padding-bottom: 16px; }
.cell { display: flex; flex-direction: column; align-items: center; gap: 2px; width: var(--cw); flex: 0 0 auto; }
.cell .ptr { font-family: var(--f-code); font-size: 12px; font-weight: 700; min-height: 18px; display: flex; flex-direction: column-reverse; align-items: center; gap: 1px; }
.cell .ptr .p { padding: 0 5px; border-radius: 4px; color: var(--wait); background: var(--wait-bg); white-space: nowrap; }
.cell .ptr .p::after { content: " ↓"; }
.cell .ptr .p.a { background: var(--accent); color: var(--panel); }
.cell .bx {
  width: 100%; height: calc(var(--cw) * .82); display: flex; align-items: center; justify-content: center;
  font-family: var(--f-code); font-size: clamp(13px, 1.15vw, 19px); font-weight: 700;
  border: 1.5px solid var(--line); border-radius: 6px; background: var(--panel-2); position: relative;
}
.cell .ix { font-family: var(--f-code); font-size: 12px; color: var(--muted); }
.cell.used .bx { border-color: var(--wait); background: var(--wait-bg); color: var(--ink); }
.cell.free .bx { border-style: dashed; color: var(--muted); font-weight: 400; font-size: 12px; background: transparent; }
.cell.free.stale .bx { color: var(--err); font-weight: 700; font-size: clamp(13px, 1.15vw, 19px); border-color: var(--err); }
.cell.rd .bx { border-color: var(--hit); background: var(--hit-bg); box-shadow: 0 0 0 2px var(--hit); }
.cell.wr .bx { border-color: var(--done); background: var(--done-bg); box-shadow: 0 0 0 2px var(--done); }
.cell.oob .bx { border-color: var(--err); background: var(--err-bg); color: var(--err); border-style: dashed; box-shadow: 0 0 0 2px var(--err); }
.cell.oob .ix { color: var(--err); font-weight: 700; }
.cell.ghost .bx { border-style: dotted; background: transparent; }
.sizemark { align-self: stretch; width: 0; border-left: 3px solid var(--accent); margin: 18px 1px 0; position: relative; flex: 0 0 auto; }
.sizemark span { position: absolute; bottom: -17px; left: -3px; font-family: var(--f-code); font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.jump { font-family: var(--f-code); font-size: 13px; color: var(--muted); margin-top: 6px; }
.jump b { color: var(--accent); }

.costs svg { display: block; width: 100%; height: auto; }
.costs .bar { fill: var(--wait); }
.costs .bar.rs { fill: var(--err); }
.costs .bar.now { fill: var(--accent); }
.costs text { font-size: 11px; fill: var(--muted); }
.costs .avg { stroke: var(--done); stroke-width: 2; stroke-dasharray: 5 3; }
.costs .avgt { fill: var(--done); font-weight: 700; }
.facts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.facts b { font-family: var(--f-code); color: var(--ink); font-size: 15px; }
.callstrip { flex-direction: column; align-items: stretch; gap: 4px; }
.cline { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.cline .run { margin-left: auto; }
.code { flex: 0 1 auto; min-height: 6em; overflow: auto; position: relative; }
.narr { flex: 1 1 0; min-height: 8em; }
.stackfoot code { font-size: .95em; }
.console { flex: 0 0 auto; border-top: 1px solid var(--line); display: flex; flex-direction: column; max-height: 38%; min-height: 90px; }
.out { margin: 0; padding: 8px 12px; overflow: auto; font-size: clamp(13px, .95vw, 16px); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; flex: 1 1 auto; }
.out .prompt { color: var(--muted); } .out .ret { color: var(--done); font-weight: 700; } .out .err { color: var(--err); } .out .print { color: var(--ink); }
.out .print.new, .out .ret.new { background: var(--accent-bg); }

/* ---------- transport ---------- */
.transport {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow);
}
.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
  font-weight: 700; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.on { background: var(--wait-bg); border-color: var(--wait); color: var(--wait); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn kbd { font-family: var(--f-code); font-size: 11px; font-weight: 400; opacity: .75; }
.group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.scrub { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 160px; }
.scrub input { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
.scrub .pos { font-family: var(--f-code); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-family: var(--f-code); font-size: 15px; font-variant-numeric: tabular-nums; }
.speed { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.speed input { width: 90px; accent-color: var(--accent); }
.nudge { color: var(--err); font-size: 13px; font-weight: 700; }

@media (max-width: 1150px) {
  main { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: auto auto; }
  .views-pane { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  html, body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  .pane { max-height: none; }
  .stackwrap, .views { max-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) {
  .frame.new, .tn.fresh { animation: none; }
  .limit .bar i { transition: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>Array Lab</b><span>DSA27 · Lectures 02 and 04</span></div>
  <div class="picker">
    <label for="scenario" class="mono" style="color:var(--muted);font-size:13px">Scenario</label>
    <select id="scenario"></select>
  </div>
  <div class="tools">
    <button class="btn" id="themeBtn" title="Switch light / dark">Theme</button>
    <button class="btn" id="fsBtn" title="Full screen (F)">Full screen</button>
  </div>
</header>

<main>
  <section class="pane code-pane">
    <div class="pane-head"><span>Code</span><span class="meta" id="lineInfo"></span></div>
    <div class="about">
      <div class="badges" id="badges"></div>
      <h1 id="scTitle"></h1>
      <p id="scBlurb"></p>
    </div>
    <div class="callstrip" id="callstrip"></div>
    <div class="callerr" id="callerr"></div>
    <div class="code" id="code"></div>
    <div class="narr" id="narr"></div>
  </section>

  <section class="pane stack-pane">
    <div class="pane-head"><span>Variables</span><span class="meta" id="stackInfo"></span></div>
    <div class="stackwrap" id="stack"></div>
    <div class="stackfoot">One frame per running function, newest on top. Each holds its own variables; <code>arr</code> and <code>self</code> refer to the arrays on the right.</div>
  </section>

  <section class="pane views-pane">
    <div class="pane-head"><span id="viewTitle">The array</span><span class="meta" id="viewMeta"></span></div>
    <div class="views" id="views"></div>
    <div class="console">
      <div class="pane-head"><span>Python shell</span></div>
      <pre class="out" id="out"></pre>
    </div>
  </section>
</main>

<footer class="transport">
  <div class="group">
    <button class="btn" id="bRestart" title="Back to the start (R)">Restart <kbd>R</kbd></button>
    <button class="btn" id="bBack" title="One step back (Left arrow)">Back <kbd>&larr;</kbd></button>
    <button class="btn primary" id="bStep" title="One step (Right arrow or Space)">Step <kbd>&rarr;</kbd></button>

<script>
/* =====================================================================
   ENGINE. Every scenario is a JavaScript mirror of the Python shown on
   screen. It runs once, and the Tracer records a snapshot at every step,
   so Back and the scrubber are just an index into that list.
   Every array slot read or written goes through T.rd / T.wr, which check

   ===================================================================== */

class PyErr extends Error {

}

function pyrepr(v) {

  if (typeof v === 'string') return "'" + v.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";

const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const plural = (k, w) => k + ' ' + w + (k === 1 ? '' : 's');
const REF = name => ({ __ref: name });
const arrRepr = cells => 'Array([' + cells.map(pyrepr).join(', ') + '])';
const daRepr = (cells, size) => 'DynamicArray([' + cells.slice(0, size).map(pyrepr).join(', ') + '])';
const range = (a, b, s) => { s = s || 1; const r = []; if (s > 0) for (let i = a; i < b; i += s) r.push(i); else for (let i = a; i > b; i += s) r.push(i); return r; };

/* The exact message dsa/array.py raises for a bad index. */
const arrayMsg = (i, n) => `Array index ${i} out of range for length ${n} (valid: 0..${n - 1}; no negative indices)`;
const ARRAY_TB = {
  get: ['  File "dsa/array.py", line 71, in __getitem__', '    return self._block[self._check(index)]'],
  set: ['  File "dsa/array.py", line 75, in __setitem__', '    self._block[self._check(index)] = value'],

const CHECK_TB = ['  File "dsa/array.py", line 63, in _check', '    raise IndexError('];

class Tracer {
  constructor(sc) {

    this.out = [];

    for (const k in (sc.counters || {})) this.counters[k] = 0;
    this.extra = { blocks: {}, order: [], ptrs: [], flash: [], oob: null, costs: null, jump: null };

      line: this.top.line, stack: this.stack, depth: this.depth,
      out: this.out, counters: this.counters, extra: this.extra,

  /* A question about what happens NEXT, shown on the step just recorded. */
  ask(text, correct, distractors, why) {
    const seen = new Set([String(correct)]), opts = [String(correct)];
    for (const d of distractors) { const s = String(d); if (!seen.has(s) && opts.length < 4) { seen.add(s); opts.push(s); } }
    let h = 0; for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) >>> 0;

  ret(val, line, msg, opt) {

      if (opt.assign) this.set(opt.assign, val);

      if (!opt.quiet) this.snap(none
        ? `\`${f.label}\` is finished and popped. \`${c.label}\` carries on from line ${c.line}.`

    const tb = ['Traceback (most recent call last):', '  File "<stdin>", line 1, in <module>'];
    for (const f of frames) tb.push(`  File "demo.py", line ${f.line}, in ${f.fn}\n    ${(this.codeLines[f.line - 1] || '').trim()}`);
    if (e.extra.arr) tb.push(...ARRAY_TB[e.extra.arr], ...CHECK_TB);
    tb.push(`${e.type}: ${e.message}`);

    this.stack[0].status = 'error';
    this.stack[0].note = `${e.type}: no result`;
    this.stack[0].line = 0;
    this.snap(frames.length
      ? `The exception unwinds the stack: ${plural(frames.length, 'frame')} ${frames.length === 1 ? 'is' : 'are'} thrown away, and the shell prints a traceback instead of an answer. Whatever the function had already written to the array stays written.`
      : 'The shell prints a traceback instead of an answer.', 'err');
  }

  /* ---- arrays ---- */
  block(key, cells, opt) {
    opt = opt || {};
    this.extra.blocks[key] = { cells: cells.slice(), size: opt.size === undefined ? null : opt.size, label: opt.label || key, meta: opt.meta || '', old: !!opt.old, cap: !!opt.cap };

  }
  drop(key) { delete this.extra.blocks[key]; this.extra.order = this.extra.order.filter(k => k !== key); }

  size(key, n) { this.extra.blocks[key].size = n; }
  ptr(list) { this.extra.ptrs = list.map(p => ({ b: p[0], i: p[1], l: p[2], a: !!p[3] })); }
  check(key, i, op) {
    const n = this.B(key).cells.length;
    if (!(Number.isInteger(i) && i >= 0 && i < n)) {
      this.extra.oob = { b: key, i };
      throw new PyErr('IndexError', arrayMsg(i, n), { arr: op });
    }
  }
  rd(key, i) {
    this.check(key, i, 'get');
    this.count('reads');
    this.extra.flash.push({ b: key, i, k: 'rd' });
    return this.B(key).cells[i];
  }
  wr(key, i, v, from) {
    this.check(key, i, 'set');
    this.count('writes');
    this.extra.flash = this.extra.flash.filter(f => !(f.b === key && f.i === i));
    this.extra.flash.push({ b: key, i, k: 'wr', from: from || null });

/* The state DynamicArray(values, growth) is in after __init__ appends each

function dynState(values, growth) {
  let cap = 1, resizes = 0;
  for (let n = 1; n <= values.length; n++) if (n - 1 === cap) { cap *= growth; resizes++; }
  const cells = Array(cap).fill(null);
  values.forEach((v, i) => { cells[i] = v; });
  return { cap, cells, resizes };

/* ---------------------------------------------------------------------

   T.at(line, ...) with the line numbers of that code.
   --------------------------------------------------------------------- */
const SCENARIOS = [];
const def = sc => SCENARIOS.push(sc);
const GROUPS = {
  fixed: 'Fixed array: Array and array_ops (Lecture 02)',
  dyn: 'DynamicArray (Lecture 04)',
  crash: 'Goes wrong: crash or wrong answer',
  slow: 'Goes wrong: right answer, terrible cost',

/* Parameter checks shared by several scenarios. */
/* Three wrong numeric answers for a question: the given ones first, then

  T.set('arr', REF('the Array drawn on the right'), T.stack[0]);

/* ---- a[i]: the course Array's own __getitem__ ------------------------- */
const GETITEM_CODE = `class Array:                      # dsa/array.py, two of its methods

        """a[i]. O(1)."""

    def _check(self, index):

  if (wrong && index < 0)

def({

  blurb: 'Indexing computes the slot\'s address and reads it. It never walks past the slots before it, so it costs the same for every index and every length: O(1).',
  code: GETITEM_CODE, cls: 'Array',
  call: [['arr = Array.from_values(', 'values', ')'], ['arr[', 'index', ']']],

  counters: { looked: 'Slots looked at' },
  setup: (T, p) => setupArr(T, p.values),
  run: (T, p) => getitemMirror(T, p.index, false),

/* ---- find ---------------------------------------------------------- */
const FIND_CODE = `def find(arr, target, size=None):
    if size is None:

    T.count('comparisons');

  call: [['arr = Array.from_values(', 'values', ')'], ['find(arr, ', 'target', ')']],
  counters: { comparisons: 'Comparisons' },
  setup: (T, p) => setupArr(T, p.values),
  run: (T, p) => findMirror(T, p.target),
  summary: (T) => ` ${plural(T.counters.comparisons, 'comparison')} for ${T.B('arr').cells.length} slots.` };
const FIND_VALUES = [4, 8, 15, 16, 23, 42];
const findParams = t => ({ values: { type: 'list', def: FIND_VALUES, minLen: 1, maxLen: 12, check: allInts('values') }, target: { type: 'int', def: t, min: -999, max: 999 } });
def(Object.assign({}, FIND_BASE, { id: 'find_best', title: 'find: best case (first slot)', params: findParams(4),
  blurb: 'Linear search looks at the slots one by one. When the target is in slot 0 it stops at once: one comparison, O(1).' }));
def(Object.assign({}, FIND_BASE, { id: 'find_worst', title: 'find: worst case (last slot)', params: findParams(42),

/* ---- insert_at, and its broken twin -------------------------------- */

const REMOVE_CODE = `def remove_at(arr, size, index):
    if not 0 <= index < size:
        raise IndexError(index)
    value = arr[index]
    for i in range(index, size - 1):         # from the FRONT, forwards

const REMOVE_OOB_CODE = REMOVE_CODE.replace('    for i in range(index, size - 1):         # from the FRONT, forwards',
                                            '    for i in range(index, size):             # one step too far');
function removeMirror(T, size, index, bug) {
  const n = T.B('arr').cells.length;
  T.call('remove_at', [['arr', REF('arr')], ['size', size], ['index', index]], `remove_at(arr, ${size}, ${index})`);
  T.size('arr', size);
  const okIx = index >= 0 && index < size;
  T.at(2, `Is \`0 <= ${index} < ${size}\`? ${okIx ? 'Yes.' : '**No.** Only slots 0 to ' + (size - 1) + ' hold values.'}`);
  if (!okIx) { T.at(3, `So it raises IndexError(${index}).`); throw new PyErr('IndexError', String(index), {}); }
  T.ptr([['arr', index, 'index', true]]);
  const value = T.rd('arr', index);
  T.set('value', value);
  T.at(4, `Keep the value being removed: \`value\` = ${C(value)}.`);
  const stop = bug === 'oob' ? size : size - 1;
  const idxs = range(index, stop);
  if (bug === 'oob')
    T.ask(`The loop now runs to \`range(${index}, ${size})\`. What happens when \`i\` reaches ${size - 1}?`,
      size === n ? `IndexError: arr[${size}] does not exist` : `arr[${size - 1}] = arr[${size}], which is None`,
      size === n ? ['Nothing: the loop stops at size - 1', `arr[${size}] is None, so it copies None`, 'The array grows by one slot'] : [`IndexError: arr[${size}] does not exist`, 'Nothing: the loop stops at size - 1', 'The array grows by one slot'],
      size === n ? `\`arr[i + 1]\` becomes \`arr[${size}]\`, but the array has only ${n} slots, 0 to ${n - 1}. The course Array checks every index, so the off-by-one is caught at once.`
        : `Slot ${size} exists (the array is not full) and holds None, so the bug hides: it copies None and line 7 writes None again. Run it on a full array to see it crash.`);
  else
    T.ask(`How many values move one slot to the left?`, size - index - 1, alts(size - index - 1, [size - index, size, index, 1]),
      `The values in slots ${index + 1} to ${size - 1} each move left: ${size} − ${index} − 1 = ${size - index - 1}.` + (index === size - 1 ? ' Removing the last value moves nothing: O(1).' : index === 0 ? ' Removing the first moves all the rest: O(n).' : ''));
  let first = true;

    T.set('i', i);

    T.at(5, first ? `The loop runs i = ${idxs.join(', ')}, from the front forwards. \`i\` = ${i}.` : `\`i\` = ${i}.`);
    first = false;
    const v = T.rd('arr', i + 1);
    T.wr('arr', i, v, { b: 'arr', i: i + 1 });
    T.count('shifts');
    T.at(6, `\`arr[${i}] = arr[${i + 1}]\`: copy ${C(v)} one slot left.`);
  }
  T.ptr([]);
  T.at(5, idxs.length ? `The loop is done: ${plural(idxs.length, 'value')} moved left.` : `\`range(${index}, ${stop})\` is empty: nothing to move.`);
  if (bug !== 'noclear') {

    T.wr('arr', size - 1, null);
    T.size('arr', size - 1);

    return T.ret(value, 8, `Return the removed value, ${C(value)}. The caller's size is now ${size - 1}.`);
  }
  T.size('arr', size - 1);
  const stale = T.B('arr').cells[size - 1];
  T.ptr([['arr', size - 1, 'size - 1', true]]);
  T.ask(`The function is about to return. What does slot ${size - 1} hold now?`, pyrepr(stale), ['None', pyrepr(value), 'Nothing: the slot is gone'],

function revBetween(T, lo, hi, L, note) {
  T.call('_reverse_between', [['arr', REF('arr')], ['lo', lo], ['hi', hi]], `_reverse_between(arr, ${lo}, ${hi})`, { line: L,
    msg: `Call \`_reverse_between(arr, ${lo}, ${hi})\`: reverse slots ${lo} to ${hi}, both included.` + (note || '') });
  let first = true;
  for (;;) {
    T.ptr([['arr', lo, 'lo', true], ['arr', hi, 'hi', true]]);
    const go = lo < hi;
    T.at(L + 1, `Is \`lo < hi\`? ${lo} < ${hi}: ${go ? 'yes.' : '**no**: ' + (lo === hi ? 'they meet in the middle slot, which stays where it is.' : hi < lo && first ? 'the range is empty, nothing to do.' : 'they have crossed.')}`);
    if (!go) break;
    const a = T.rd('arr', hi), b = T.rd('arr', lo);
    T.wr('arr', lo, a, { b: 'arr', i: hi });
    T.wr('arr', hi, b, { b: 'arr', i: lo });
    T.count('swaps');
    T.at(L + 2, `Swap slots ${lo} and ${hi}: ${C(b)} and ${C(a)} change places. No second array is needed.`);
    lo++; T.set('lo', lo);
    T.at(L + 3, `\`lo\` moves right, to ${lo}.`);
    hi--; T.set('hi', hi);
    T.at(L + 4, `\`hi\` moves left, to ${hi}.`);
    first = false;
  }
  T.ptr([]);
  return T.ret(null, L + 1, `The loop ends. \`_reverse_between\` returns None: it changed arr in place.`);
}

const ROTATE_CODE = `def rotate_left(arr, k):
    n = len(arr)
    if n == 0:
        return
    k %= n
    _reverse_between(arr, 0, k - 1)           # [1 2 | 3 4 5] -> [2 1 | 3 4 5]
    _reverse_between(arr, k, n - 1)           #               -> [2 1 | 5 4 3]
    _reverse_between(arr, 0, n - 1)           #               -> [3 4 5 1 2]

    while lo < hi:
        arr[lo], arr[hi] = arr[hi], arr[lo]

        i++; T.set('i', i); P(); T.at(7, `\`i\` = ${i}.`);
      } else {
        T.wr('result', k, T.rd('b', j), { b: 'b', i: j });
        T.at(9, `\`result[${k}] = b[${j}]\` = ${y}.`);
        j++; T.set('j', j); P(); T.at(10, `\`j\` = ${j}.`);
      }
      k++; T.set('k', k); P(); T.at(11, `\`k\` = ${k}.`);
    }
    const tail = (key, L, n, getIdx, setIdx, name) => {
      let first = true;
      for (;;) {
        P();
        const go = getIdx() < n;
        T.at(L, `Is \`${name} < ${n}\`? ${name} = ${getIdx()}: ${go ? (first ? 'yes. The values left are already sorted and all larger: copy them across, no comparisons.' : 'yes.') : 'no.'}`);
        if (!go) break;
        first = false;
        const t = getIdx();
        T.wr('result', k, T.rd(key, t), { b: key, i: t });
        T.at(L + 1, `\`result[${k}] = ${key}[${t}]\`.`);
        setIdx(t + 1); T.set(name, t + 1); P(); T.at(L + 2, `\`${name}\` = ${t + 1}.`);
        k++; T.set('k', k); P(); T.at(L + 3, `\`k\` = ${k}.`);
      }
    };
    tail('a', 12, na, () => i, v => { i = v; }, 'i');
    tail('b', 16, nb, () => j, v => { j = v; }, 'j');
    T.ptr([]);
    return T.ret(REF(arrRepr(T.B('result').cells)), 20, `Return the merged Array: ${na + nb} values, each written once.`);
  },
  summary: (T) => ` ${plural(T.counters.comparisons, 'comparison')} and ${T.counters.writes} writes for ${T.B('result').cells.length} values.`,
});

def({

/* ---- DynamicArray -------------------------------------------------- */
function setupDA(T, values, growth) {
  const st = dynState(values, growth);
  T.da = { size: values.length, cap: st.cap, growth, resizes: st.resizes };
  T.block('main', st.cells, { label: 'da._block' });
  T.set('da', REF('a DynamicArray'), T.stack[0]);
  syncDA(T);
}
function syncDA(T) {
  const b = T.B('main'), d = T.da;
  b.size = Math.min(d.size + (d.grow || 0), b.cells.length);   // grow: the slot being filled right now
  b.meta = `_size ${d.size} · _capacity ${d.cap}` + (b.cells.length !== d.cap ? ` · but the block has ${plural(b.cells.length, 'slot')}!` : '');
  for (const f of T.stack) if (f.locals.some(l => l[0] === 'self')) { T.set('self._size', d.size, f); T.set('self._capacity', d.cap, f); }
}

const RESIZE_CODE = `    def _resize(self, capacity):
        block = make_block(capacity)
        for i in range(self._size):
            block[i] = self._block[i]
        self._block = block
        self._capacity = capacity
        self.resize_count += 1`;
const RESIZE_NOCOPY = `    def _resize(self, capacity):
        block = make_block(capacity)
        self._block = block                 # the old values were never copied
        self._capacity = capacity
        self.resize_count += 1`;
const RESIZE_NOSWITCH = `    def _resize(self, capacity):
        block = make_block(capacity)
        for i in range(self._size):
            block[i] = self._block[i]
        self._capacity = capacity           # forgot: self._block = block
        self.resize_count += 1`;

/* _resize, whose def is on line L. kind: 'ok' | 'nocopy' | 'noswitch'. */
function resizeMirror(T, capacity, kind, L) {
  T.call('_resize', [['self', REF('da')], ['capacity', capacity]], `_resize(${capacity})`, { line: L,
    msg: `Call \`_resize(${capacity})\`. A fixed block cannot grow, so this makes a new one and moves in.` });
  syncDA(T);
  T.block('new', Array(capacity).fill(null), { label: 'block (new)', meta: `${capacity} slots` });
  T.set('block', REF('the new block'));
  T.at(L + 1, `\`make_block(${capacity})\`: a new, empty block of ${capacity} slots, below the old one.`);
  let ln = L + 2;
  if (kind !== 'nocopy') {
    const n = T.da.size;
    for (let i = 0; i < n; i++) {
      T.set('i', i);
      T.ptr([['main', i, 'i', false], ['new', i, 'i', true]]);
      T.at(L + 2, i === 0 ? `Copy all ${plural(n, 'value')} across, one at a time. \`i\` = 0.` : `\`i\` = ${i}.`);
      const v = T.rd('main', i);
      T.wr('new', i, v, { b: 'main', i });
      T.count('copies');
      T.at(L + 3, `\`block[${i}] = self._block[${i}]\`: copy ${C(v)}.`);
    }
    T.ptr([]);
    T.at(L + 2, `The copy loop is done: ${plural(n, 'value')} copied. This is the expensive part, O(n).`);
    ln = L + 4;
  }
  if (kind !== 'noswitch') {
    const oldCells = T.B('main').cells;
    T.B('main').cells = T.B('new').cells;
    T.drop('new');
    T.block('old', oldCells, { label: 'the old block', meta: 'nothing refers to it now', old: true });
    T.unset('block'); T.set('block', REF('da._block'));
    syncDA(T);
    T.at(ln, `\`self._block = block\`: da now uses the new block. Nothing refers to the old block any more, so Python frees it.`);
    if (kind === 'nocopy')
      T.ask(`da now uses the new block. What is in its slot 0?`, 'None', ['1', 'The old value, copied automatically', 'IndexError'],
        'make_block gives a block of None. Nothing copied the old values, so they were left behind in the old block, which is now garbage. The data is lost.');
    T.drop('old');
    ln++;
  }
  T.da.cap = capacity; syncDA(T);
  T.at(ln, `\`self._capacity = ${capacity}\`.` + (kind === 'noswitch' ? ` **But \`self._block\` still refers to the old ${plural(T.B('main').cells.length, 'slot')} block.** The new block is only in the local variable \`block\`.` : ''));
  ln++;
  T.da.resizes++; T.count('resizes');
  if (kind === 'noswitch') { T.B('new').old = true; T.B('new').meta = 'lost when _resize returns'; }
  T.at(ln, `\`resize_count\` is now ${T.da.resizes}.`);
  T.ret(null, ln, `\`_resize\` ends and returns None.` + (kind === 'noswitch' ? ' Its local `block` disappears with its frame, and the new block with it.' : ''));
  if (kind === 'noswitch') T.drop('new');
}

const APPEND_CODE = `class DynamicArray:
    def append(self, value):
        if self._size == self._capacity:
            self._resize(self._capacity * self.growth)
        self._block[self._size] = value
        self._size += 1

` + RESIZE_CODE;
const APPEND_PLUS1 = APPEND_CODE.replace('            self._resize(self._capacity * self.growth)', '            self._resize(self._capacity + 1)     # grow by ONE slot');
const APPEND_NOCOPY = APPEND_CODE.replace(RESIZE_CODE, RESIZE_NOCOPY);
const APPEND_NOSWITCH = APPEND_CODE.replace(RESIZE_CODE, RESIZE_NOSWITCH);

function appendMirror(T, v, kind, st) {
  const w0 = T.counters.writes, d = T.da;
  T.call('append', [['self', REF('da')], ['value', v]], `append(${v})`, { line: 2,
    msg: T.counters.calls < 1 ? `Call \`da.append(${v})\`. Python pushes a frame with \`self\` (da) and \`value\`.` : `Call \`da.append(${v})\`.` });
  syncDA(T);
  const full = d.size === d.cap;
  T.ptr([['main', d.size, 'self._size', false]]);
  T.at(3, `Is \`self._size == self._capacity\`? ${d.size} == ${d.cap}: ${full ? '**yes**, every slot is in use.' : 'no, there is a free slot.'}`);
  if (kind === 'plus1' && v === 1)
    T.ask(`This version grows by one slot each time. Over all ${st.n} appends, how many values will be copied in total?`, st.n * (st.n - 1) / 2, [st.n - 1, 2 * st.n, (1 << Math.floor(Math.log2(st.n - 1) + 1)) - 1],
      `Once the first block is full, every append is a resize that copies everything: 1 + 2 + … + ${st.n - 1} = ${st.n * (st.n - 1) / 2}. That is O(n²) in total, O(n) per append. Doubling copies only ${(1 << Math.ceil(Math.log2(st.n))) - 1}.`);
  if (kind === 'ok' && !full && d.size >= 3 && !st.askedRoom && st.n > 5) {
    st.askedRoom = true;
    T.ask(`There is room. How many writes will this append cost?`, '1', ['0', String(d.size + 1), String(d.cap)],
      'One write into the free slot, then the size goes up. Most appends are this cheap.');
  }
  if (full) {
    const newCap = kind === 'plus1' ? d.cap + 1 : d.cap * d.growth;
    if (kind === 'ok' && d.growth > 1 && d.size >= 3 && !st.askedFull) {
      st.askedFull = true;
      T.ask(`The block is full (${d.size} of ${d.cap}). How many writes will this one append cost in all?`, d.size + 1, ['1', d.size, 2 * d.size + 1],
        `_resize copies all ${d.size} values into a block of ${newCap}, then the new value is written: ${d.size} + 1 = ${d.size + 1}. Expensive, but the next ${newCap - d.size - 1} appends are cheap again.`);
    }
    if (kind === 'ok' && d.growth === 1)
      T.ask(`\`growth\` is 1. How many slots will the new block have?`, d.cap, [d.cap + 1, d.cap * 2, 0],
        `\`self._capacity * self.growth\` = ${d.cap} * 1 = ${d.cap}. The "bigger" block is the same size, so it is still full.`);
    T.at(4, kind === 'plus1' ? `Grow by one: \`_resize(${d.cap} + 1)\` = \`_resize(${newCap})\`.` : `Grow: \`_resize(${d.cap} * ${d.growth})\` = \`_resize(${newCap})\`.`);
    resizeMirror(T, newCap, kind === 'plus1' ? 'ok' : kind, 8);
    syncDA(T);
    if (kind === 'noswitch')
      T.ask(`\`self._capacity\` is ${d.cap}, but \`self._block\` still has ${plural(T.B('main').cells.length, 'slot')}. What does \`self._block[${d.size}] = ${v}\` do?`,
        `IndexError: the old block has no slot ${d.size}`, [`Writes ${v} into the new block`, 'Grows the old block by one slot', `Writes ${v} into slot 0`],
        `\`self._block\` was never switched, so it is still the old block. The course Array checks the index and refuses.`);
  }
  T.ptr([['main', d.size, 'self._size', true]]);
  T.wr('main', d.size, v);
  d.grow = 1; syncDA(T);
  T.at(5, `\`self._block[${d.size}] = ${v}\`: one write.`);
  d.grow = 0; d.size++; syncDA(T);
  T.ptr([]);
  T.at(6, `\`self._size\` is now ${d.size}.`);
  const cost = T.counters.writes - w0;
  T.extra.costs.push({ c: cost, rs: full });
  T.count('appends');
  return T.ret(null, 6, `\`append(${v})\` is done. It cost ${plural(cost, 'write')}` + (full ? ` (${cost - 1} cop${cost - 1 === 1 ? 'y' : 'ies'} + 1).` : '.'), { quiet: true });
}
function appendsRun(T, p, kind) {
  T.extra.costs = [];
  T.extra.costsN = p.n - 1;
  const st = { n: p.n - 1 };
  T.stack[0].note = `for v in range(1, ${p.n}): da.append(v)`;
  for (let v = 1; v < p.n; v++) {
    T.set('v', v, T.stack[0]);
    appendMirror(T, v, kind, st);
  }
  T.snap(`The loop is over: ${plural(p.n - 1, 'append')}.`);
  return null;
}
const appendSummary = (T) => {
  const n = T.counters.appends, tot = T.counters.writes;
  return ` ${n} value writes + ${T.counters.copies} copies = ${tot} writes for ${plural(n, 'append')}: ${(tot / Math.max(1, n)).toFixed(2)} per append on average.`;
};
const APPEND_BASE = {
  call: [['da = DynamicArray(growth=', 'growth', ')'], ['for v in range(1, ', 'n', '): da.append(v)']],
  counters: { appends: 'Appends', copies: 'Copies', resizes: 'Resizes', writes: 'Writes' },
  views: ['costs'],
  setup: (T, p) => setupDA(T, [], p.growth),
  after: SHOW_DA,
};
def(Object.assign({}, APPEND_BASE, {
  id: 'append_double', group: 'dyn', title: 'append: doubling, amortised O(1)',
  blurb: 'When the block is full, append makes one twice as big and copies everything across. A few appends are expensive, most cost one write; the average stays below 3.',
  code: APPEND_CODE,
  params: { growth: { type: 'int', def: 2, min: 2, max: 3 }, n: { type: 'int', def: 10, min: 1, max: 18 } },
  run: (T, p) => appendsRun(T, p, 'ok'),
  summary: appendSummary,
}));

/* ---- insert_at with a resize ---------------------------------------- */
const DYN_INSERT_CODE = `class DynamicArray:
    def insert_at(self, index, value):
        if not 0 <= index <= self._size:
            raise IndexError(index)
        if self._size == self._capacity:
            self._resize(self._capacity * self.growth)
        for i in range(self._size, index, -1):
            self._block[i] = self._block[i - 1]
        self._block[index] = value
        self._size += 1

` + RESIZE_CODE;
def({
  id: 'dyn_insert', group: 'dyn', title: 'insert_at when full: resize, then shift',
  blurb: 'The block is full, so insert_at first moves everything into a bigger block, then shifts the values after the index right. Two O(n) costs in one call.',
  code: DYN_INSERT_CODE,
  call: [['da = DynamicArray(', 'values', ')'], ['da.insert_at(', 'index', ', ', 'value', ')']],
  params: { values: { type: 'list', def: [10, 20, 30, 40], minLen: 0, maxLen: 9, check: allInts('values') }, index: { type: 'int', def: 1, min: -5, max: 12 }, value: { type: 'int', def: 99, min: -999, max: 999 } },
  counters: { copies: 'Copies', shifts: 'Shifts', writes: 'Writes' },
  setup: (T, p) => setupDA(T, p.values, 2),
  after: SHOW_DA,
  run: (T, p) => {
    const d = T.da, index = p.index, value = p.value;
    T.call('insert_at', [['self', REF('da')], ['index', index], ['value', value]], `insert_at(${index}, ${value})`, { line: 2 });
    syncDA(T);
    const ok = index >= 0 && index <= d.size;
    T.at(3, `Is \`0 <= ${index} <= ${d.size}\`? ${ok ? 'Yes.' : '**No.**'}`);
    if (!ok) { T.at(4, `So it raises IndexError(${index}).`); throw new PyErr('IndexError', String(index), {}); }
    const full = d.size === d.cap;
    T.at(5, `Is \`self._size == self._capacity\`? ${d.size} == ${d.cap}: ${full ? '**yes**, full.' : 'no.'}`);
    if (full) {
      T.ask(`The block is full. What happens first?`, `_resize copies all ${d.size} values into a block of ${d.cap * 2}`, ['The values after the index shift right', 'OverflowError: array is full', `Only the values after index ${index} are copied`],
        'There is no free slot to shift into, so the block must grow first: a full copy. Then the shift happens inside the new block.');
      T.at(6, `Grow first: \`_resize(${d.cap} * ${d.growth})\` = \`_resize(${d.cap * d.growth})\`.`);
      resizeMirror(T, d.cap * d.growth, 'ok', 12);
      syncDA(T);
    }
    const idxs = range(d.size, index, -1);
    d.grow = 1; syncDA(T);
    for (const i of idxs) {
      T.set('i', i);
      T.ptr([['main', i, 'i', true], ['main', i - 1, 'i - 1', false]]);
      T.at(7, i === idxs[0] ? `Shift from the end backwards: i = ${idxs.join(', ')}. \`i\` = ${i}.` : `\`i\` = ${i}.`);
      const v = T.rd('main', i - 1);
      T.wr('main', i, v, { b: 'main', i: i - 1 });
      T.count('shifts');
      T.at(8, `\`self._block[${i}] = self._block[${i - 1}]\`: ${C(v)} moves one slot right.`);
    }
    T.ptr([['main', index, 'index', true]]);
    T.wr('main', index, value);
    T.at(9, `\`self._block[${index}] = ${value}\`.`);
    d.grow = 0; d.size++; syncDA(T); T.ptr([]);
    T.at(10, `\`self._size\` is now ${d.size}.`);
    return T.ret(null, 10, `\`insert_at\` returns None, so the shell prints nothing.`);
  },
  summary: (T) => ` ${T.counters.copies} copies + ${T.counters.shifts} shifts + 1 write.`,
});

/* ---- pop ------------------------------------------------------------ */
const POP_CODE = `class DynamicArray:
    def pop(self, index=-1):
        if self._size == 0:
            raise IndexError("pop from empty DynamicArray")
        if index < 0:
            index += self._size
        if not 0 <= index < self._size:
            raise IndexError("index out of range")
        value = self._block[index]
        for i in range(index, self._size - 1):
            self._block[i] = self._block[i + 1]
        self._size -= 1
        self._block[self._size] = None
        return value`;
function popMirror(T, index0, explicit) {
  const d = T.da;
  T.call('pop', [['self', REF('da')], ['index', index0]], explicit ? `pop(${index0})` : 'pop()', { line: 2,
    msg: explicit ? `Call \`da.pop(${index0})\`.` : 'Call `da.pop()`. No argument, so `index` takes its default, -1: the end.' });
  syncDA(T);
  T.at(3, `Is \`self._size == 0\`? ${d.size === 0 ? '**Yes**: nothing to pop.' : 'No.'}`);
  if (d.size === 0) { T.at(4, 'So it raises IndexError.'); throw new PyErr('IndexError', 'pop from empty DynamicArray', {}); }
  let index = index0;
  T.at(5, `Is \`index < 0\`? ${index < 0 ? 'Yes.' : 'No.'}`);
  if (index < 0) { index += d.size; T.set('index', index); T.at(6, `\`index += self._size\`: ${index0} + ${d.size} = ${index}.` + (index0 === -1 ? ' The last USED slot, not the last slot of the block.' : '')); }
  const ok = index >= 0 && index < d.size;
  T.at(7, `Is \`0 <= ${index} < ${d.size}\`? ${ok ? 'Yes.' : '**No.**'}`);
  if (!ok) { T.at(8, 'So it raises IndexError.'); throw new PyErr('IndexError', 'index out of range', {}); }
  T.ptr([['main', index, 'index', true]]);
  const value = T.rd('main', index);
  T.set('value', value);
  T.at(9, `\`value\` = ${C(value)}.`);
  const idxs = range(index, d.size - 1);
  T.ask(`How many values will move one slot left?`, idxs.length, alts(idxs.length, [d.size - 1, 0, d.size, 1]),
    idxs.length ? `Every value after slot ${index} moves left to close the gap: ${idxs.length}. Popping from the front is O(n).` : 'None: the end has nothing after it. Popping from the end is O(1).');
  for (const i of idxs) {
    T.set('i', i);
    T.ptr([['main', i, 'i', true], ['main', i + 1, 'i + 1', false]]);
    T.at(10, i === idxs[0] ? `Close the gap, front first: i = ${idxs.join(', ')}. \`i\` = ${i}.` : `\`i\` = ${i}.`);
    const v = T.rd('main', i + 1);
    T.wr('main', i, v, { b: 'main', i: i + 1 });
    T.count('shifts');
    T.at(11, `\`self._block[${i}] = self._block[${i + 1}]\`: ${C(v)} moves one slot left.`);
  }
  T.ptr([]);
  if (idxs.length) T.at(10, `The loop is done: ${plural(idxs.length, 'value')} moved.`);
  d.size--; syncDA(T);
  T.at(12, `\`self._size\` is now ${d.size}.`);
  T.ptr([['main', d.size, 'self._size', true]]);
  T.wr('main', d.size, null);
  T.at(13, `Clear slot ${d.size}, so the block no longer refers to the old value.`);
  T.ptr([]);
  return T.ret(value, 14, `Return ${C(value)}.`);
}
const POP_BASE = { group: 'dyn', code: POP_CODE,
  counters: { shifts: 'Shifts', writes: 'Writes' },
  setup: (T, p) => setupDA(T, p.values, 2),
  after: SHOW_DA,
  summary: (T) => ` ${plural(T.counters.shifts, 'shift')}.` };
const POP_VALUES = { type: 'list', def: [10, 20, 30, 40, 50, 60], minLen: 0, maxLen: 9, check: allInts('values') };
def(Object.assign({}, POP_BASE, { id: 'pop_end', title: 'pop(): from the end, O(1)',
  blurb: 'pop() removes the last value in use. Nothing moves: one read, one slot cleared.',
  call: [['da = DynamicArray(', 'values', ')'], ['da.pop()']],

def(Object.assign({}, POP_BASE, { id: 'pop_front', title: 'pop(0): from the front, O(n)',
  blurb: 'pop(0) removes the first value. Every other value moves one slot left to close the gap.',

/* ---- da[-1]: negative indices, done by hand ------------------------- */
def({
  id: 'dyn_getitem', group: 'dyn', title: 'da[-1]: the last USED slot',
  blurb: 'DynamicArray adds negative indices itself, on top of an Array that has none. -1 means the last value in use, not the last slot of the block.',
  code: `class DynamicArray:
    def __getitem__(self, index):
        if index < 0:
            index += self._size               # -1 means the last USED slot
        if not 0 <= index < self._size:

  call: [['da = DynamicArray(', 'values', ')'], ['da[', 'index', ']']],
  params: { values: { type: 'list', def: [10, 20, 30, 40, 50, 60], minLen: 0, maxLen: 9, check: allInts('values') }, index: { type: 'int', def: -1, min: -12, max: 12 } },
  counters: { reads: 'Reads' },
  setup: (T, p) => setupDA(T, p.values, 2),
  after: SHOW_DA,
  run: (T, p) => {
    const d = T.da, i0 = p.index;
    T.call('__getitem__', [['self', REF('da')], ['index', i0]], `da.__getitem__(${i0})`, { line: 2, msg: `\`da[${i0}]\` calls \`da.__getitem__(${i0})\`.` });
    syncDA(T);
    let index = i0;
    T.at(3, `Is \`index < 0\`? ${index < 0 ? 'Yes.' : 'No.'}`);

/* Build the full trace for one scenario and its inputs. */
function lineText(sc, line, p) {
  return line.map(part => (part in (sc.params || {})) ? pyrepr(p[part]) : part).join('');
}
function build(sc, p) {
  const T = new Tracer(sc);
  const lines = sc.call.map(l => lineText(sc, l, p));
  const ci = lines.length - 1;
  for (let k = 0; k < ci; k++) T.out.push({ k: 'prompt', t: '>>> ' + lines[k] });
  if (sc.setup) sc.setup(T, p);
  T.out.push({ k: 'prompt', t: '>>> ' + lines[ci] });
  T.stack[0].note = '>>> ' + lines[ci];
  T.snap(`Ready. Press **Step** to run \`${lines[ci]}\`.`);
  let v, failed = false;
  try {
    v = sc.run(T, p);
  } catch (e) {
    if (e instanceof PyErr) { T.raise(e); failed = true; } else throw e;
  }
  const summary = !failed && sc.summary ? sc.summary(T, v, p) : '';
  T.inputs = lines.slice();
  if (sc.after) {
    const shown = [];
    for (const a of sc.after) {
      const r = a.v(T, p);
      T.out.push({ k: 'prompt', t: '>>> ' + a.t }, { k: 'ret', t: r, fresh: true });
      shown.push(`\`${a.t}\` is \`${r}\``);
      T.inputs.push(a.t);
    }
    T.ptr([]);
    T.snap(`Afterwards, in the shell: ${shown.join('; ')}.` + summary);
  } else if (summary) T.steps[T.steps.length - 1].msg += summary;
  return T;
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const md = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');

const KW = new Set(['def', 'if', 'return', 'for', 'in', 'not', 'is', 'None', 'else', 'and', 'or', 'True', 'False', 'while', 'class', 'raise', 'self']);
const BI = new Set(['print', 'len', 'range', 'min', 'isinstance', 'Array', 'DynamicArray', 'make_block', 'OverflowError', 'IndexError', 'TypeError', 'operator']);
function highlight(line) {
  const re = /(#.*$)|([fF]?"(?:[^"\\]|\\.)*"|[fF]?'(?:[^'\\]|\\.)*')|(\b\d+\b)|([A-Za-z_]\w*)|(\s+|.)/g;
  let m, html = '', prev = '';
  while ((m = re.exec(line))) {
    if (m[1]) html += `<span class="t-com">${esc(m[1])}</span>`;
    else if (m[2]) html += `<span class="t-str">${esc(m[2])}</span>`;
    else if (m[3]) html += `<span class="t-num">${m[3]}</span>`;
    else if (m[4]) {
      const w = m[4];

      else if (KW.has(w)) html += `<span class="t-kw">${w}</span>`;

const state = { sc: null, params: {}, T: null, idx: 0, answered: new Map(), quiz: true, timer: null, prevSnap: null, nudge: '', forward: false };

function initPicker() {

function loadScenario(id) {

function renderCallStrip() {

        inp.addEventListener('change', applyParams);

function parsePy(text) {
  const j = text.trim().replace(/'/g, '"').replace(/\bNone\b/g, 'null').replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false');
  return JSON.parse(j);
}
function applyParams() {
  const sc = state.sc, next = {}; let err = '';
  for (const k in sc.params) {
    const spec = sc.params[k], inp = $('param-' + k);
    inp.classList.remove('bad');
    try {
      if (spec.type === 'int') {
        if (!/^\s*-?\d+\s*$/.test(inp.value)) throw new Error(`${k} must be a whole number.`);
        const v = parseInt(inp.value, 10);
        if (v < spec.min || v > spec.max) throw new Error(spec.min === spec.max ? `This scenario is about ${k} = ${spec.min}.` : `For this demo, ${k} must be between ${spec.min} and ${spec.max}.`);
        next[k] = v;
      } else {
        let v; try { v = parsePy(inp.value); } catch (e) { throw new Error(`${k} must be a Python list, like ${pyrepr(spec.def)}.`); }
        if (!Array.isArray(v)) throw new Error(`${k} must be a list.`);
        if (v.length < spec.minLen || v.length > spec.maxLen) throw new Error(`For this demo, ${k} must have ${spec.minLen} to ${spec.maxLen} items.`);
        const ok = spec.check ? spec.check(v) : true;
        if (ok !== true) throw new Error(ok);
        next[k] = v;
      }
    } catch (e) { inp.classList.add('bad'); err = e.message; }
  }
  if (!err && sc.check) { const ok = sc.check(next); if (ok !== true) err = ok; }
  $('callerr').textContent = err;
  if (err) return;
  state.params = next;
  for (const k in next) { const inp = $('param-' + k); inp.value = pyrepr(next[k]); inp.size = Math.max(2, inp.value.length); }
  rebuild();
}

function rebuild() {
  stop();
  state.T = build(state.sc, state.params);
  state.idx = 0; state.answered = new Map(); state.prevSnap = null;
  $('scrub').max = state.T.steps.length - 1;
  render();
}

/* ---------- navigation ---------- */
const snapAt = i => state.T.steps[i];
const pendingQ = () => { const s = snapAt(state.idx); return state.quiz && s.q && !state.answered.has(state.idx); };
function go(i, opts) {
  opts = opts || {};
  const N = state.T.steps.length;
  i = Math.max(0, Math.min(N - 1, i));
  if (i === state.idx) return false;
  state.prevSnap = snapAt(state.idx);
  state.forward = i === state.idx + 1;
  state.idx = i;
  state.nudge = '';
  render(opts);
  return true;
}
function guard() {
  if (pendingQ()) { state.nudge = 'Answer the question first (keys A–D), or press Reveal.'; $('nudge').textContent = state.nudge; return false; }
  return true;
}
function step() { if (!guard()) { stop(); return false; } return go(state.idx + 1); }
function back() { stop(); go(state.idx - 1); }
function stepOver() {
  if (!guard()) return;
  stop();
  const S = state.T.steps, d = S[state.idx].depth;
  let j = state.idx + 1;
  if (j < S.length && S[j].depth > d) { while (j < S.length && S[j].depth > d) j++; }
  go(j);
}
function stepOut() {
  if (!guard()) return;
  stop();
  const S = state.T.steps, d = S[state.idx].depth;
  let j = state.idx + 1;
  while (j < S.length && S[j].depth >= d && d > 0) j++;
  go(j);
}
function play() {
  if (state.timer) { stop(); return; }
  if (state.idx >= state.T.steps.length - 1) go(0);
  $('bPlay').innerHTML = 'Pause <kbd>P</kbd>'; $('bPlay').classList.add('on');
  const tick = () => {
    if (!step() || state.idx >= state.T.steps.length - 1 || pendingQ()) { stop(); return; }
    state.timer = setTimeout(tick, delay());
  };
  state.timer = setTimeout(tick, Math.min(400, delay()));
}
function stop() {
  if (state.timer) clearTimeout(state.timer);
  state.timer = null;
  $('bPlay').innerHTML = 'Play <kbd>P</kbd>'; $('bPlay').classList.remove('on');
}
const delay = () => [2600, 2000, 1500, 1150, 900, 700, 520, 380, 260, 160][+$('speed').value - 1];

function answer(k) {
  const s = snapAt(state.idx);

  state.answered.set(state.idx, k);
  state.nudge = '';
  renderNarr();
  $('nudge').textContent = '';
}

/* ---------- rendering ---------- */
function render(opts) {
  const s = snapAt(state.idx);
  renderCode(s);
  renderNarr();
  renderStack(s);
  renderViews(s);
  renderOut(s);
  renderTransport(s);
}

function renderCode(s) {
  const lines = state.sc.code.split('\n');
  const frames = s.stack.slice(1), top = s.stack[s.stack.length - 1];
  const waiting = {};
  for (const f of frames) if (f !== top || top.status === 'error') if (f.status === 'waiting') (waiting[f.line] = waiting[f.line] || []).push(f);
  const errLine = s.kind === 'err' && frames.length ? frames[frames.length - 1].line : 0;
  let html = '';
  lines.forEach((ln, i) => {
    const no = i + 1;
    let cls = '';
    const tags = [];
    if (top.fn !== '<module>' && top.line === no) {
      if (top.status === 'returning') { cls = 'ret'; tags.push(`<span class="tag r">returns ${esc(clip(pyrepr(top.ret), 22))}</span>`); }
      else if (top.status === 'error') { cls = 'errl'; tags.push(`<span class="tag e">error here</span>`); }
      else { cls = 'cur'; tags.push(`<span class="tag a">${esc(clip(top.label, 26))}</span>`); }
    } else if (errLine === no) cls = 'errl';

    html += `<div class="ln ${cls}"><span class="no">${no}</span><span class="src">${highlight(ln) || ' '}</span><span class="tags">${tags.join('')}</span></div>`;
  });
  $('code').innerHTML = html;
  $('lineInfo').textContent = top.fn === '<module>' ? '' : `${top.label} · line ${top.line}`;
  const cur = $('code').querySelector('.ln.cur, .ln.ret, .ln.errl');
  if (cur) { const c = $('code'); if (cur.offsetTop < c.scrollTop || cur.offsetTop > c.scrollTop + c.clientHeight - 30) c.scrollTop = cur.offsetTop - c.clientHeight / 2; }
}

function renderNarr() {

function renderStack(s) {

    if (N <= 20) g += `<text x="${L + k * bw + bw / 2}" y="${H - 5}" text-anchor="middle">${k + 1}</text>`;
  });
  const tot = costs.reduce((a, c) => a + c.c, 0);
  if (costs.length) {
    const avg = tot / costs.length, y = base - (base - top) * avg / maxC;
    g += `<line class="avg" x1="${L}" y1="${y}" x2="${L + costs.length * bw}" y2="${y}"/><text class="avgt" x="${L + costs.length * bw + 3 > W - 60 ? W - R : L + costs.length * bw + 3}" y="${y - 3}" text-anchor="${L + costs.length * bw + 3 > W - 60 ? 'end' : 'start'}">avg ${avg.toFixed(2)}</text>`;
  }
  return `<div class="costs"><div class="vlabel"><span>Cost of each append (writes)</span><span class="meta">${costs.length} done · ${tot} writes</span></div>` +
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cost of each append">${g}</svg>` +
    `<div class="legend"><span><i style="border-color:var(--wait);background:var(--wait)"></i>1 write: room in the block</span><span><i style="border-color:var(--err);background:var(--err)"></i>resize: copies + 1</span><span><i style="border-color:var(--done);border-style:dashed"></i>average so far</span></div></div>`;
}

function renderViews(s) {
  const box = $('views'), ex = s.extra;
  let html = '';
  for (const key of ex.order) html += blockHTML(key, ex.blocks[key], s);
  if (ex.order.length) html += `<div class="legend"><span><i style="border-color:var(--wait);background:var(--wait-bg)"></i>in use</span><span><i style="border-color:var(--line);border-style:dashed"></i>free</span><span><i style="border-color:var(--hit);background:var(--hit-bg)"></i>read</span><span><i style="border-color:var(--done);background:var(--done-bg)"></i>written</span>` +
    (Object.values(ex.blocks).some(b => b.size !== null) ? `<span><i style="border-color:var(--accent);border-width:0 0 0 3px;border-radius:0"></i>size boundary</span>` : '') + `</div>`;
  if ((state.sc.views || []).includes('costs')) html += costsHTML(s);
  box.innerHTML = html;
  $('viewMeta').textContent = ex.order.length > 1 ? `${ex.order.length} arrays` : '';
  animate(s);
}

/* Moves and copies: each written slot glides in from the slot it was copied from. */
function animate(s) {
  if (!state.forward || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = $('views');
  const ms = Math.min(520, delay() * 0.6);
  for (const f of s.extra.flash) {
    if (f.k !== 'wr') continue;
    const el = box.querySelector(`.cell[data-b="${f.b}"][data-i="${f.i}"] .bx`);
    if (!el || !el.animate) continue;
    const src = f.from && box.querySelector(`.cell[data-b="${f.from.b}"][data-i="${f.from.i}"] .bx`);
    if (src) {
      const a = src.getBoundingClientRect(), b = el.getBoundingClientRect();
      el.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px)`, opacity: .55 }, { transform: 'none', opacity: 1 }], { duration: ms, easing: 'cubic-bezier(.3,.7,.3,1)' });
    } else {
      el.animate([{ transform: 'scale(1.25)' }, { transform: 'none' }], { duration: ms, easing: 'ease-out' });
    }
  }
}

function renderOut(s) {
  const prevLen = state.prevSnap && state.prevSnap !== s ? state.prevSnap.out.length : s.out.length;
  const forward = state.prevSnap && state.prevSnap.out.length <= s.out.length;
  $('out').innerHTML = s.out.map((o, i) => `<span class="${o.k} ${forward && i >= prevLen ? 'new' : ''}">${esc(o.t)}</span>`).join('\n');
  $('out').scrollTop = $('out').scrollHeight;
}

function renderTransport(s) {
  const N = state.T.steps.length;
  $('scrub').value = state.idx;
  $('pos').textContent = `step ${state.idx} / ${N - 1}`;
  $('bBack').disabled = state.idx === 0;
  $('bStep').disabled = $('bOver').disabled = $('bOut').disabled = state.idx >= N - 1;
  const c = s.counters, sc = state.sc;
  let html = '';
  for (const k in (sc.counters || {})) html += `<span>${esc(sc.counters[k])} <b>${c[k] || 0}</b></span>`;
  $('stats').innerHTML = html;
  $('nudge').textContent = state.nudge;
}

/* ---------- controls ---------- */
function setTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('array-lab-theme', t || ''); } catch (e) {}
}
function wire() {
  $('bStep').addEventListener('click', () => { stop(); step(); });
  $('bBack').addEventListener('click', back);
  $('bOver').addEventListener('click', stepOver);
  $('bOut').addEventListener('click', stepOut);
  $('bPlay').addEventListener('click', play);
  $('bRestart').addEventListener('click', () => { stop(); go(0); });
  $('scrub').addEventListener('input', e => { stop(); go(+e.target.value); });
  $('bQuiz').addEventListener('click', () => {
    state.quiz = !state.quiz;
    $('bQuiz').innerHTML = `Questions: ${state.quiz ? 'on' : 'off'} <kbd>Q</kbd>`;
    $('bQuiz').classList.toggle('on', state.quiz);
    state.nudge = ''; renderNarr(); $('nudge').textContent = '';
  });
  $('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(dark ? 'light' : 'dark');
  });
  $('fsBtn').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.target.tagName === 'SELECT') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const s = snapAt(state.idx);
    if (s.q && state.quiz && !state.answered.has(state.idx)) {
      const map = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
      if (k in map && map[k] < s.q.choices.length) { e.preventDefault(); answer(map[k]); return; }
      if (k === 'v') { e.preventDefault(); answer(-1); return; }
    }
    if (k === 'arrowright' || k === ' ') { e.preventDefault(); stop(); step(); }
    else if (k === 'arrowleft') { e.preventDefault(); back(); }
    else if (k === 'o') stepOver();
    else if (k === 'u') stepOut();
    else if (k === 'p') play();
    else if (k === 'r') { stop(); go(0); }
    else if (k === 'e' || k === 'end') { stop(); go(state.T.steps.length - 1); }
    else if (k === 'q') $('bQuiz').click();
    else if (k === 'f') $('fsBtn').click();
  });
}

/* Self-check: open the page as array-lab.html#selftest to build every
   scenario with its default input and a few edge inputs. It prints one JSON
   record per run, which tools can replay in real Python. */
function selftest() {
  const recs = [];
  const extra = {
    getitem: [{ index: 0 }, { index: 6 }], find_best: [{ values: [7] }], find_missing: [{ values: [1, 7, 7], target: 7 }],
    insert_middle: [{ index: 9 }, { index: -1 }, { values: [1, 2, 3, null], size: 3, index: 0 }], insert_end: [{ size: 0, index: 0 }],
    insert_wrong_dir: [{ values: [1, 2, 3, null], size: 3, index: 0 }],
    remove_middle: [{ index: 6 }, { size: 1, index: 0 }], remove_oob: [{ values: [10, 20, 30, null], size: 3, index: 0 }],
    remove_noclear: [{ index: 5 }], reverse: [{ values: [1, 2] }, { values: [5] }, { values: [1, 2, 3, 4, 5, 6] }],
    rotate: [{ k: 0 }, { k: 10 }, { k: 1 }, { values: [9], k: 3 }], resized: [{ new_length: 3 }, { new_length: 0 }, { values: [] }],
    merge: [{ a: [] }, { a: [1, 2, 2], b: [2, 2] }, { b: [] }], neg_index: [{ index: -7 }],
    append_double: [{ growth: 3, n: 12 }, { n: 1 }, { n: 18 }], append_plus1: [{ n: 4 }], append_nocopy: [{ n: 2 }],
    dyn_insert: [{ index: 4 }, { values: [1, 2, 3] }, { index: 6 }, { values: [] , index: 0 }],
    pop_end: [{ values: [] }, { values: [7] }], pop_front: [{ index: -2 }, { index: 6 }, { index: -7 }, { values: [] }],
    dyn_getitem: [{ index: -7 }, { index: 9 }, { index: 2 }, { values: [] }],
  };
  for (const sc of SCENARIOS) {
    const base = {}; for (const k in sc.params) base[k] = sc.params[k].def;
    for (const p of [base, ...(extra[sc.id] || []).map(e => Object.assign({}, base, e))]) {
      const rec = { id: sc.id, p, cls: sc.cls || (sc.code.startsWith('class DynamicArray') ? 'DynamicArray' : ''), code: sc.code };
      try {
        const T = build(sc, p);
        rec.inputs = T.inputs;
        rec.outs = T.out.filter(o => o.k !== 'prompt').map(o => [o.k, o.t.split('\n').pop()]);
        rec.tb = T.out.filter(o => o.k === 'err').map(o => o.t);
        rec.reads = T.counters.reads; rec.writes = T.counters.writes;
        rec.steps = T.steps.length;
        rec.questions = T.steps.filter(x => x.q).length;
        const nl = sc.code.split('\n').length;
        rec.bad = [];
        if (T.steps.some(x => x.line > nl)) rec.bad.push('line out of range');
        for (const x of T.steps) if (x.q && (x.q.answer < 0 || x.q.choices.length < 3)) rec.bad.push('question: ' + x.q.text);
        state.sc = sc; state.T = T; state.prevSnap = null; state.forward = false;
        for (let i = 0; i < T.steps.length; i++) { state.forward = i > 0; state.idx = i; render(); }
      } catch (e) { rec.crash = e.message + ' ' + (e.stack || '').split('\n')[1]; }
      recs.push(rec);
    }
  }
  const pre = $('selftest'); pre.hidden = false; pre.textContent = JSON.stringify(recs);
}

initPicker();
wire();
try { const t = localStorage.getItem('array-lab-theme'); if (t) setTheme(t); } catch (e) {}
let startId = 'insert_middle';
try { startId = localStorage.getItem('array-lab-scenario') || startId; } catch (e) {}
/* #insert_middle opens a scenario; #insert_middle@12 also jumps to step 12. */
const [hashId, hashStep] = location.hash.slice(1).split('@');
if (SCENARIOS.some(s => s.id === hashId)) startId = hashId;
loadScenario(startId);
if (hashStep && SCENARIOS.some(s => s.id === hashId)) go(+hashStep);
if (location.hash === '#selftest') selftest();
</script>
