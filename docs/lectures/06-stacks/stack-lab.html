<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen classroom console. Code on the left; the picture of the stack on the right,
   with the variables and the shell under it; transport bar along the bottom. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --panel-2: #f4f6f9;
  --ink: #142033;
  --muted: #5a6679;
  --line: #d3d9e2;
  --accent: #c76a00;        /* the running line, the link about to change: a highlighter */
  --accent-bg: #ffefcc;
  --wait: #3456c7;          /* references held in variables */
  --wait-bg: #e6ecfc;
  --done: #23803a;          /* a link that just changed */
  --done-bg: #e2f4e6;
  --err: #c92a3a;
  --err-bg: #fde4e7;
  --hit: #0b7a8a;           /* prev links in a doubly linked list */
  --hit-bg: #dcf3f6;
  --kw: #8a2bb8; --str: #237a3a; --num: #b4520b; --com: #7b8798; --fn: #1d5fd0;
  --shadow: 0 1px 2px rgba(20,32,51,.06), 0 4px 14px rgba(20,32,51,.06);
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", Consolas, "Cascadia Mono", ui-monospace, monospace;
  --code-size: clamp(13px, 1.02vw, 19px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121a; --panel: #151c27; --panel-2: #1b2431; --ink: #e5eaf2; --muted: #95a1b4; --line: #2a3546;
    --accent: #f3a43a; --accent-bg: #3b2a0e; --wait: #8ea6ff; --wait-bg: #1d2747; --done: #5fd07a; --done-bg: #15301d;
    --err: #ff7a86; --err-bg: #3d1820; --hit: #4fd2e2; --hit-bg: #123338;
    --kw: #d39bff; --str: #8ad79a; --num: #ffb86b; --com: #7d8aa0; --fn: #7fb0ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121a; --panel: #151c27; --panel-2: #1b2431; --ink: #e5eaf2; --muted: #95a1b4; --line: #2a3546;
  --accent: #f3a43a; --accent-bg: #3b2a0e; --wait: #8ea6ff; --wait-bg: #1d2747; --done: #5fd07a; --done-bg: #15301d;
  --err: #ff7a86; --err-bg: #3d1820; --hit: #4fd2e2; --hit-bg: #123338;
  --kw: #d39bff; --str: #8ad79a; --num: #ffb86b; --com: #7d8aa0; --fn: #7fb0ff;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  display: flex; flex-direction: column;
  padding-inline: 16px; padding-block: 10px;
  gap: 10px;
}
body, code, pre, .mono, svg text, input { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
code, pre, .mono { font-family: var(--f-code); }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 22px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.picker { display: flex; align-items: center; gap: 8px; flex: 1 1 320px; min-width: 0; }
.picker select {
  flex: 1 1 auto; min-width: 0; max-width: 560px;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  font-size: 16px; font-weight: 700;
}
.top .tools { display: flex; gap: 6px; }

/* ---------- main grid ---------- */
main {
  flex: 1 1 auto; min-height: 0;
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, .56fr) minmax(0, .62fr);
  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-areas: "code pic pic" "code vars shell";
}
.code-pane { grid-area: code; } .pic-pane { grid-area: pic; } .vars-pane { grid-area: vars; } .shell-pane { grid-area: shell; }
.pane {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
}
.pane-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.pane-head .meta { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--f-code); font-size: 12px; text-align: right; }

/* ---------- code pane ---------- */
.about { padding: 8px 14px 0; display: flex; flex-direction: column; gap: 4px; }
.about h1 { margin: 0; font-size: 20px; line-height: 1.2; text-wrap: balance; }
.about p { margin: 0; color: var(--muted); font-size: 14px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.badge.works { background: var(--done-bg); color: var(--done); }
.badge.wrong { background: var(--err-bg); color: var(--err); }
.badge.cost { background: var(--accent-bg); color: var(--accent); }
.badge.ex { background: var(--wait-bg); color: var(--wait); }

.callstrip {
  margin: 8px 14px 0; padding: 6px 10px; border-radius: 8px; background: var(--panel-2);
  font-family: var(--f-code); font-size: var(--code-size);
  display: flex; align-items: center; flex-wrap: wrap; gap: 2px;
}
.callstrip .ps { color: var(--muted); margin-right: 6px; }
.callstrip .br { flex-basis: 100%; height: 0; }
.callstrip input {
  font-family: var(--f-code); font-size: inherit; padding: 1px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--num);
  min-width: 2.5ch; max-width: 100%; field-sizing: content;
}
.callstrip input.bad { border-color: var(--err); background: var(--err-bg); }
.callstrip .run { margin-left: auto; }
.callerr { margin: 4px 14px 0; color: var(--err); font-size: 13px; min-height: 0; }

.code {
  margin: 8px 14px; padding: 6px 0; border-radius: 8px; border: 1px solid var(--line);
  font-family: var(--f-code); font-size: var(--code-size); line-height: 1.45;
  overflow: auto; flex: 0 1 auto; min-height: 110px;
}
.ln { display: flex; align-items: center; min-width: max-content; padding-right: 10px; position: relative; }
.ln .no { width: 3ch; text-align: right; color: var(--com); padding-right: 12px; flex: 0 0 auto; user-select: none; }
.ln .src { white-space: pre; flex: 0 0 auto; }
.ln .tags { display: flex; gap: 4px; margin-left: 14px; flex: 0 0 auto; }
.ln .tag { font-family: var(--f-body); font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 999px; line-height: 1.6; }
.ln .tag.w { background: var(--wait-bg); color: var(--wait); }
.ln .tag.a { background: var(--accent); color: var(--panel); }
.ln .tag.r { background: var(--done); color: var(--panel); }
.ln .tag.e { background: var(--err); color: var(--panel); }
.ln.cur { background: var(--accent-bg); box-shadow: inset 4px 0 0 var(--accent); }
.ln.ret { background: var(--done-bg); box-shadow: inset 4px 0 0 var(--done); }
.ln.errl { background: var(--err-bg); box-shadow: inset 4px 0 0 var(--err); }
.ln.waitl { box-shadow: inset 4px 0 0 var(--wait); }
.ln.bug .no { color: var(--err); font-weight: 700; }
.t-kw { color: var(--kw); font-weight: 600; } .t-str { color: var(--str); } .t-num { color: var(--num); }
.t-com { color: var(--com); font-style: italic; } .t-fn { color: var(--fn); font-weight: 700; } .t-bi { color: var(--fn); }

.narr { margin: 0 14px 12px; flex: 1 0 100px; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.say { font-size: clamp(15px, 1.15vw, 21px); line-height: 1.45; max-width: 62ch; }
.say code, .qtext code, .choice code, .why code { font-size: .92em; background: var(--panel-2); padding: 0 4px; border-radius: 4px; }
.say.err { color: var(--err); }
.narr:has(.qcard) .say { font-size: clamp(14px, 1.0vw, 18px); }
.narr:has(.qcard) { flex-basis: 52%; }

/* question card */
.qcard { border: 2px solid var(--accent); border-radius: 10px; padding: 12px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 10px; }
.qlabel { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.qtext { font-size: clamp(16px, 1.3vw, 23px); font-weight: 700; line-height: 1.35; text-wrap: balance; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.choice {
  display: flex; gap: 10px; align-items: flex-start; text-align: left;
  padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer;
  font-size: clamp(14px, 1.0vw, 18px); line-height: 1.3;
}
.choice:hover { border-color: var(--accent); }
.choice .k { font-family: var(--f-code); font-weight: 700; color: var(--accent); flex: 0 0 auto; }
.choice.right { border-color: var(--done); background: var(--done-bg); }
.choice.wrong { border-color: var(--err); background: var(--err-bg); }
.choice[disabled] { cursor: default; }
.why { font-size: clamp(14px, 1.05vw, 19px); line-height: 1.45; padding: 8px 12px; border-radius: 8px; background: var(--panel-2); }
.why b { color: var(--done); }
.qactions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- references pane ---------- */
.varwrap { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.frame {
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--panel);
  display: flex; flex-direction: column; gap: 4px;
}
.frame .fh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.frame .fname { font-family: var(--f-code); font-weight: 700; font-size: clamp(13px, .95vw, 17px); overflow-wrap: anywhere; }
.frame .chip { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.frame .locals { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 10px; row-gap: 1px; font-family: var(--f-code); font-size: clamp(13px, .92vw, 16px); }
.frame .locals .k { color: var(--muted); }
.frame .locals .v { overflow-wrap: anywhere; }
.frame .locals .tmp { font-style: italic; }
.frame .locals .ref { color: var(--wait); font-weight: 600; }
.frame .locals .chg { background: var(--done-bg); border-radius: 4px; }
.frame .fnote { font-size: 13px; color: var(--muted); }
.frame.obj { border-color: var(--ink); border-width: 1.5px; }
.frame.obj .chip { background: var(--panel-2); color: var(--muted); }
.frame.active { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1px var(--accent); }
.frame.active .chip { background: var(--accent); color: var(--panel); }
.frame.waiting { border-color: var(--wait); }
.frame.waiting .chip { background: var(--wait-bg); color: var(--wait); }
.frame.returning { border-color: var(--done); background: var(--done-bg); box-shadow: 0 0 0 1px var(--done); }
.frame.returning .chip { background: var(--done); color: var(--panel); }
.frame.error { border-color: var(--err); background: var(--err-bg); }
.frame.error .chip { background: var(--err); color: var(--panel); }
.frame.module { background: var(--panel-2); border-style: dashed; }
.frame.module .chip { background: var(--line); color: var(--muted); }
.frame.new { animation: push .32s ease-out; }
@keyframes push { from { transform: translateY(-10px); opacity: .2; } to { transform: none; opacity: 1; } }
.varfoot { padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* ---------- picture pane ---------- */
.views { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.picbox { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: safe center; overflow-x: auto; }
.picbox svg { display: block; max-width: 100%; max-height: 100%; width: 100%; height: auto; }
svg text { font-family: var(--f-code); }
.nd { transition: transform .38s ease, opacity .38s ease; }
.nd rect.box { fill: var(--panel-2); stroke: var(--ink); stroke-width: 1.6; }
.nd line.div { stroke: var(--ink); stroke-width: 1.2; }
.nd text.v { fill: var(--ink); font-size: 17px; font-weight: 700; }
.nd line.none { stroke: var(--muted); stroke-width: 1.4; }
.nd circle.dot { fill: var(--ink); }
.nd circle.dot.p { fill: var(--hit); }
.nd.ref rect.box { stroke: var(--wait); stroke-width: 2.4; fill: var(--wait-bg); }
.nd.focus rect.box { stroke: var(--accent); stroke-width: 3; fill: var(--accent-bg); }
.nd.fresh rect.box { stroke: var(--done); stroke-width: 2.6; }
.nd.sent rect.box { fill: var(--line); stroke-dasharray: 5 3; }
.nd.sent text.v { fill: var(--muted); font-size: 12px; font-weight: 400; }
.nd.garbage { opacity: .38; }
.nd.garbage rect.box { stroke-dasharray: 4 3; }
.nd text.gone { fill: var(--err); font-size: 11px; font-weight: 700; font-family: var(--f-body); }
.nd.born { animation: pop .34s ease-out; }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
.ar { fill: none; stroke: var(--ink); stroke-width: 1.8; transition: d .38s ease, opacity .3s; }
.ar.p { stroke: var(--hit); }
.ar.hot { stroke: var(--accent); stroke-width: 3.2; stroke-dasharray: 7 4; }
.ar.chg { stroke: var(--done); stroke-width: 3.2; }
.ar.garbage { opacity: .3; }
.tg { transition: transform .38s ease, opacity .3s; }
.tg rect { fill: var(--wait-bg); stroke: var(--wait); stroke-width: 1.2; }
.tg text { fill: var(--wait); font-size: 12.5px; font-weight: 700; }
.tg line { stroke: var(--wait); stroke-width: 1.4; }
.tg.self rect { fill: var(--ink); stroke: var(--ink); }
.tg.self text { fill: var(--panel); }
.tg.self line { stroke: var(--ink); }
.tg.tmp rect { fill: var(--panel); stroke-dasharray: 3 2; }
.tg.tmp text { font-style: italic; }
.tg.hot rect { fill: var(--accent); stroke: var(--accent); }
.tg.hot text { fill: var(--panel); }
.tg.hot line { stroke: var(--accent); stroke-width: 2.4; }
.tg.chg rect { fill: var(--done); stroke: var(--done); }
.tg.chg text { fill: var(--panel); }
.tg.isnone rect { fill: var(--panel); stroke: var(--muted); stroke-dasharray: 3 2; }
.tg.isnone text { fill: var(--muted); }
.tg.isnone line { stroke: var(--muted); }
.nonemark text { fill: var(--muted); font-size: 13px; }
/* the array block */
.blk { transition: transform .42s ease, opacity .38s ease; }
.blk.born { animation: pop .34s ease-out; }
.blk.garbage { opacity: .38; }
.blk text.bh { fill: var(--muted); font-size: 12px; font-weight: 700; font-family: var(--f-body); }
.slot rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 4 3; }
.slot.used rect { fill: var(--panel-2); stroke: var(--ink); stroke-dasharray: none; stroke-width: 1.6; }
.slot.top rect { stroke-width: 2.4; }
.slot.hot rect { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 3; stroke-dasharray: none; }
.slot.chg rect { fill: var(--done-bg); stroke: var(--done); stroke-width: 3; stroke-dasharray: none; }
.slot text.v { fill: var(--ink); font-size: 16px; font-weight: 700; }
.slot text.nv { fill: var(--muted); font-size: 11px; opacity: .7; }
.slot text.ix { fill: var(--muted); font-size: 12px; }
/* the application view */
.cell { transition: transform .38s ease; }
.cell rect { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.3; }
.cell text { fill: var(--ink); font-size: 15px; font-weight: 700; }
.cell.past text { fill: var(--muted); font-weight: 400; }
.cell.cur rect { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 3; }
.cell.out rect { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.cell.chg rect { fill: var(--done-bg); stroke: var(--done); stroke-width: 3; }
.cell.born { animation: pop .34s ease-out; }
.pc { transition: transform .38s ease; }
.pc rect { fill: var(--wait-bg); stroke: var(--wait); stroke-width: 1.5; }
.pc text { fill: var(--ink); font-size: 15px; font-weight: 700; }
.pc.top rect { stroke-width: 2.6; }
.pc.hot rect { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 3; }
.pc.chg rect { fill: var(--done-bg); stroke: var(--done); stroke-width: 3; }
.pc.born, .slot.born { animation: drop .36s ease-out; }
@keyframes drop { from { transform: translateY(-26px); opacity: 0; } }
.pilebase path { fill: none; stroke: var(--muted); stroke-width: 2; }
.pilebase text, .lab text { fill: var(--muted); font-size: 12.5px; font-weight: 700; font-family: var(--f-body); }
.toptxt text { fill: var(--wait); font-size: 12px; font-weight: 700; font-family: var(--f-body); }
.toptxt { transition: transform .38s ease; }
.note text { fill: var(--ink); font-size: 15px; font-weight: 700; }
.note .nk { fill: var(--muted); font-weight: 400; }
.endmark text { fill: var(--accent); }
.ghost .gin { animation: flyout 1.1s ease-out forwards; }
.ghost rect { fill: var(--err-bg); stroke: var(--err); stroke-width: 1.4; }
.ghost text { fill: var(--err); font-size: 12.5px; font-weight: 700; }
@keyframes flyout { 0% { transform: translateY(14px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-8px); opacity: .85; } }
.tg { transition: transform .38s ease, opacity .3s; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 18px; height: 0; display: inline-block; border-top: 3px solid; }
.legend i.box { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; }

.out { margin: 0; padding: 8px 12px; overflow: auto; font-size: clamp(13px, .92vw, 16px); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; flex: 1 1 auto; }
.out .prompt { color: var(--muted); } .out .ret { color: var(--done); font-weight: 700; } .out .err { color: var(--err); } .out .print { color: var(--ink); }
.out .ret.new, .out .err.new { background: var(--accent-bg); }

/* ---------- transport ---------- */
.transport {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow);
}
.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
  font-weight: 700; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.on { background: var(--wait-bg); border-color: var(--wait); color: var(--wait); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn kbd { font-family: var(--f-code); font-size: 11px; font-weight: 400; opacity: .75; }
.group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.scrub { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 160px; }
.scrub input { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
.scrub .pos { font-family: var(--f-code); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-family: var(--f-code); font-size: 15px; font-variant-numeric: tabular-nums; }
.speed { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.speed input { width: 90px; accent-color: var(--accent); }
.nudge { color: var(--err); font-size: 13px; font-weight: 700; }

@media (max-width: 1150px) {
  html, body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "pic pic" "code vars" "code shell"; }
  .pic-pane { min-height: 340px; }
  .code-pane { min-height: 620px; }
  .vars-pane, .shell-pane { max-height: 420px; }
  .transport { position: sticky; bottom: 0; z-index: 2; }
}

<script>
/* =====================================================================
   ENGINE. Every scenario is a JavaScript mirror of the Python shown on
   screen. It runs once, and the Tracer records a snapshot at every step,
   so Back and the scrubber are just an index into that list.
   The world `T.w` is what the picture draws: an array block, a chain of
   nodes, or the stacks, tokens and output of an application.
   ===================================================================== */

class PyErr extends Error {
  constructor(type, msg, extra) { super(msg); this.type = type; this.extra = extra || {}; }
}

const SELF = { self: 'obj' };                  // self inside a Stack method
const ITEMS = { self: 'items' };               // self inside a DynamicArray method
const PF = x => ({ f: x });                    // a Python float (JS numbers are Python ints here)
const isF = v => !!(v && typeof v === 'object' && v.f !== undefined);
const num = v => (isF(v) ? v.f : v);

function pyfloat(x) {
  if (Number.isNaN(x)) return 'nan';
  if (!Number.isFinite(x)) return x > 0 ? 'inf' : '-inf';
  if (Number.isInteger(x) && Math.abs(x) < 1e16) return x.toFixed(1);
  let s = String(x);
  if (s.includes('e')) s = s.replace(/e([+-])(\d)$/, 'e$10$2');
  return s;
}
function pyrepr(v) {
  if (v === null || v === undefined) return 'None';
  if (typeof v === 'string') return "'" + v.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
  if (typeof v === 'boolean') return v ? 'True' : 'False';
  if (Array.isArray(v)) return '[' + v.map(pyrepr).join(', ') + ']';
  if (isF(v)) return pyfloat(v.f);
  if (v && v.self) return 'self';
  if (v && v.obj) return v.obj;
  if (v && v.pile) return 'Stack';
  return String(v);
}
const C = v => '`' + pyrepr(v) + '`';           // a value, as code, in a message
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const plural = (k, w) => k + ' ' + w + (k === 1 ? '' : 's');
const nth = k => k + (k % 100 >= 11 && k % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][k % 10] || 'th');

/* Join several Python functions into one code pane and remember where each starts. */
function compose(...parts) {
  const o = {}; let code = '', at = 0;
  for (const [name, src] of parts) {
    if (code) { code += '\n\n'; at += 1; }
    o[name] = at;
    code += src;
    at += src.split('\n').length;
  }
  return { code, o, src: parts.map(p => p[2] || p[0]) };
}

class Tracer {
  constructor(sc, p) {
    this.sc = sc; this.p = p;
    this.codeLines = sc.code.split('\n');
    this.steps = []; this.ids = 0;
    this.w = null;
    this.fx = {};
    this.out = [];
    this.queue = [];
    this.counters = { push: 0, pop: 0, shift: 0, copy: 0, links: 0 };
    this.stack = [{ id: 0, fn: '<module>', label: '<module>', line: 0, locals: [], status: 'active', note: '' }];
  }
  get top() { return this.stack[this.stack.length - 1]; }
  get depth() { return this.stack.length - 1; }
  get mod() { return this.stack[0]; }

  /* ---- frames ---- */
  set(name, val, frame) {
    const L = (frame || this.top).locals, e = L.find(x => x[0] === name);
    if (e) e[1] = val; else L.push([name, val]);
  }
  get(name) { const e = this.top.locals.find(x => x[0] === name); return e ? e[1] : undefined; }
  unset(name, frame) { const f = frame || this.top; f.locals = f.locals.filter(x => x[0] !== name); }

  snap(msg, opt) {
    opt = opt || {};
    if (this.steps.length > 3000) throw new Error('too many steps');
    this.steps.push(structuredClone({
      line: this.top.line, stack: this.stack, depth: this.depth, w: this.w,
      out: this.out, counters: this.counters, fx: Object.assign({}, this.fx, opt.fx || {}),
      msg, kind: opt.kind || '', q: null, loop: opt.loop || null
    }));
    this.fx = {};
  }
  at(line, msg, opt) { const f = this.top; f.line = line; f.status = 'active'; this.snap(msg, opt); }

  /* A question about what happens NEXT, shown on the step just recorded. */
  ask(text, correct, distractors, why) {
    const seen = new Set([String(correct)]), opts = [String(correct)];
    for (const d of distractors) { const s = String(d); if (!seen.has(s) && opts.length < 4) { seen.add(s); opts.push(s); } }
    let h = 0; for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const order = opts.map((o, i) => [o, (h ^ (i * 2654435761)) >>> 0 ^ (i * 7919)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
    this.steps[this.steps.length - 1].q = { text, choices: order, answer: order.indexOf(String(correct)), why };
  }

  call(fn, args, label, msg, line) {
    const caller = this.top;
    caller.status = 'waiting';
    caller.note = 'waiting for ' + label;
    const f = { id: ++this.ids, fn, label, line: line || 1, locals: args.map(a => [a[0], a[1]]), status: 'active', note: '' };
    this.stack.push(f);
    this.snap(msg || `Call \`${label}\`. Python makes a new frame for it, with its own local variables.`);
    return f;
  }

  /* opt.inner: the call sits inside a bigger expression, so the shell prints nothing yet. */
  ret(val, line, msg, opt) {
    opt = opt || {};
    const f = this.top;
    f.line = line; f.status = 'returning'; f.ret = val;
    this.snap(msg || `Return ${C(val)}.`);
    this.stack.pop();
    const c = this.top;
    c.status = 'active';
    const none = val === null || val === undefined;
    if (c.fn === '<module>') {
      this.lastRet = val;
      if (!none && !opt.inner) this.out.push({ k: 'ret', t: pyrepr(val), fresh: true });
      c.note = none ? 'finished' : 'result: ' + pyrepr(val);
      if (opt.inner) this.snap(opt.after || `\`${f.label}\` is finished and its frame is gone. Its result, ${C(val)}, is handed straight on.`);
      else this.snap(`\`${f.label}\` is finished and its frame is gone, with all its local variables. What it changed in the stack stays.` +
                (none ? '' : ` The shell prints the result, ${C(val)}.`) + (opt.extra || ''));
    } else {
      c.note = none ? `${f.label} finished` : `${f.label} returned ${pyrepr(val)}`;
      this.snap(opt.after || `\`${f.label}\` is finished. \`${c.label}\` carries on from line ${c.line}.`);
    }
    return val;
  }

  /* An exception: every frame on the stack is abandoned. */
  raise(e) {
    const frames = this.stack.slice(1);
    for (const f of frames) f.status = 'error';
    if (frames.length) this.top.note = `${e.type}: ${e.message}`;
    const tb = ['Traceback (most recent call last):', '  File "<stdin>", line 1, in <module>'];
    for (const f of frames) tb.push(`  File "lab.py", line ${f.line}, in ${f.fn}\n    ${(this.codeLines[f.line - 1] || '').trim()}`);
    tb.push(`${e.type}: ${e.message}`);
    this.out.push({ k: 'err', t: tb.join('\n'), fresh: true });
    this.snap(`**${e.type}: ${e.message}.** ${e.extra.why || ''}`, { kind: 'err' });
    this.stack = [this.stack[0]];
    this.stack[0].status = 'error';
    this.stack[0].note = `${e.type}: no result`;
  }

  /* One traced shell line: print it, run its mirror, and survive a Python error. */
  cmd(fn) {
    const line = this.queue.shift();
    this.prompt(line);
    this.mod.status = 'active'; this.mod.note = '';
    if (this.w && this.w.nodes) this.dropGarbage();
    try { fn(line); } catch (e) { if (!(e instanceof PyErr)) throw e; this.raise(e); this.failed = true; }
  }
  /* A line at the shell prompt whose work is not traced. */
  prompt(text) { this.out.push({ k: 'prompt', t: '>>> ' + text }); }
  probe(text, fn) {
    this.prompt(text);
    try {
      const v = fn();
      if (v !== null && v !== undefined) this.out.push({ k: 'ret', t: typeof v === 'object' && v.raw ? v.raw : pyrepr(v), fresh: true });
    } catch (e) {
      if (!(e instanceof PyErr)) throw e;
      this.out.push({ k: 'err', t: `Traceback (most recent call last):\n  ...\n${e.type}: ${e.message}`, fresh: true });
    }
  }
  say(msg, opt) { this.mod.line = 0; this.snap(msg, opt); }

  /* ---- application stacks: a pile drawn as values only ---- */
  pile(key) { return this.w.piles.find(p => p.key === key); }
  push(key, v) { this.pile(key).vals.push(v); this.counters.push++; this.fx.pushed = key; }
  pop(key) {
    const P = this.pile(key);
    if (!P.vals.length) throw new PyErr('IndexError', 'pop from empty stack', { why: `\`${P.label}\` is empty, and \`Stack.pop\` refuses to invent a value.` });
    const v = P.vals.pop(); this.counters.pop++; this.fx.popped = { key, v }; return v;
  }
  peekP(key) {
    const P = this.pile(key);
    if (!P.vals.length) throw new PyErr('IndexError', 'peek at empty stack', { why: `\`${P.label}\` is empty, so there is no top to look at.` });
    this.fx.peeked = key;
    return P.vals[P.vals.length - 1];
  }
  dropGarbage() {}
}

/* Python's == between two values of this demo (numbers, strings, floats). */
const pyeq = (a, b) => (typeof num(a) === 'number' && typeof num(b) === 'number') ? num(a) === num(b) : a === b;

/* ---------------------------------------------------------------------
   Scenarios. `code` is exactly what students see. The mirror calls
   T.at(line, ...) with the line numbers of that code. `strip` is the
   editable shell input: plain text, parameter names, and '\n' between
   shell lines. The last `traced` shell lines are traced (default 1).
   `src` names the Python function behind each block of code, so the
   self-check can compare the page with the real source.
   --------------------------------------------------------------------- */
const SCENARIOS = [];
const def = sc => { if (sc.parts) { const c = compose(...sc.parts); sc.code = c.code; sc.o = c.o; sc.src = c.src; } SCENARIOS.push(sc); };
const GROUPS = {
  array: 'Stack on your DynamicArray',
  linked: 'Stack on a linked list',
  brackets: 'Balanced brackets',
  postfix: 'Evaluating postfix',
  infix: 'Infix to postfix (shunting-yard)',
  more: 'The call stack, undo and redo',
  wrong: 'Goes wrong',
};
const valList = (dflt, min, max) => ({ type: 'list', def: dflt, minLen: min === undefined ? 0 : min, maxLen: max || 7,
  check: v => v.every(x => (typeof x === 'number' && Number.isInteger(x) && Math.abs(x) < 1000) || (typeof x === 'string' && x.length <= 4)) || 'Use whole numbers (or short strings) only.' });
const intP = (dflt, min, max) => ({ type: 'int', def: dflt, min, max });
const valP = dflt => ({ type: 'value', def: dflt });
const textP = (dflt, check) => ({ type: 'text', def: dflt, check });


/* ==== the stack on a DynamicArray: dsa/stack.py on dsa/dynamic_array.py ==== */

/* Build Stack(values) the way __init__ would, without tracing it:
   DynamicArray() starts with one slot and doubles when full. */
function setupBlock(T, cls, values) {
  const w = { type: 'block', cls, obj: 's', block: [null], cap: 1, size: 0, resizes: 0, newBlock: null, old: null,
              bid: 0, newBid: null, nextId: 1, front: cls === 'FrontStack' };
  for (const v of values) {
    if (w.size === w.cap) quietGrow(w, w.cap * 2);
    if (w.front) { for (let i = w.size; i > 0; i--) w.block[i] = w.block[i - 1]; w.block[0] = v; }
    else w.block[w.size] = v;
    w.size++;
  }
  T.w = w;
  T.set('s', { obj: 's' }, T.mod);
}
function quietGrow(w, capacity) {
  const b = Array(capacity).fill(null);
  for (let i = 0; i < w.size; i++) b[i] = w.block[i];
  w.block = b; w.cap = capacity; w.bid = w.nextId++; w.resizes++;
  return w.size;
}
const blockVals = w => w.block.slice(0, w.size);
const topIx = w => (w.front ? 0 : w.size - 1);
function reprStack(T) {
  const w = T.w, vals = blockVals(w), name = w.cls === 'FrontStack' ? 'FrontStack' : 'Stack';
  if (!vals.length) return { raw: name + '([])' };
  return { raw: `${name}(${pyrepr(vals)})  # top = ${pyrepr(w.block[topIx(w)])}` };
}
const blockProbes = (cap) => () => {
  const P = [['s', T => reprStack(T)], ['len(s)', T => T.w.size]];
  if (cap) P.push(['s._items._capacity', T => T.w.cap]);
  return P;
};

/* ---- the course code, exactly as in the solutions ---- */
const S_PUSH = `def push(self, value):
    self._items.append(value)                # the top is the END of the array`;
const S_POP = `def pop(self):
    if len(self._items) == 0:
        raise IndexError("pop from empty stack")
    return self._items.pop()`;
const S_PEEK = `def peek(self):
    if len(self._items) == 0:
        raise IndexError("peek at empty stack")
    return self._items[len(self._items) - 1]`;
const DA_APPEND = `def append(self, value):
    if self._size == self._capacity:
        self._resize(self._capacity * self.growth)
    self._block[self._size] = value
    self._size += 1`;
const DA_RESIZE = `def _resize(self, capacity):
    block = make_block(capacity)
    for i in range(self._size):
        block[i] = self._block[i]
    self._block = block
    self._capacity = capacity
    self.resize_count += 1`;
const DA_POP = `def pop(self, index=-1):
    if self._size == 0:
        raise IndexError("pop from empty DynamicArray")
    if index < 0:
        index += self._size
    if not 0 <= index < self._size:
        raise IndexError("index out of range")
    value = self._block[index]
    for i in range(index, self._size - 1):
        self._block[i] = self._block[i + 1]
    self._size -= 1
    self._block[self._size] = None
    return value`;
const DA_GETITEM = `def __getitem__(self, index):
    if index < 0:
        index += self._size               # -1 means the last USED slot
    if not 0 <= index < self._size:
        raise IndexError(index)
    return self._block[index]`;
const DA_INSERT = `def insert_at(self, index, value):
    if not 0 <= index <= self._size:
        raise IndexError(index)
    if self._size == self._capacity:
        self._resize(self._capacity * self.growth)
    for i in range(self._size, index, -1):
        self._block[i] = self._block[i - 1]
    self._block[index] = value
    self._size += 1`;
/* written for the demo: three stacks that go wrong */
const F_PUSH = `def push(self, value):
    self._items.insert_at(0, value)          # every item shifts right`;
const F_POP = `def pop(self):
    if len(self._items) == 0:
        raise IndexError("pop from empty stack")
    return self._items.pop(0)                # every item shifts left`;
const N_POP = `def pop(self):
    if len(self._items) == 0:
        return None                          # instead of raising IndexError
    return self._items.pop()`;
const PP_PEEK = `def peek(self):
    return self._items.pop()                 # reads the top... and removes it`;

/* ---- DynamicArray methods, traced line by line ---- */
function daAppend(T, value, ask) {
  const o = T.sc.o.append, w = T.w;
  T.call('append', [['self', ITEMS], ['value', value]], `append(${pyrepr(value)})`,
    `\`push\` calls \`self._items.append(${pyrepr(value)})\`. A new frame: in it, \`self\` is the DynamicArray, not the Stack.`, o + 1);
  const full = w.size === w.cap;
  T.at(o + 2, `Is the block full? \`_size\` is ${w.size} and \`_capacity\` is ${w.cap}: ${full ? '**yes**, every slot is in use.' : `no, slot ${w.size} is free.`}`, { fx: { hot: full ? [] : [w.size] } });
  if (!full && ask) T.ask(`Which slot will \`append\` write ${C(value)} into?`, `Slot ${w.size}`, [`Slot 0`, `Slot ${w.cap}`, `Slot ${Math.max(0, w.size - 1)}`, `Slot ${w.size + 1}`],
    `Slot ${w.size}: \`_size\` is ${w.size}, so slots 0 to ${w.size - 1} are used and slot ${w.size} is the first free one. The index is known at once, with no search: O(1).`);
  if (full) {
    if (ask) T.ask(`The block is full. \`_resize\` will copy the values into a bigger block. How many values will it copy?`, w.size, [1, 2 * w.size, 0],
      `All ${w.size} of them: that copy is what makes this one push O(n). Doubling puts the next copy twice as far away, so over many pushes the average stays O(1): amortised.`);
    T.at(o + 3, `Grow first: \`_resize(${w.cap} * 2)\`. The capacity doubles.`);
    daResize(T, w.cap * 2);
  }
  const at = w.size;
  w.block[at] = value;
  T.at(o + 4, `\`self._block[${at}] = ${pyrepr(value)}\`: the value goes into slot ${at}, the first free one. Nothing else moves.`, { fx: { chg: [at], pushed: true } });
  w.size++;
  T.at(o + 5, `\`_size\` goes up to ${w.size}. Slot ${at} holds the new top of the stack.`);
  return T.ret(null, o + 5, 'append returns None.');
}

function daResize(T, capacity) {
  const o = T.sc.o._resize, w = T.w;
  T.call('_resize', [['self', ITEMS], ['capacity', capacity]], `_resize(${capacity})`, null, o + 1);
  w.newBlock = Array(capacity).fill(null); w.newBid = w.nextId++;
  T.set('block', { blk: 'new' });
  T.at(o + 2, `\`make_block(${capacity})\` allocates a new block of ${capacity} empty slots. The old block is still \`self._block\`.`);
  for (let i = 0; i < w.size; i++) {
    T.set('i', i);
    T.at(o + 3, `\`i\` is ${i}.`, { loop: 'copy', fx: { oldHot: [i] } });
    w.newBlock[i] = w.block[i]; T.counters.copy++;
    T.at(o + 4, `Copy slot ${i}: ${C(w.block[i])} goes into slot ${i} of the new block.`, { loop: 'copy', fx: { copy: i } });
  }
  T.at(o + 3, `The loop is over: ${plural(w.size, 'value')} copied, one by one. This is the O(n) part.`);
  w.old = { block: w.block, cap: w.cap, bid: w.bid };
  w.block = w.newBlock; w.bid = w.newBid; w.newBlock = null; w.newBid = null;
  T.at(o + 5, `\`self._block = block\`: the DynamicArray now uses the new block. Nothing refers to the old one any more, so Python frees it.`);
  w.cap = capacity;
  T.at(o + 6, `\`_capacity\` is now ${capacity}.`);
  w.resizes++;
  w.old = null;
  T.at(o + 7, `\`resize_count\` goes up to ${w.resizes}.`);
  return T.ret(null, o + 7, '_resize returns None.');
}

function daPop(T, index, ask) {
  const o = T.sc.o.dapop, w = T.w, label = index === -1 ? 'pop()' : `pop(${index})`;
  T.call('pop', [['self', ITEMS], ['index', index]], label,
    `Call \`self._items.${label}\`. A new frame: in it, \`self\` is the DynamicArray${index === -1 ? ', and `index` takes its default, -1' : ''}.`, o + 1);
  const size = w.size;
  T.at(o + 2, `Is the array empty? \`_size\` is ${size}: ${size === 0 ? '**yes**.' : 'no.'}`);
  if (size === 0) {
    T.at(o + 3, 'Raise `IndexError`: there is nothing to pop.');
    throw new PyErr('IndexError', 'pop from empty DynamicArray', { why: 'The DynamicArray refuses to pop from an empty block. Nobody checked before calling it.' });
  }
  if (index < 0) {
    T.at(o + 4, `\`index\` is ${index}: negative, so it counts from the end.`);
    index += size; T.set('index', index);
    T.at(o + 5, `\`index += self._size\`: ${index - size} + ${size} = ${index}, the last used slot.`);
  } else T.at(o + 4, `\`index\` is ${index}: not negative.`);
  T.at(o + 6, `Is \`0 <= ${index} < ${size}\`? Yes.`);
  const value = w.block[index];
  T.set('value', value);
  T.at(o + 8, `Read slot ${index}: \`value\` is ${C(value)}.`, { fx: { hot: [index] } });
  const n = size - 1 - index;
  if (n === 0) {
    T.at(o + 9, `\`range(${index}, ${size - 1})\` is empty: the value came from the LAST slot, so nothing has to move. That is why the top lives at the end.`);
  } else {
    if (ask) T.ask(`How many times will line ${o + 10}, the shift, run?`, n, [1, 0, size],
      `Every value above slot ${index} moves down one slot to close the gap: ${n} of them. Popping at index 0 costs O(n).`);
    for (let i = index; i < size - 1; i++) {
      T.set('i', i);
      T.at(o + 9, `\`i\` is ${i}.`, { loop: 'shift' });
      w.block[i] = w.block[i + 1]; T.counters.shift++;
      T.at(o + 10, `Shift: the value in slot ${i + 1}, ${C(w.block[i])}, moves down into slot ${i}.`, { loop: 'shift', fx: { shift: [i + 1, i], chg: [i] } });
    }
    T.at(o + 9, `The loop is over: ${plural(n, 'value')} moved down one slot.`);
  }
  w.size--;
  T.at(o + 11, `\`_size\` goes down to ${w.size}.`);
  w.block[w.size] = null;
  T.at(o + 12, `Clear slot ${w.size}, which is no longer used, so the block does not keep the value alive.`, { fx: { chg: [w.size] } });
  T.fx.popped = { v: value, at: index };
  return T.ret(value, o + 13, `Return ${C(value)}.`);
}

function daGetItem(T, index) {
  const o = T.sc.o.getitem, w = T.w;
  T.call('__getitem__', [['self', ITEMS], ['index', index]], `__getitem__(${index})`,
    `\`self._items[${index}]\` calls the DynamicArray's \`__getitem__(${index})\`.`, o + 1);
  T.at(o + 2, `Is \`index\` negative? It is ${index}: ${index < 0 ? 'yes.' : 'no.'}`);
  if (index < 0) { index += w.size; T.set('index', index); T.at(o + 3, `\`index\` becomes ${index}.`); }
  const ok = 0 <= index && index < w.size;
  T.at(o + 4, `Is \`0 <= ${index} < ${w.size}\`? ${ok ? 'Yes.' : '**No.**'}`);
  if (!ok) { T.at(o + 5, `Raise \`IndexError(${index})\`.`); throw new PyErr('IndexError', String(index)); }
  T.at(o + 6, `Return slot ${index}: ${C(w.block[index])}. Reading a slot is O(1); nothing is removed.`, { fx: { hot: [index] } });
  return T.ret(w.block[index], o + 6, `Return ${C(w.block[index])}.`);
}

function daInsertAt(T, index, value, ask) {
  const o = T.sc.o.insert_at, w = T.w;
  T.call('insert_at', [['self', ITEMS], ['index', index], ['value', value]], `insert_at(${index}, ${pyrepr(value)})`,
    `Call \`self._items.insert_at(${index}, ${pyrepr(value)})\`: a new frame, where \`self\` is the DynamicArray.`, o + 1);
  T.at(o + 2, `Is \`0 <= ${index} <= ${w.size}\`? Yes.`);
  const full = w.size === w.cap;
  T.at(o + 4, `Is the block full? \`_size\` is ${w.size}, \`_capacity\` is ${w.cap}: ${full ? '**yes**.' : 'no.'}`);
  if (full) { T.at(o + 5, `Grow first: \`_resize(${w.cap} * 2)\`.`); daResize(T, w.cap * 2); }
  const n = w.size - index;
  if (n === 0) T.at(o + 6, `\`range(${w.size}, ${index}, -1)\` is empty: the array is empty, so nothing has to move.`);
  else {
    if (ask) T.ask(`To free slot ${index}, how many values must shift one slot to the right?`, n, [1, 0, n + 1],
      `Every value in the stack: ${n}. Each push at index 0 shifts the whole stack, so it is O(n), and n pushes cost O(n²).`);
    for (let i = w.size; i > index; i--) {
      T.set('i', i);
      T.at(o + 6, `\`i\` is ${i}, counting down.`, { loop: 'shift' });
      w.block[i] = w.block[i - 1]; T.counters.shift++;
      T.at(o + 7, `Shift: the value in slot ${i - 1}, ${C(w.block[i])}, moves up into slot ${i}.`, { loop: 'shift', fx: { shift: [i - 1, i], chg: [i] } });
    }
    T.at(o + 6, `The loop is over: ${plural(n, 'value')} moved up one slot, to free slot ${index}.`);
  }
  w.block[index] = value;
  T.at(o + 8, `\`self._block[${index}] = ${pyrepr(value)}\`.`, { fx: { chg: [index], pushed: true } });
  w.size++;
  T.at(o + 9, `\`_size\` goes up to ${w.size}.`);
  return T.ret(null, o + 9, 'insert_at returns None.');
}

/* ---- Stack methods ---- */
function sPush(T, value, ask) {
  const o = T.sc.o.push;
  T.call('push', [['self', SELF], ['value', value]], `push(${pyrepr(value)})`, null, o + 1);
  T.at(o + 2, `The top of the stack is the END of the array, so a push is an \`append\` on \`self._items\`.`);
  daAppend(T, value, ask);
  T.counters.push++;
  return T.ret(null, o + 2, 'push returns None.');
}
function sPop(T, ask, bug, inner) {
  const ro = inner ? { inner: true, after: '`pop` is finished, and its result goes straight into the expression.' } : undefined;
  const o = T.sc.o.pop, w = T.w;
  T.call('pop', [['self', SELF]], 'pop()', null, o + 1);
  T.at(o + 2, `Is the stack empty? \`len(self._items)\` is ${w.size}: ${w.size === 0 ? '**yes**.' : 'no.'}`);
  if (w.size === 0) {
    if (bug === 'none') {
      T.at(o + 3, 'Empty, so return `None`, quietly. No error, no warning.');
      return T.ret(null, o + 3, 'pop returns None. The shell prints nothing at all for None.', ro);
    }
    T.at(o + 3, 'Raise `IndexError`: an empty stack has no top to give back.');
    throw new PyErr('IndexError', 'pop from empty stack', { why: 'The contract says so, like `list.pop()` on an empty list. The error stops the program right here, where the mistake is.' });
  }
  if (ask) T.ask(`\`self._items\` holds ${pyrepr(blockVals(w))}. Which value will \`pop()\` return?`, pyrepr(w.block[w.size - 1]), [pyrepr(w.block[0]), 'None', pyrepr(w.size)].filter(x => x !== pyrepr(w.block[w.size - 1])),
    'The top is the LAST slot of the array, so `pop()` with no index takes the most recent value: last in, first out.');
  T.at(o + 4, `The top is the last slot: \`self._items.pop()\`, with no index, removes it.`);
  const v = daPop(T, -1, false);
  T.counters.pop++;
  return T.ret(v, o + 4, `Return ${C(v)}: the value pushed most recently.`, ro);
}
function sPeek(T) {
  const o = T.sc.o.peek, w = T.w;
  T.call('peek', [['self', SELF]], 'peek()', null, o + 1);
  T.at(o + 2, `Is the stack empty? \`len(self._items)\` is ${w.size}: ${w.size === 0 ? '**yes**.' : 'no.'}`);
  if (w.size === 0) {
    T.at(o + 3, 'Raise `IndexError`: there is no top to look at.');
    throw new PyErr('IndexError', 'peek at empty stack', { why: 'Same contract as pop: an error, not a made-up value.' });
  }
  T.at(o + 4, `Read the last used slot, index \`len(self._items) - 1\` = ${w.size - 1}.`);
  T.ask(`The stack holds ${plural(w.size, 'value')}. How many will it hold after this peek?`, w.size, [w.size - 1, 0, w.size + 1].filter(x => x >= 0),
    'peek only reads the top through `__getitem__`. Nothing is removed, so the stack is unchanged.');
  const v = daGetItem(T, w.size - 1);
  return T.ret(v, o + 4, `Return ${C(v)}. Nothing was removed: the stack still holds ${plural(w.size, 'value')}.`);
}

/* The same methods with the DynamicArray work in one step (for sequences). */
function flatPush(T, value) {
  const o = T.sc.o.push, w = T.w;
  T.call('push', [['self', SELF], ['value', value]], `push(${pyrepr(value)})`, null, o + 1);
  let grew = 0;
  if (w.size === w.cap) { grew = quietGrow(w, w.cap * 2); T.counters.copy += grew; }
  w.block[w.size] = value; w.size++; T.counters.push++;
  T.at(o + 2, (grew ? `The block was full, so \`append\` first doubled it to ${w.cap} slots (copying ${plural(grew, 'value')}). ` : '') +
    `\`append\` writes ${C(value)} into slot ${w.size - 1}: the new top.`, { fx: { chg: [w.size - 1], pushed: true } });
  return T.ret(null, o + 2, 'push returns None.');
}
function flatPop(T) {
  const o = T.sc.o.pop, w = T.w;
  T.call('pop', [['self', SELF]], 'pop()', null, o + 1);
  T.at(o + 2, `Is the stack empty? \`len(self._items)\` is ${w.size}: ${w.size === 0 ? '**yes**.' : 'no.'}`);
  if (w.size === 0) {
    T.at(o + 3, 'Raise `IndexError`.');
    throw new PyErr('IndexError', 'pop from empty stack', { why: 'The stack is empty: every value pushed has already been popped.' });
  }
  const v = w.block[w.size - 1];
  w.size--; w.block[w.size] = null; T.counters.pop++;
  T.at(o + 4, `\`self._items.pop()\` takes ${C(v)} from the last slot, ${w.size}. Nothing else moves.`, { fx: { chg: [w.size], popped: { v, at: w.size } } });
  return T.ret(v, o + 4, `Return ${C(v)}.`);
}
function flatPeek(T) {
  const o = T.sc.o.peek, w = T.w;
  T.call('peek', [['self', SELF]], 'peek()', null, o + 1);
  T.at(o + 2, `Is the stack empty? \`len(self._items)\` is ${w.size}: ${w.size === 0 ? '**yes**.' : 'no.'}`);
  if (w.size === 0) { T.at(o + 3, 'Raise `IndexError`.'); throw new PyErr('IndexError', 'peek at empty stack'); }
  const v = w.block[w.size - 1];
  T.at(o + 4, `Read slot ${w.size - 1}, the top: ${C(v)}. It stays where it is.`, { fx: { hot: [w.size - 1] } });
  return T.ret(v, o + 4, `Return ${C(v)}.`);
}

const pushParts = [['push', S_PUSH, 'Stack.push'], ['append', DA_APPEND, 'DynamicArray.append'], ['_resize', DA_RESIZE, 'DynamicArray._resize']];

def({

  probes: blockProbes(false),
  finaleMsg: (T, p) => `In: ${pyrepr(p.a)}, ${pyrepr(p.b)}, ${pyrepr(p.c)}. Out: ${pyrepr(p.b)}, ${pyrepr(p.c)}, ${pyrepr(p.a)}. Every value left in the reverse of the order it arrived, at its turn.`,

const INFIX = `def infix_to_postfix(tokens):
    precedence = {"+": 1, "-": 1, "*": 2, "/": 2}
    output, operators = [], Stack()
    for token in tokens:

            # higher OR EQUAL precedence leaves first: left associativity
            while (not operators.is_empty() and operators.peek() in precedence
                   and precedence[operators.peek()] >= precedence[token]):
                output.append(operators.pop())
            operators.push(token)
        elif token == "(":
            operators.push(token)
        elif token == ")":
            while operators.peek() != "(":
                output.append(operators.pop())

const NESTED = `def nested_sum(nested):
    total, pending = 0, Stack([nested])
    while not pending.is_empty():

    T.at(2, '`total` starts at 0, and `pending` holds one job: the whole list.');
    let pops = 0;

      T.say(`Now a new action, while ${C(p.w2)} still waits on the redo stack.`);
      T.ask(`After \`ed.type(${pyrepr(p.w3)})\`, what will \`ed.redo()\` do?`, 'Nothing: the redo stack is cleared', [`Bring back ${pyrepr(p.w2)}`, `Undo ${pyrepr(p.w3)}`, 'Raise IndexError'],

/* Build the full trace for one scenario and its inputs. */
function shellLines(sc, p) {
  return sc.strip.map(part => (part in (sc.params || {})) ? pyrepr(p[part]) : part).join('').split('\n');
}
function build(sc, p) {
  const T = new Tracer(sc, p);
  setupApp(T, {});
  if (sc.setup) sc.setup(T, p);
  const lines = shellLines(sc, p), nt = sc.traced || 1;
  lines.slice(0, lines.length - nt).forEach(l => T.prompt(l));
  T.queue = lines.slice(lines.length - nt);
  T.say(lines.length > nt ? `Ready: \`${lines[0]}\` has built the ${sc.world === 'app' ? 'object' : 'stack'}. Press **Step** to run \`${T.queue[0]}\`.`
                          : `Ready. Press **Step** to run \`${T.queue[0]}\`.`);
  sc.run(T, p);
  if (sc.summary && !T.failed) T.steps[T.steps.length - 1].msg += sc.summary(T, p);
  if (sc.probes) for (const [cmd, fn] of sc.probes(T, p)) T.probe(cmd, () => fn(T));
  if (sc.probes || sc.finale || sc.finaleMsg) {
    T.stack[0].status = 'active'; T.stack[0].line = 0; T.stack[0].note = '';
    T.snap(sc.finale ? '**What went wrong?** ' + sc.finale(T, p) : sc.finaleMsg ? sc.finaleMsg(T, p) : 'The shell checks the result: the stack, bottom to top, and its length.',
      { kind: sc.group === 'wrong' ? 'err' : '' });
  }
  return T;
}

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const KW = new Set(['def', 'class', 'if', 'elif', 'return', 'for', 'in', 'not', 'is', 'None', 'else', 'and', 'or', 'True', 'False', 'while', 'raise', 'from', 'import']);
const BI = new Set(['print', 'len', 'str', 'range', 'IndexError', 'ValueError', 'Node', 'Stack', 'isinstance', 'list', 'float', 'int', 'make_block']);
function highlight(line) {
  const re = /(#.*$)|([fF]?"(?:[^"\\]|\\.)*"|[fF]?'(?:[^'\\]|\\.)*')|(\b\d+\b)|([A-Za-z_]\w*)|(\s+|.)/g;
  let m, html = '', prev = '';
  while ((m = re.exec(line))) {
    if (m[1]) html += `<span class="t-com">${esc(m[1])}</span>`;
    else if (m[2]) html += `<span class="t-str">${esc(m[2])}</span>`;
    else if (m[3]) html += `<span class="t-num">${m[3]}</span>`;
    else if (m[4]) {
      const w = m[4];
      if (prev === 'def' || prev === 'class') html += `<span class="t-fn">${w}</span>`;
      else if (KW.has(w)) html += `<span class="t-kw">${w}</span>`;
      else if (BI.has(w)) html += `<span class="t-bi">${w}</span>`;
      else html += esc(w);
      prev = w; continue;
    } else html += esc(m[5]);
    if (m[5] && /\S/.test(m[5])) prev = m[5];
  }
  return html;
}

const state = { sc: null, params: {}, T: null, idx: 0, answered: new Map(), quiz: true, timer: null, prevSnap: null, nudge: '', pic: null };

const DEMO = /^(LinkedStack|FrontStack|NoneStack|PeekPopStack|Editor)\.|_no_|_swapped|_strict|^nested_sum$/;

  if (sc.src.some(n => /postfix$/.test(n) && n.startsWith('evaluate'))) return '<span class="badge ex">dsa/translation.py: exercise solution</span>';

function initPicker() {

function loadScenario(id) {

function renderCallStrip() {

/* A Python literal typed by the user: a string, a number, or a (nested) list. */
function parsePy(text) {
  const src = text.trim(); let i = 0;
  const ws = () => { while (i < src.length && /\s/.test(src[i])) i++; };
  const val = () => {
    ws();
    const c = src[i];
    if (c === '[') {
      i++; const out = []; ws();
      if (src[i] === ']') { i++; return out; }
      for (;;) { out.push(val()); ws(); if (src[i] === ',') { i++; ws(); if (src[i] === ']') { i++; return out; } continue; } if (src[i] === ']') { i++; return out; } throw new Error('bad list'); }
    }
    if (c === "'" || c === '"') {
      const j = src.indexOf(c, i + 1); if (j < 0) throw new Error('bad string');
      const s = src.slice(i + 1, j); if (s.includes('\\')) throw new Error('no escapes'); i = j + 1; return s;
    }
    const m = /^-?\d+/.exec(src.slice(i)); if (!m) throw new Error('bad value');
    i += m[0].length; return parseInt(m[0], 10);
  };
  const v = val(); ws(); if (i !== src.length) throw new Error('trailing text');
  return v;
}
function applyParams() {
  const sc = state.sc, next = {}; let err = '';
  for (const k in sc.params) {
    const spec = sc.params[k], inp = $('param-' + k);
    inp.classList.remove('bad');
    try {
      if (spec.type === 'int') {
        if (!/^\s*-?\d+\s*$/.test(inp.value)) throw new Error(`${k} must be a whole number.`);
        const v = parseInt(inp.value, 10);
        if (v < spec.min || v > spec.max) throw new Error(`For this demo, ${k} must be between ${spec.min} and ${spec.max}.`);
        next[k] = v;
      } else if (spec.type === 'value') {
        let v; try { v = parsePy(inp.value); } catch (e) { throw new Error(spec.str ? `${k} must be a short string, like 'abc'.` : `${k} must be a number, like 99, or a short string, like 'x'.`); }
        if (spec.str) { if (typeof v !== 'string' || !v.length || v.length > 6) throw new Error(`${k} must be a string of 1 to 6 characters.`); }
        else if (!((typeof v === 'number' && Number.isInteger(v) && Math.abs(v) < 1000) || (typeof v === 'string' && v.length <= 4))) throw new Error(`${k} must be a whole number below 1000, or a string of up to 4 characters.`);
        next[k] = v;
      } else if (spec.type === 'text') {
        let v; try { v = parsePy(inp.value); } catch (e) { throw new Error(`${k} must be a string in quotes, like ${pyrepr(spec.def)}.`); }
        if (typeof v !== 'string') throw new Error(`${k} must be a string in quotes.`);
        const ok = spec.check ? spec.check(v) : true;
        if (ok !== true) throw new Error(ok);
        next[k] = v;
      } else {
        let v; try { v = parsePy(inp.value); } catch (e) { throw new Error(`${k} must be a Python list, like ${pyrepr(spec.def)}.`); }
        if (!Array.isArray(v)) throw new Error(`${k} must be a list.`);
        if (spec.minLen !== undefined && (v.length < spec.minLen || v.length > spec.maxLen)) throw new Error(`For this demo, the list must have ${spec.minLen} to ${spec.maxLen} values.`);
        const ok = spec.check ? spec.check(v) : true;
        if (ok !== true) throw new Error(ok);
        next[k] = v;
      }
    } catch (e) { inp.classList.add('bad'); err = e.message; }
  }
  if (!err && sc.check) { const ok = sc.check(next); if (ok !== true) err = ok; }
  if (!err) { try { build(sc, next); } catch (e) { err = e.message === 'too many steps' ? 'That input makes the trace too long for this demo. Try something shorter.' : 'This input is outside what the demo can show.'; } }
  $('callerr').textContent = err;
  if (err) return;

  for (const k in next) { const inp = $('param-' + k); inp.value = pyrepr(next[k]); inp.size = Math.max(2, inp.value.length); }
  rebuild();
}

function rebuild() {
  stop();
  state.T = build(state.sc, state.params);
  state.idx = 0; state.answered = new Map(); state.prevSnap = null;
  picSetup();
  $('scrub').max = state.T.steps.length - 1;
  render();
}

/* ---------- navigation ---------- */
const snapAt = i => state.T.steps[i];
const pendingQ = () => { const s = snapAt(state.idx); return state.quiz && s.q && !state.answered.has(state.idx); };
function go(i) {
  const N = state.T.steps.length;
  i = Math.max(0, Math.min(N - 1, i));
  if (i === state.idx) return false;
  state.prevSnap = snapAt(state.idx);
  state.idx = i;
  state.nudge = '';
  render();
  return true;
}
function guard() {
  if (pendingQ()) { state.nudge = 'Answer the question first (keys A–D), or press Reveal.'; $('nudge').textContent = state.nudge; return false; }
  return true;
}
function step() { if (!guard()) { stop(); return false; } return go(state.idx + 1); }
function back() { stop(); go(state.idx - 1); }
function skipLoop() {
  if (!guard()) return;
  stop();
  const S = state.T.steps, lp = S[state.idx].loop, d = S[state.idx].depth;
  let j = state.idx + 1;
  if (lp) while (j < S.length && ((S[j].loop === lp && S[j].depth === d) || S[j].depth > d)) j++;
  go(j);
}
function stepOut() {
  if (!guard()) return;
  stop();
  const S = state.T.steps, d = S[state.idx].depth;
  let j = state.idx + 1;
  while (j < S.length && S[j].depth >= d && d > 0) j++;
  go(j);
}
function play() {
  if (state.timer) { stop(); return; }
  if (state.idx >= state.T.steps.length - 1) go(0);
  $('bPlay').innerHTML = 'Pause <kbd>P</kbd>'; $('bPlay').classList.add('on');
  const tick = () => {
    if (!step() || state.idx >= state.T.steps.length - 1 || pendingQ()) { stop(); return; }
    state.timer = setTimeout(tick, delay());
  };
  state.timer = setTimeout(tick, Math.min(400, delay()));
}
function stop() {
  if (state.timer) clearTimeout(state.timer);
  state.timer = null;
  $('bPlay').innerHTML = 'Play <kbd>P</kbd>'; $('bPlay').classList.remove('on');
}
const delay = () => [2600, 2000, 1500, 1150, 900, 700, 520, 380, 260, 160][+$('speed').value - 1];

function answer(k) {
  const s = snapAt(state.idx);
  if (!s.q || state.answered.has(state.idx)) return;
  state.answered.set(state.idx, k);
  state.nudge = '';
  renderNarr();
  $('nudge').textContent = '';
}

/* ---------- rendering ---------- */
function render() {
  const s = snapAt(state.idx);
  renderCode(s);
  renderNarr();
  renderVars(s);
  renderPic(s);
  renderOut(s);
  renderTransport(s);
  scrollCode();
}
/* Keep the running line in view (after the narration has taken its space). */
function scrollCode() {
  const box = $('code'), cur = box.querySelector('.ln.cur, .ln.ret, .ln.errl');
  if (!cur) return;
  const r = cur.getBoundingClientRect(), br = box.getBoundingClientRect();
  if (r.top < br.top + 4 || r.bottom > br.bottom - 4) box.scrollTop += r.top - br.top - br.height / 2 + r.height / 2;
}

function renderCode(s) {
  const lines = state.sc.code.split('\n');
  const frames = s.stack.slice(1), top = s.stack[s.stack.length - 1];
  const waiting = {};
  for (const f of frames) if (f !== top && f.status === 'waiting') (waiting[f.line] = waiting[f.line] || []).push(f);
  const errLine = s.kind === 'err' && frames.length ? frames[frames.length - 1].line : 0;
  const last = state.idx === state.T.steps.length - 1;
  const bugs = last && state.sc.bugLines ? new Set(state.sc.bugLines) : new Set();
  let html = '';
  lines.forEach((ln, i) => {
    const no = i + 1;
    let cls = '';
    const tags = [];
    if (top.fn !== '<module>' && top.line === no) {
      if (top.status === 'returning') { cls = 'ret'; tags.push(`<span class="tag r">returns ${esc(clip(pyrepr(top.ret), 22))}</span>`); }
      else if (top.status === 'error') { cls = 'errl'; tags.push(`<span class="tag e">error here</span>`); }
      else { cls = 'cur'; tags.push(`<span class="tag a">${esc(clip(top.label, 26))}</span>`); }
    } else if (errLine === no) cls = 'errl';
    if (waiting[no]) { if (!cls) cls = 'waitl'; tags.push(`<span class="tag w">${esc(clip(waiting[no][0].label, 24))} paused</span>`); }
    if (bugs.has(no)) { cls += ' bug'; tags.push('<span class="tag e">bug</span>'); }
    html += `<div class="ln ${cls}"><span class="no">${no}</span><span class="src">${highlight(ln) || ' '}</span><span class="tags">${tags.join('')}</span></div>`;
  });
  const box = $('code');
  box.innerHTML = html;
  $('lineInfo').textContent = top.fn === '<module>' ? '' : `${top.label} · line ${top.line}`;
}

function renderNarr() {
  const s = snapAt(state.idx), box = $('narr');
  let html = `<div class="say ${s.kind === 'err' ? 'err' : ''}">${md(s.msg)}</div>`;
  if (s.q && state.quiz) {
    const chosen = state.answered.get(state.idx);
    const done = chosen !== undefined && chosen !== -2;
    html += `<div class="qcard" role="group" aria-label="Question"><div class="qlabel">What happens next?</div><div class="qtext">${md(s.q.text)}</div><div class="choices">`;
    s.q.choices.forEach((c, k) => {
      let cls = '';
      if (done) { if (k === s.q.answer) cls = 'right'; else if (k === chosen) cls = 'wrong'; }
      html += `<button class="choice ${cls}" data-k="${k}" ${done ? 'disabled' : ''}><span class="k">${'ABCD'[k]}</span><span>${md(c)}</span></button>`;
    });
    html += `</div>`;
    if (done) {
      const verdict = chosen === -1 ? 'Answer:' : chosen === s.q.answer ? 'Correct.' : `Not quite. The answer is ${'ABCD'[s.q.answer]}.`;
      html += `<div class="why"><b>${verdict}</b> ${md(s.q.why)}</div>`;
    } else {
      html += `<div class="qactions"><button class="btn" id="qReveal">Reveal <kbd>V</kbd></button><button class="btn" id="qSkip">Skip question</button></div>`;
    }
    html += `</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => answer(+b.dataset.k)));
  scrollCode();
  const rv = $('qReveal'); if (rv) rv.addEventListener('click', () => answer(-1));

}

/* ---------- variables ---------- */
const stackRepr = vals => `Stack(${pyrepr(vals)})`;
function showVal(s, v) {
  const w = s.w;
  if (v && v.self === 'obj') return `→ the ${w.cls || 'Stack'} object`;
  if (v && v.self === 'items') return '→ s._items, the DynamicArray';
  if (v && v.obj === 's') return `→ ${w.cls} object`;
  if (v && v.obj === 'ed') return '→ Editor object';
  if (v && v.obj === 'DynamicArray') return '→ DynamicArray object';
  if (v && v.obj) return v.obj;
  if (v && v.blk) return `→ Array(${(w.newBlock || w.block).length}), the new block`;
  if (v && v.arr) return `→ Array(${v.arr})`;
  if (v && v.node !== undefined) return v.node === null ? 'None' : `→ Node(${pyrepr(w.nodes[v.node].v)})`;
  if (v && v.pile) { const P = w.piles.find(x => x.key === v.pile); return '→ ' + stackRepr(P ? P.vals : []); }
  if (v && v.list) return pyrepr(w.out || []);
  return pyrepr(v);
}
function objFrames(s) {
  const w = s.w;
  if (w.type === 'block') return [
    { title: `s: ${w.cls} object`, fields: [['_items', { obj: 'DynamicArray' }]] },
    { title: 's._items: DynamicArray object', fields: [['_size', w.size], ['_capacity', w.cap], ['growth', 2], ['resize_count', w.resizes], ['_block', { arr: w.block.length }]] },
  ];
  if (w.type === 'nodes') return [{ title: 's: LinkedStack object', fields: [['_head', { node: w.head }], ['_size', w.size]] }];
  return w.obj ? [w.obj] : [];
}
function renderVars(s) {
  const box = $('vars'), prev = state.prevSnap;
  const prevIds = new Set((prev ? prev.stack : []).map(f => f.id));
  const prevObjs = prev ? objFrames(prev) : [];
  const was = (fid, name) => {
    if (!prev) return undefined;
    if (typeof fid === 'string') { const o = prevObjs.find(x => x.title === fid); const e = o && o.fields.find(x => x[0] === name); return e ? showVal(prev, e[1]) : undefined; }
    const f = prev.stack.find(x => x.id === fid); if (!f) return undefined;
    const e = f.locals.find(x => x[0] === name); return e ? showVal(prev, e[1]) : undefined;
  };
  const row = (fid, n, v) => {
    const shown = showVal(s, v), old = was(fid, n), chg = old !== undefined && old !== shown;
    const isRef = shown.startsWith('→');
    return `<span class="k">${esc(n)}</span><span class="v ${isRef ? 'ref' : ''} ${chg ? 'chg' : ''}">${esc(clip(shown, 64))}</span>`;
  };
  let html = '';
  for (const o of objFrames(s))
    html += `<div class="frame obj"><div class="fh"><span class="fname">${esc(o.title)}</span><span class="chip">on the heap</span></div><div class="locals">` +
      o.fields.map(([n, v]) => row(o.title, n, v)).join('') + `</div></div>`;
  for (let k = s.stack.length - 1; k >= 0; k--) {
    const f = s.stack[k], isTop = k === s.stack.length - 1;
    let cls = (f.fn === '<module>' ? 'module ' : '') + f.status;
    if (prev && !prevIds.has(f.id) && f.fn !== '<module>') cls += ' new';
    let chip;
    if (f.fn === '<module>') chip = f.status === 'error' ? 'error' : isTop ? (state.idx === 0 ? 'ready' : 'shell') : 'waiting';
    else if (f.status === 'active') chip = `running · line ${f.line}`;
    else if (f.status === 'waiting') chip = `paused · line ${f.line}`;
    else if (f.status === 'returning') chip = `returns ${clip(pyrepr(f.ret), 16)}`;
    else chip = 'abandoned';
    const locals = f.locals.map(([n, v]) => row(f.id, n, v)).join('');
    html += `<div class="frame ${cls}"><div class="fh"><span class="fname">${f.fn === '<module>' ? '&lt;module&gt;' : esc(f.label)}</span><span class="chip">${esc(chip)}</span></div>` +
      (locals ? `<div class="locals">${locals}</div>` : '') + (f.note ? `<div class="fnote">${esc(f.note)}</div>` : '') + `</div>`;
  }
  box.innerHTML = html;
  $('varInfo').textContent = s.depth ? `${plural(s.depth, 'call')} running` : '';
}

  $('bQuiz').addEventListener('click', () => {
    state.quiz = !state.quiz;
    $('bQuiz').innerHTML = `Questions: ${state.quiz ? 'on' : 'off'} <kbd>Q</kbd>`;
    $('bQuiz').classList.toggle('on', state.quiz);
    state.nudge = ''; renderNarr(); $('nudge').textContent = '';
  });
  $('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(dark ? 'light' : 'dark');
  });
  $('fsBtn').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.target.tagName === 'SELECT') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const s = snapAt(state.idx);
    if (s.q && state.quiz && !state.answered.has(state.idx)) {
      const map = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
      if (k in map && map[k] < s.q.choices.length) { e.preventDefault(); answer(map[k]); return; }
      if (k === 'v') { e.preventDefault(); answer(-1); return; }
    }
    if (k === 'arrowright' || k === ' ') { e.preventDefault(); stop(); step(); }
    else if (k === 'arrowleft') { e.preventDefault(); back(); }
    else if (k === 'o') skipLoop();
    else if (k === 'u') stepOut();
    else if (k === 'p') play();
    else if (k === 'r') { stop(); go(0); }
    else if (k === 'e' || k === 'end') { stop(); go(state.T.steps.length - 1); }
    else if (k === 'q') $('bQuiz').click();
    else if (k === 'f') $('fsBtn').click();
  });
}

/* Self-check: open the page as stack-lab.html#selftest to build every
   scenario with its default input, a few edge inputs and random inputs,
   render every step, and print one JSON line per run (tools compare the
   shell lines with Python). */
const SELFTEST_EXTRA = {
  push: [{ values: [] }, { values: [1] }, { values: ['a', 'b'], value: 'c' }], push_resize: [{ values: [1, 2, 3, 4, 5, 6, 7, 8] }],
  pop: [{ values: [] }, { values: [9] }, { values: [1, 2, 3, 4, 5] }], peek: [{ values: [] }, { values: ['x'] }],
  pop_empty: [{ values: [] }, { values: [1, 2] }], amortised: [{ n: 1 }, { n: 16 }, { n: 5 }],
  l_push: [{ values: [] }], l_pop: [{ values: [] }, { values: [5] }],
  w_front_push: [{ values: [] }, { values: [1, 2, 3, 4] }], w_front_pop: [{ values: [] }, { values: [8] }],
  w_pop_none: [{ values: [] }, { values: [1, 2] }, { values: ['ab'] }], w_peek_pops: [{ values: [1] }, { values: [4, 5] }],
  bal_ok: [{ text: '' }, { text: '{[()()]}' }, { text: 'x' }], bal_cross: [{ text: '{(})' }], bal_closer: [{ text: ')' }, { text: ']' }], bal_open: [{ text: '(' }, { text: '[[]' }],
  w_bal_partner: [{ text: '(]' }, { text: '()' }], w_bal_empty: [{ text: ')' }, { text: '(]' }], w_bal_final: [{ text: '(' }, { text: '(]' }],
  pf_eval: [{ text: '' }, { text: '2 3 4 * 5 - +' }, { text: '1.5 2 *' }, { text: '5 x +' }, { text: '-3 4 -' }], pf_div: [{ text: '1 0 /' }, { text: '1.0 0 /' }, { text: '8 2 /' }, { text: '1 3 /' }, { text: '.5 .25 /' }],
  pf_short: [{ text: '+' }, { text: '1 2 + *' }], pf_extra: [{ text: '1 2 3 +' }], w_pf_swapped: [{ text: '8 2 /' }, { text: '3 4 +' }],
  sy_prec: [{ text: '' }, { text: 'a + b * c' }, { text: '1 / 2 / 3' }], sy_paren: [{ text: '( 1 + 2' }, { text: '1 + 2 )' }, { text: '( ( 1 ) )' }],
  w_sy_strict: [{ text: '8 / 4 / 2' }, { text: '1 + 2 * 3' }], calc: [{ text: '8 - 3 - 2' }, { text: '1 / 0' }, { text: '( 2 + 3 ) / 2' }],
  nested_sum: [{ nested: [] }, { nested: [[], [[]]] }, { nested: [1, 2, 3] }, { nested: [[1, [2]], [[3], 4]] }],
  undo_redo: [{ w1: 'a', w2: 'bc', w3: 'd' }],
};
/* Random inputs: a small seeded generator, so a failing run can be repeated. */
let seed = 20261026;
const rnd = n => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (((t ^ (t >>> 14)) >>> 0) % n); };
const pick = a => a[rnd(a.length)];
function randomParams(sc) {
  const p = {};
  for (const k in sc.params) {
    const spec = sc.params[k];
    if (spec.type === 'int') p[k] = spec.min + rnd(spec.max - spec.min + 1);
    else if (spec.type === 'value') p[k] = spec.str ? pick(['x', 'ab', ' hi', 'Q!']) : rnd(2) ? rnd(200) - 50 : pick(['a', 'zz', 'k']);
    else if (spec.type === 'list') { const n = spec.minLen + rnd(spec.maxLen - spec.minLen + 1); p[k] = Array.from({ length: n }, () => rnd(3) ? rnd(100) : pick(['p', 'q'])); }
    else if (spec.type === 'nested') { const gen = d => Array.from({ length: rnd(3) + (d ? 0 : 1) }, () => (d < 2 && rnd(3) === 0 ? gen(d + 1) : rnd(20))); p[k] = gen(0); }
    else if (sc.group === 'brackets' || /bal/.test(sc.id)) p[k] = Array.from({ length: rnd(9) }, () => pick(['(', ')', '[', ']', '{', '}', 'a'])).join('');
    else if (/^pf|pf_/.test(sc.id)) p[k] = Array.from({ length: 1 + rnd(7) }, () => rnd(5) < 3 ? String(rnd(12)) : pick(OPS)).join(' ');
    else {
      const t = []; let open = 0;
      const n = 1 + rnd(4);
      for (let i = 0; i < n; i++) {
        if (rnd(3) === 0) { t.push('('); open++; }
        t.push(String(1 + rnd(9)));
        if (open && rnd(2)) { t.push(')'); open--; }
        if (i < n - 1) t.push(pick(OPS));
      }
      while (open--) t.push(')');
      p[k] = t.join(' ');
    }
  }
  return p;
}
function validParams(sc, p) {
  for (const k in sc.params) { const spec = sc.params[k]; if (spec.check) { const ok = spec.check(p[k]); if (ok !== true) return ok; } }
  return true;
}
function selftest() {
  const lines = [];
  for (const sc of SCENARIOS) {
    const base = {}; for (const k in sc.params) base[k] = sc.params[k].def;
    const runs = [base, ...(SELFTEST_EXTRA[sc.id] || []).map(e => Object.assign({}, base, e))];
    for (let r = 0; r < 4; r++) runs.push(randomParams(sc));
    for (const p of runs) {
      try {
        const ok = validParams(sc, p);
        if (ok !== true) { lines.push(JSON.stringify({ id: sc.id, params: p, skipped: ok })); continue; }
        const T = build(sc, p);
        const shell = T.out.map(o => o.k === 'err' ? o.t.split('\n').pop() : o.t);
        const qs = T.steps.filter(x => x.q).length;
        const nlines = sc.code.split('\n').length;
        const badLine = T.steps.some(x => x.line > nlines || x.stack.some(f => f.line > nlines));
        const badQ = T.steps.some(x => x.q && (x.q.answer < 0 || x.q.choices.length < 2));
        state.sc = sc; state.T = T; state.params = p; state.prevSnap = null; state.idx = 0;
        picSetup();
        for (let i = 0; i < T.steps.length; i++) { state.prevSnap = i ? T.steps[i - 1] : null; state.idx = i; render(); }
        lines.push(JSON.stringify({ id: sc.id, params: p, steps: T.steps.length, questions: qs, badLine, badQ, shell, code: sc.code, src: sc.src }));
      } catch (e) { lines.push(JSON.stringify({ id: sc.id, params: p, crash: e.message + ' ' + (e.stack || '').split('\n')[1] })); }
    }
  }
  const pre = $('selftest'); pre.hidden = false; pre.textContent = lines.join('\n');
}

initPicker();
wire();
try { const t = localStorage.getItem('stack-lab-theme'); if (t) setTheme(t); } catch (e) {}
const themeArg = /[#&]theme=(light|dark)/.exec(location.hash); if (themeArg) setTheme(themeArg[1]);
let startId = 'lifo';
try { startId = localStorage.getItem('stack-lab-scenario') || startId; } catch (e) {}
const hashId = location.hash.slice(1).split('&')[0];
if (hashId && SCENARIOS.some(s => s.id === hashId)) startId = hashId;
loadScenario(startId);
const stepArg = /[#&]step=(\d+)/.exec(location.hash);
if (stepArg) { state.quiz = location.hash.includes('quiz'); go(+stepArg[1]); }
if (location.hash === '#selftest') selftest();
</script>
