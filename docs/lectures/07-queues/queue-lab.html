function parsePy(text) {
  const j = text.trim().replace(/'/g, '"').replace(/\bNone\b/g, 'null').replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false');
  return JSON.parse(j);
}
function applyParams() {
  const sc = state.sc, next = {}; let err = '';
  for (const k in sc.params) {
    const spec = sc.params[k], inp = $('param-' + k);
    inp.classList.remove('bad');
    try {
      if (spec.type === 'int') {
        if (!/^\s*-?\d+\s*$/.test(inp.value)) throw new Error(`${k} must be a whole number.`);
        const v = parseInt(inp.value, 10);
        if (v < spec.min || v > spec.max) throw new Error(`For this demo, ${k} must be between ${spec.min} and ${spec.max}.`);
        next[k] = v;
      } else if (spec.type === 'value') {
        let v; try { v = parsePy(inp.value); } catch (e) { throw new Error(`${k} must be a number, like 99, or a short string, like 'x'.`); }
        if (!isSmall(v)) throw new Error(`${k} must be a whole number below 1000, or a string of 1 to 3 characters.`);
        next[k] = v;
      } else {
        let v; try { v = parsePy(inp.value); } catch (e) { throw new Error(`${k} must be a Python list, like ${pyrepr(spec.def)}.`); }
        if (!Array.isArray(v)) throw new Error(`${k} must be a list.`);
        if (v.length < spec.minLen || v.length > spec.maxLen) throw new Error(`For this demo, ${k} must have ${spec.minLen} to ${spec.maxLen} items.`);
        const ok = spec.check ? spec.check(v) : true;
        if (ok !== true) throw new Error(ok);
        next[k] = v;
      }
    } catch (e) { inp.classList.add('bad'); err = e.message; }
  }
  if (!err && sc.check) { const ok = sc.check(next); if (ok !== true) err = ok; }
  $('callerr').textContent = err;
  if (err) return;
  state.params = next;
  for (const k in next) { const inp = $('param-' + k); inp.value = pyrepr(next[k]); inp.size = Math.max(2, inp.value.length); }
  rebuild();
}

function rebuild() {
  stop();
  state.T = build(state.sc, state.params);
  state.idx = 0; state.answered = new Map(); state.prevSnap = null;
  picSetup();
  $('scrub').max = state.T.steps.length - 1;
  render();
}

/* ---------- navigation ---------- */
const snapAt = i => state.T.steps[i];
const pendingQ = () => { const s = snapAt(state.idx); return state.quiz && s.q && !state.answered.has(state.idx); };
function go(i) {
  const N = state.T.steps.length;
  i = Math.max(0, Math.min(N - 1, i));
  if (i === state.idx) return false;
  state.prevSnap = snapAt(state.idx);
  state.idx = i;
  state.nudge = '';
  render();
  return true;
}
function guard() {
  if (pendingQ()) { state.nudge = 'Answer the question first (keys A–D), or press Reveal.'; $('nudge').textContent = state.nudge; return false; }
  return true;
}
function step() { if (!guard()) { stop(); return false; } return go(state.idx + 1); }
function back() { stop(); go(state.idx - 1); }
function skipLoop() {
  if (!guard()) return;
  stop();
  const S = state.T.steps, lp = S[state.idx].loop, d = S[state.idx].depth;
  let j = state.idx + 1;
  if (lp) while (j < S.length && S[j].loop === lp && S[j].depth === d && !(state.quiz && S[j].q)) j++;
  go(j);
}
function stepOut() {
  if (!guard()) return;
  stop();
  const S = state.T.steps, d = S[state.idx].depth;
  let j = state.idx + 1;
  while (j < S.length && S[j].depth >= d && d > 0) j++;
  go(j);
}
function play() {
  if (state.timer) { stop(); return; }
  if (state.idx >= state.T.steps.length - 1) go(0);
  $('bPlay').innerHTML = 'Pause <kbd>P</kbd>'; $('bPlay').classList.add('on');
  const tick = () => {
    if (!step() || state.idx >= state.T.steps.length - 1 || pendingQ()) { stop(); return; }
    state.timer = setTimeout(tick, delay());
  };
  state.timer = setTimeout(tick, Math.min(400, delay()));
}
function stop() {
  if (state.timer) clearTimeout(state.timer);
  state.timer = null;
  $('bPlay').innerHTML = 'Play <kbd>P</kbd>'; $('bPlay').classList.remove('on');
}
const delay = () => [2600, 2000, 1500, 1150, 900, 700, 520, 380, 260, 160][+$('speed').value - 1];

function answer(k) {
  const s = snapAt(state.idx);
  if (!s.q || state.answered.has(state.idx)) return;
  state.answered.set(state.idx, k);
  state.nudge = '';
  renderNarr();
  $('nudge').textContent = '';
}

/* ---------- rendering ---------- */
function render() {
  const s = snapAt(state.idx);
  renderCode(s);
  renderNarr();
  renderVars(s);
  renderPic(s);
  renderOut(s);
  renderTransport(s);
  scrollCode();
}
function scrollCode() {
  const box = $('code'), cur = box.querySelector('.ln.cur, .ln.ret, .ln.errl');
  if (!cur) return;
  const r = cur.getBoundingClientRect(), br = box.getBoundingClientRect();
  if (r.top < br.top + 4 || r.bottom > br.bottom - 4) box.scrollTop += r.top - br.top - br.height / 2 + r.height / 2;
}

function renderCode(s) {
  const lines = state.sc.code.split('\n');
  const frames = s.stack.slice(1), top = s.stack[s.stack.length - 1];
  const waiting = {};
  for (const f of frames) if (f !== top && f.status === 'waiting') (waiting[f.line] = waiting[f.line] || []).push(f);
  const errLine = s.kind === 'err' && frames.length ? frames[frames.length - 1].line : 0;
  const last = state.idx === state.T.steps.length - 1;
  const marks = state.sc.bugMark || [];
  let html = '';
  lines.forEach((ln, i) => {
    const no = i + 1;
    let cls = '';
    const tags = [];
    if (top.fn !== '<module>' && top.line === no) {
      if (top.status === 'returning') { cls = 'ret'; tags.push(`<span class="tag r">returns ${esc(clip(pyrepr(top.ret), 22))}</span>`); }
      else if (top.status === 'error') { cls = 'errl'; tags.push(`<span class="tag e">error here</span>`); }
      else { cls = 'cur'; tags.push(`<span class="tag a">${esc(clip(top.label, 26))}</span>`); }
    } else if (errLine === no) cls = 'errl';
    if (waiting[no]) { if (!cls) cls = 'waitl'; tags.push(`<span class="tag w">${esc(clip(waiting[no][0].label, 24))} paused</span>`); }
    if (last && marks.some(m => ln.includes(m))) { cls += ' bug'; tags.push('<span class="tag e">bug</span>'); }
    html += `<div class="ln ${cls}"><span class="no">${no}</span><span class="src">${highlight(ln) || ' '}</span><span class="tags">${tags.join('')}</span></div>`;
  });
  $('code').innerHTML = html;
  $('lineInfo').textContent = top.fn === '<module>' ? '' : `${top.label} · line ${top.line}`;
}

function renderNarr() {
  const s = snapAt(state.idx), box = $('narr');
  let html = `<div class="say ${s.kind === 'err' ? 'err' : ''}">${md(s.msg)}</div>`;
  if (s.q && state.quiz) {
    const chosen = state.answered.get(state.idx);
    const done = chosen !== undefined && chosen !== -2;
    html += `<div class="qcard" role="group" aria-label="Question"><div class="qlabel">What happens next?</div><div class="qtext">${md(s.q.text)}</div><div class="choices">`;
    s.q.choices.forEach((c, k) => {
      let cls = '';
      if (done) { if (k === s.q.answer) cls = 'right'; else if (k === chosen) cls = 'wrong'; }
      html += `<button class="choice ${cls}" data-k="${k}" ${done ? 'disabled' : ''}><span class="k">${'ABCD'[k]}</span><span>${md(c)}</span></button>`;
    });
    html += `</div>`;
    if (done) {
      const verdict = chosen === -1 ? 'Answer:' : chosen === s.q.answer ? 'Correct.' : `Not quite. The answer is ${'ABCD'[s.q.answer]}.`;
      html += `<div class="why"><b>${verdict}</b> ${md(s.q.why)}</div>`;
    } else {
      html += `<div class="qactions"><button class="btn" id="qReveal">Reveal <kbd>V</kbd></button><button class="btn" id="qSkip">Skip question</button></div>`;
    }
    html += `</div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => answer(+b.dataset.k)));
  scrollCode();
  const rv = $('qReveal'); if (rv) rv.addEventListener('click', () => answer(-1));
  const sk = $('qSkip'); if (sk) sk.addEventListener('click', () => { state.answered.set(state.idx, -2); step(); });
}

function showVal(s, v) {
  if (isRef(v)) return '→ Node(' + pyrepr(s.heap[v.n].v) + ')';
  if (v && v.self) return '→ the queue object';
  if (v && v.obj) { const o = s.objs.find(x => x.key === v.obj); return `→ ${o ? o.cls : v.obj} object`; }
  if (v && v.blk) { const b = s.blocks[v.blk]; return b ? `→ Array of ${b.cells.length} slots` : '→ Array'; }
  return pyrepr(v);
}
function renderVars(s) {
  const box = $('vars');
  const prev = state.prevSnap;
  const prevIds = new Set((prev ? prev.stack : []).map(f => f.id));
  const was = (fid, name) => {
    if (!prev) return undefined;
    if (typeof fid === 'string') { const o = prev.objs.find(x => x.key === fid); const e = o && o.fields.find(x => x[0] === name); return e ? JSON.stringify(e[1]) : undefined; }
    const f = prev.stack.find(x => x.id === fid); if (!f) return undefined;
    const e = f.locals.find(x => x[0] === name); return e ? JSON.stringify(e[1]) : undefined;
  };
  const row = (fid, n, v) => {
    const old = was(fid, n), chg = old !== undefined && old !== JSON.stringify(v);
    const ref = isRef(v) || (v && (v.obj || v.blk));
    return `<span class="k">${esc(n)}</span><span class="v ${ref ? 'ref' : ''} ${chg ? 'chg' : ''}">${esc(clip(showVal(s, v), 64))}</span>`;
  };
  const objName = o => {
    for (const f of s.stack) for (const [n, v] of f.locals) if (v && v.obj === o.key) return n;
    for (const p of s.objs) for (const [n, v] of p.fields) if (v && v.obj === o.key) return objName(p) + '.' + n;
    return o.key;
  };
  let html = s.objs.map(o => `<div class="frame obj"><div class="fh"><span class="fname">${esc(objName(o))}: ${esc(o.cls)} object</span><span class="chip">on the heap</span></div><div class="locals">` +
    o.fields.map(([n, v]) => row(o.key, n, v)).join('') + `</div></div>`).join('');
  for (let k = s.stack.length - 1; k >= 0; k--) {
    const f = s.stack[k], isTop = k === s.stack.length - 1;
    let cls = (f.fn === '<module>' ? 'module ' : '') + f.status;
    if (prev && !prevIds.has(f.id) && f.fn !== '<module>') cls += ' new';
    let chip;
    if (f.fn === '<module>') chip = f.status === 'error' ? 'error' : isTop ? (state.idx === 0 ? 'ready' : 'shell') : 'waiting';
    else if (f.status === 'active') chip = `running · line ${f.line}`;
    else if (f.status === 'waiting') chip = `paused · line ${f.line}`;
    else if (f.status === 'returning') chip = `returns ${clip(pyrepr(f.ret), 16)}`;
    else chip = 'abandoned';
    const locals = f.locals.map(([n, v]) => row(f.id, n, v)).join('');
    html += `<div class="frame ${cls}"><div class="fh"><span class="fname">${f.fn === '<module>' ? '&lt;module&gt;' : esc(f.label)}</span><span class="chip">${esc(chip)}</span></div>` +
      (locals ? `<div class="locals">${locals}</div>` : '') + (f.note ? `<div class="fnote">${esc(f.note)}</div>` : '') + `</div>`;
  }
  box.innerHTML = html;
  $('varInfo').textContent = s.depth ? `${plural(s.depth, 'method')} running` : '';
}

/* ---------- the picture ---------- */
const CW = 46, CH = 38, CG = 5, TAGH = 18;
function put(P, layer, key, tag, fn) {
  let el = P.els.get(key), fresh = false;
  if (!el) { el = document.createElementNS(SVGNS, tag); fresh = true; }
  fn(el, fresh);
  if (fresh) { layer.appendChild(el); P.els.set(key, el); }
  P.seen.add(key);
  return el;
}
const markers = () => `<defs>${['n:var(--ink)', 'hot:var(--accent)', 'chg:var(--done)', 'mv:var(--done)', 'wt:var(--wait)'].map(m => { const [k, c] = m.split(':'); return `<marker id="mk-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${c}"/></marker>`; }).join('')}</defs>`;

function picSetup() {
  const T = state.T, kind = state.sc.kind, box = $('picbox');
  let W, H;
  const P = { kind, els: new Map() };
  if (kind === 'linked') {
    let maxX = 2, row1 = false;
    for (const s of T.steps) if (s.lay) for (const id in s.lay.pos) { maxX = Math.max(maxX, s.lay.pos[id].x + 1); if (s.lay.pos[id].row) row1 = true; }
    P.g = { W: 88, H: 40, valW: 58, colW: 132 }; P.PAD = 20; P.TOP = 34; P.row1Y = P.TOP + 40 + 70;
    W = P.PAD * 2 + maxX * P.g.colW + 30; H = (row1 ? P.row1Y + 40 + 50 : P.TOP + 40 + 60);
  } else if (kind === 'two') {
    let m = 3; for (const s of T.steps) m = Math.max(m, s.stacks.inbox.length, s.stacks.outbox.length);
    P.SW = 92; P.SH = 30; P.base = 40 + (m + 1) * P.SH; P.x1 = 40; P.x2 = 40 + P.SW + 150;
    W = P.x2 + P.SW + 40; H = P.base + 46;
  } else {
    let maxLen = 1, rows = 1, ring = false, ringR = 0, tagStack = 1;
    for (const s of T.steps) {
      rows = Math.max(rows, s.order.length);
      for (const k of s.order) maxLen = Math.max(maxLen, s.blocks[k].cells.length);
      if (s.ring) { ring = true; ringR = Math.max(ringR, s.ring.len); }
      const per = {}; for (const p of s.ptrs) { const key = p.b + ':' + p.i; per[key] = (per[key] || 0) + 1; tagStack = Math.max(tagStack, per[key]); }
    }
    P.tagStack = tagStack;
    P.rowH = 30 + tagStack * (TAGH + 3) + CH + 22 + TAGH + 10;
    P.ring = ring;
    P.R = ring ? Math.max(70, Math.min(118, 26 + ringR * 9)) : 0;
    P.ringW = ring ? 2 * P.R + 150 : 0;
    P.SX = P.ringW + 16;
    W = P.SX + maxLen * (CW + CG) + 70;
    H = Math.max(rows * P.rowH + 10, ring ? 2 * P.R + 150 : 0);
    P.cy = ring ? H / 2 - 8 : 0; P.cx = P.R + 75;
  }
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="The queue's storage">${markers()}<g class="lyr-a"></g><g class="lyr-n"></g><g class="lyr-t"></g></svg>`;
  const svg = box.querySelector('svg');
  svg.style.minWidth = Math.round(W * (innerWidth < 760 ? 0.85 : 0.55)) + 'px';   /* narrow screens scroll the picture, not the page */
  Object.assign(P, { W, H, svg, la: svg.querySelector('.lyr-a'), ln: svg.querySelector('.lyr-n'), lt: svg.querySelector('.lyr-t') });
  state.pic = P;
}

function renderPic(s) {
  const P = state.pic; P.seen = new Set();
  if (P.kind === 'linked') renderNodes(s, P);
  else if (P.kind === 'two') renderStacks(s, P);
  else renderArrays(s, P);
  for (const [k, el] of P.els) if (!P.seen.has(k)) { el.remove(); P.els.delete(k); }
}

/* Array blocks, slot by slot, and the ring drawn as a circle. */
function renderArrays(s, P) {
  const fl = {}; for (const f of s.flash) fl[f.b + ':' + f.i] = f.k;
  const rowOf = {}; s.order.forEach((k, i) => { rowOf[k] = i; });
  const cellX = i => P.SX + i * (CW + CG), rowY = r => 26 + r * P.rowH + P.tagStack * (TAGH + 3);
  const live = k => new Set(s.live[k] || []), dead = k => new Set(s.dead[k] || []);
  const sm = s.sizemark;
  for (const k of s.order) {
    const b = s.blocks[k], y = rowY(rowOf[k]), L = live(k), D = dead(k);
    put(P, P.lt, 'L' + k, 'text', el => {
      el.setAttribute('class', 'blabel' + (b.old ? ' old' : ''));
      el.setAttribute('x', P.SX); el.setAttribute('y', y - P.tagStack * (TAGH + 3) - 10);
      el.textContent = b.label + (b.old ? '  (old block)' : '') + `  ·  ${b.cells.length} slots`;
    });
    b.cells.forEach((v, i) => {
      const f = fl[k + ':' + i], isLive = L.has(i), oob = s.oob && s.oob.b === k && s.oob.i === i;
      const cls = ['cl', isLive ? 'live' : 'free', !isLive && v !== null && !b.old ? 'stale' : '', D.has(i) ? 'dead' : '', f || '', b.old ? 'old' : ''].join(' ');
      put(P, P.ln, `C${k}:${i}`, 'g', (el, fresh) => {
        el.setAttribute('class', cls + (fresh && state.idx > 0 ? ' born' : ''));
        el.style.transform = `translate(${cellX(i)}px, ${y}px)`;
        el.innerHTML = `<rect class="bx" width="${CW}" height="${CH}" rx="5"/><text class="v" x="${CW / 2}" y="${CH / 2 + 5}" text-anchor="middle">${esc(v === null ? (D.has(i) ? 'dead' : '') : clip(pyrepr(v), 6))}</text><text class="ix" x="${CW / 2}" y="${CH + 14}" text-anchor="middle">${i}</text>`;
      });
    });
    if (s.oob && s.oob.b === k && s.oob.i >= b.cells.length) {
      put(P, P.ln, 'OOB', 'g', el => {
        el.setAttribute('class', 'cl oob');
        el.style.transform = `translate(${cellX(s.oob.i)}px, ${y}px)`;
        el.innerHTML = `<rect class="bx" width="${CW}" height="${CH}" rx="5"/><text class="v" x="${CW / 2}" y="${CH / 2 + 5}" text-anchor="middle">?</text><text class="ix" x="${CW / 2}" y="${CH + 14}" text-anchor="middle">${s.oob.i}</text>`;
      });
    }
    if (sm && sm.b === k) put(P, P.lt, 'SZ', 'g', el => {
      el.setAttribute('class', 'szm');
      el.style.transform = `translate(${cellX(sm.n) - CG / 2}px, ${y - 4}px)`;
      el.innerHTML = `<line x1="0" y1="0" x2="0" y2="${CH + 26}"/><text x="4" y="${CH + 34}">_size = ${sm.n}</text>`;
    });
  }
  /* copy and shift arrows */
  s.arrows.forEach((a, n) => {
    if (rowOf[a.fb] === undefined || rowOf[a.b] === undefined) return;
    const x1 = cellX(a.from) + CW / 2, x2 = cellX(a.to) + CW / 2, ys = rowY(rowOf[a.fb]), yt = rowY(rowOf[a.b]);
    let d;
    if (a.fb === a.b) { const lift = 16 + Math.abs(x1 - x2) * 0.15; d = `M${x1},${ys + CH} C${x1},${ys + CH + lift} ${x2},${yt + CH + lift} ${x2},${yt + CH + 2}`; }
    else d = `M${x1},${ys + CH + 16} C${x1},${(ys + CH + yt) / 2 + 10} ${x2},${(ys + CH + yt) / 2 - 10} ${x2},${yt - 2}`;
    put(P, P.la, 'AR' + n, 'path', el => { el.setAttribute('class', 'mv'); el.setAttribute('d', d); el.setAttribute('marker-end', 'url(#mk-mv)'); });
  });
  /* pointer tags above the cells */
  const per = {};
  for (const p of s.ptrs) {
    if (rowOf[p.b] === undefined || p.i === undefined || p.i === null) continue;
    const key = (p.t ? 'b' : 'a') + p.b + ':' + p.i, n = per[key] = (per[key] || 0) + 1;
    const w = p.l.length * 7.4 + 12;
    let x = cellX(p.i) + CW / 2;
    const y = p.t ? rowY(rowOf[p.b]) + CH + 20 + (n - 1) * (TAGH + 3) : rowY(rowOf[p.b]) - 6 - n * (TAGH + 3) + 3;
    if (p.t) x = Math.min(Math.max(x, cellX(0) + w / 2 - 4), P.W - w / 2 - 4);
    put(P, P.lt, 'P' + p.b + p.l, 'g', el => {
      el.setAttribute('class', 'tg' + (p.a ? ' hot' : '') + (p.t ? ' tl' : ''));
      el.style.transform = `translate(${x}px, ${y}px)`;
      const ax = cellX(p.i) + CW / 2 - x;
      el.innerHTML = `<rect x="${-w / 2}" y="0" width="${w}" height="${TAGH}" rx="4"/><text x="0" y="${TAGH - 5}" text-anchor="middle">${esc(p.l)}</text>` +
        (n !== 1 ? '' : p.t ? `<line x1="${ax}" y1="0" x2="${ax}" y2="-5"/>` : `<line x1="0" y1="${TAGH}" x2="0" y2="${TAGH + 5}"/>`);
    });
  }
  if (s.ring) renderRing(s, P, fl);
  /* the counts under the picture */
  const r = s.ring;
  $('viewMeta').innerHTML = r ? `head <b>${r.head}</b> · ${r.stored ? 'tail' : 'size'} <b>${r.stored ? r.tail : r.size}</b> · capacity <b>${r.cap}</b>${r.len !== r.cap ? ` <b style="color:var(--err)">(block: ${r.len})</b>` : ''}` :
    sm ? `_size <b>${sm.n}</b> · _capacity <b>${s.blocks[sm.b] ? s.blocks[sm.b].cells.length : '?'}</b>` : '';
  $('legend').innerHTML = `<span><i class="box" style="border-color:var(--wait);background:var(--wait-bg)"></i>in the queue</span><span><i class="box" style="border-color:var(--line);border-style:dashed"></i>free</span>` +
    `<span><i class="box" style="border-color:var(--hit);background:var(--hit-bg)"></i>read</span><span><i class="box" style="border-color:var(--done);background:var(--done-bg)"></i>written</span>` +
    (s.order.some(k => s.blocks[k].cells.some((v, i) => v !== null && !(s.live[k] || []).includes(i))) ? `<span><i class="box" style="border-color:var(--err)"></i>holds a value, but not in the queue</span>` : '') +
    (P.ring ? '<span>The ring is the same block: slot after the last is slot 0.</span>' : '');
}

function renderRing(s, P, fl) {
  const r = s.ring, n = r.len, cx = P.cx, cy = P.cy, R = P.R, ri = R - 34;
  const ang = i => -Math.PI / 2 + (i + 0.5) * 2 * Math.PI / n, a0 = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (a, rad) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
  const L = new Set(s.live[r.b] || []), cells = s.blocks[r.b].cells;
  for (let i = 0; i < n; i++) {
    const g = 0.012 * (n > 1 ? 1 : 0), A = a0(i) + g, B = a0(i + 1) - g, big = B - A > Math.PI ? 1 : 0;
    const [x1, y1] = pt(A, R), [x2, y2] = pt(B, R), [x3, y3] = pt(B, ri), [x4, y4] = pt(A, ri);
    const d = n === 1 ? `M${cx - R},${cy} a${R},${R} 0 1,0 ${2 * R},0 a${R},${R} 0 1,0 ${-2 * R},0 M${cx - ri},${cy} a${ri},${ri} 0 1,1 ${2 * ri},0 a${ri},${ri} 0 1,1 ${-2 * ri},0`
      : `M${x1},${y1} A${R},${R} 0 ${big},1 ${x2},${y2} L${x3},${y3} A${ri},${ri} 0 ${big},0 ${x4},${y4} Z`;
    const v = cells[i], f = fl[r.b + ':' + i], isLive = L.has(i);
    const cls = ['rs', isLive ? 'live' : 'free', !isLive && v !== null ? 'stale' : '', f || ''].join(' ');
    const [tx, ty] = pt(ang(i), (R + ri) / 2), [ix, iy] = pt(ang(i), R + 13);

    });
  }

  const hand = (key, i, label, cls, rad) => {
    const a = ang(i), [hx, hy] = pt(a, ri - 4), [lx, ly] = pt(a, rad);
    const dx = Math.cos(a) * (label.length * 3.7 + 6);
    put(P, P.la, 'H' + key, 'line', el => { el.setAttribute('class', 'hand ' + cls); el.setAttribute('x1', cx); el.setAttribute('y1', cy); el.setAttribute('x2', hx); el.setAttribute('y2', hy); el.setAttribute('marker-end', `url(#mk-${cls === 'tl' ? 'hot' : 'wt'})`); });
    const w = label.length * 7.4 + 12;
    put(P, P.lt, 'HT' + key, 'g', el => {
      el.setAttribute('class', 'tg ' + (cls === 'tl' ? 'tl' : ''));

      el.innerHTML = `<rect x="${-w / 2}" y="0" width="${w}" height="${TAGH}" rx="4"/><text x="0" y="${TAGH - 5}" text-anchor="middle">${esc(label)}</text>`;

  });
}

/* The two stacks of a StackQueue, bottom to top. */
function renderStacks(s, P) {
  const fl = s.sflash || [];
  const col = (name, x, label) => {
    const items = s.stacks[name];
    put(P, P.lt, 'SL' + name, 'text', el => { el.setAttribute('class', 'blabel'); el.setAttribute('x', x + P.SW / 2); el.setAttribute('y', P.base + 26); el.setAttribute('text-anchor', 'middle'); el.textContent = label; });
    put(P, P.la, 'SB' + name, 'path', el => { el.setAttribute('class', 'sbase'); el.setAttribute('d', `M${x - 8},${P.base - (items.length + 1.2) * P.SH - 6} V${P.base + 4} H${x + P.SW + 8} V${P.base - (items.length + 1.2) * P.SH - 6}`); });
    const pushed = fl.some(f => f.s === name && f.k === 'push');
    items.forEach((v, i) => {
      const top = i === items.length - 1;
      put(P, P.ln, `S${name}:${i}`, 'g', (el, fresh) => {
        el.setAttribute('class', 'cl live' + (top && pushed ? ' wr' : '') + (fresh && state.idx > 0 ? ' born' : ''));
        el.style.transform = `translate(${x}px, ${P.base - (i + 1) * P.SH}px)`;
        el.innerHTML = `<rect class="bx" width="${P.SW}" height="${P.SH - 3}" rx="5"/><text class="v" x="${P.SW / 2}" y="${P.SH / 2 + 4}" text-anchor="middle">${esc(clip(pyrepr(v), 8))}</text>`;
      });
    });
    const popped = fl.filter(f => f.s === name && f.k === 'pop').pop();
    if (popped) put(P, P.ln, 'SG' + name, 'g', el => {
      el.setAttribute('class', 'cl ghost');
      el.style.transform = `translate(${x}px, ${P.base - (items.length + 1) * P.SH}px)`;
      el.innerHTML = `<rect class="bx" width="${P.SW}" height="${P.SH - 3}" rx="5"/><text class="v" x="${P.SW / 2}" y="${P.SH / 2 + 4}" text-anchor="middle">${esc(clip(pyrepr(popped.v), 8))} ↑</text>`;
    });
    put(P, P.lt, 'ST' + name, 'g', el => {
      el.setAttribute('class', 'tg');

      el.style.opacity = items.length ? 1 : 0;
      el.innerHTML = `<rect x="-17" y="0" width="34" height="${TAGH}" rx="4"/><text x="0" y="${TAGH - 5}" text-anchor="middle">top</text>`;
    });
  };
  col('inbox', P.x1, '_inbox: enqueue pushes');
  col('outbox', P.x2, '_outbox: dequeue pops');
  const pour = fl.find(f => f.s === 'inbox' && f.k === 'pop') && fl.find(f => f.s === 'outbox' && f.k === 'push');
  const back = fl.find(f => f.s === 'outbox' && f.k === 'pop') && fl.find(f => f.s === 'inbox' && f.k === 'push');
  if (pour || back) {
    const y = P.base - 5 * P.SH / 2, a = P.x1 + P.SW + 14, b = P.x2 - 14;
    const d = pour ? `M${a},${y} C${a + 50},${y - 40} ${b - 50},${y - 40} ${b},${y}` : `M${b},${y + 24} C${b - 50},${y + 64} ${a + 50},${y + 64} ${a},${y + 24}`;
    put(P, P.la, 'POUR', 'path', el => { el.setAttribute('class', 'mv'); el.setAttribute('d', d); el.setAttribute('marker-end', 'url(#mk-mv)'); });
  }
  const n = s.stacks.inbox.length + s.stacks.outbox.length;
  $('viewMeta').innerHTML = `in the queue <b>${n}</b> · front: <b>${s.stacks.outbox.length ? esc(pyrepr(s.stacks.outbox[s.stacks.outbox.length - 1])) : s.stacks.inbox.length ? esc(pyrepr(s.stacks.inbox[0])) : '—'}</b>`;
  $('legend').innerHTML = '<span>The oldest value is on top of the outbox, or, if the outbox is empty, at the bottom of the inbox.</span>';
}

/* Nodes and the head and tail references (the linked queue). */
function renderNodes(s, P) {

  const q = s.objs[0];

    const cls = ['nd', s.focus === nd.id ? 'focus' : '', garbage.has(nd.id) ? 'garbage' : '', nd.id >= prevLen ? 'fresh' : '', p.row && !garbage.has(nd.id) ? 'outq' : ''].join(' ');

      h += `<text class="v" x="${g.valW / 2}" y="${g.H / 2 + 6}" text-anchor="middle">${esc(clip(pyrepr(nd.v), 5))}</text>`;
      h += nd.next === null ? `<line class="none" x1="${g.valW + 5}" y1="${g.H - 6}" x2="${g.W - 5}" y2="6"/>` : `<circle class="dot" cx="${g.valW + (g.W - g.valW) / 2}" cy="${g.H / 2}" r="3.5"/>`;

    const d = ps.row === pt.row && Qx > Px ? `M${Px},${Py} L${Qx},${Qy}` : `M${Px},${Py} C${Px + 50},${Py} ${Qx - 50},${Qy} ${Qx},${Qy}`;
    const st = hot.has('n' + nd.id) ? 'hot' : chg.has('n' + nd.id) ? 'chg' : '';
    put(P, P.la, 'A' + nd.id, 'path', el => { el.setAttribute('class', `ar ${st} ${garbage.has(nd.id) ? 'garbage' : ''}`); el.setAttribute('d', d); el.setAttribute('marker-end', `url(#mk-${st || 'n'})`); });

  s.stack.forEach(f => f.locals.forEach(([n, v]) => { if (isRef(v)) tags.push({ key: `L${f.id}:${n}`, label: n, id: v.n, up: false }); }));

  for (const t of tags) {
    const pos = t.id === null ? { x: noneX, row: 0 } : lay.pos[t.id]; if (!pos) continue;
    if (t.id === null) needNone = true;
    const k = (t.up ? 'u' : 'd') + t.id + ':' + pos.row, n = per[k] = (per[k] || 0);
    per[k]++;
    const w = t.label.length * 7.6 + 12, cx = X(pos.x) + (t.id === null ? 22 : g.W / 2) + (t.up ? (n - 0.5 * 0) * (w + 4) - (n ? w / 2 : 0) : 0);
    const y = t.up ? Y(pos.row) - TAGH - 7 : Y(pos.row) + g.H + 7 + n * (TAGH + 2) + (pos.row ? 14 : 0);

    put(P, P.lt, 'T' + t.key, 'g', el => {
      el.setAttribute('class', cls);
      el.style.transform = `translate(${cx}px, ${y}px)`;
      el.innerHTML = (t.up ? `<line x1="0" y1="${TAGH}" x2="0" y2="${TAGH + 7}"/>` : n === 0 ? `<line x1="0" y1="-7" x2="0" y2="0"/>` : '') + `<rect x="${-w / 2}" y="0" width="${w}" height="${TAGH}" rx="4"/><text x="0" y="${TAGH - 5}" text-anchor="middle">${esc(t.label)}</text>`;

}

function renderOut(s) {
  const prevLen = state.prevSnap && state.prevSnap !== s ? state.prevSnap.out.length : s.out.length;
  const forward = state.prevSnap && state.prevSnap.out.length <= s.out.length;
  $('out').innerHTML = s.out.map((o, i) => `<span class="${o.k} ${forward && i >= prevLen ? 'new' : ''}">${esc(o.t)}</span>`).join('\n');
  $('out').scrollTop = $('out').scrollHeight;
}

function renderTransport(s) {
  const N = state.T.steps.length;
  $('scrub').value = state.idx;
  $('pos').textContent = `step ${state.idx} / ${N - 1}`;
  $('bBack').disabled = state.idx === 0;
  $('bStep').disabled = state.idx >= N - 1;
  $('bOver').disabled = state.idx >= N - 1 || !s.loop;
  $('bOut').disabled = state.idx >= N - 1 || s.depth === 0;
  const c = s.counters, k = state.sc.kind;
  let h = '';
  if (k === 'two') h = `<span title="Calls to push and pop on either stack">Stack ops <b>${c.moves}</b></span>`;
  else if (k !== 'linked') {
    h = `<span title="Slots written in a course Array">Slot writes <b>${c.writes}</b></span>`;
    if (k === 'slow') h += `<span title="Values moved one slot left by pop(0)">Shifts <b>${c.shifts}</b></span>`;
  }
  $('stats').innerHTML = h;
  $('nudge').textContent = state.nudge;

/* ---------- controls ---------- */
function setTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('queue-lab-theme', t || ''); } catch (e) {}
}
function wire() {
  $('bStep').addEventListener('click', () => { stop(); step(); });
  $('bBack').addEventListener('click', back);
  $('bOver').addEventListener('click', skipLoop);
  $('bOut').addEventListener('click', stepOut);
  $('bPlay').addEventListener('click', play);
  $('bRestart').addEventListener('click', () => { stop(); go(0); });
  $('scrub').addEventListener('input', e => { stop(); go(+e.target.value); });
  $('bQuiz').addEventListener('click', () => {
    state.quiz = !state.quiz;
    $('bQuiz').innerHTML = `Questions: ${state.quiz ? 'on' : 'off'} <kbd>Q</kbd>`;
    $('bQuiz').classList.toggle('on', state.quiz);
    state.nudge = ''; renderNarr(); $('nudge').textContent = '';
  });
  $('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(dark ? 'light' : 'dark');
  });
  $('fsBtn').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.target.tagName === 'SELECT') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    const s = snapAt(state.idx);
    if (s.q && state.quiz && !state.answered.has(state.idx)) {
      const map = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
      if (k in map && map[k] < s.q.choices.length) { e.preventDefault(); answer(map[k]); return; }
      if (k === 'v') { e.preventDefault(); answer(-1); return; }
    }
    if (k === 'arrowright' || k === ' ') { e.preventDefault(); stop(); step(); }
    else if (k === 'arrowleft') { e.preventDefault(); back(); }
    else if (k === 'o') skipLoop();
    else if (k === 'u') stepOut();
    else if (k === 'p') play();
    else if (k === 'r') { stop(); go(0); }
    else if (k === 'e' || k === 'end') { stop(); go(state.T.steps.length - 1); }
    else if (k === 'q') $('bQuiz').click();
    else if (k === 'f') $('fsBtn').click();
  });
}

/* Self-check: open the page as queue-lab.html#selftest to build every
   scenario with its default input, fixed edge inputs and random inputs,
   render every step, and print one JSON line per run; check_py.py replays
   the shell lines in real Python. */
const SELFTEST_EXTRA = {
  slow_enqueue: [{ values: [] }, { values: [1, 2, 3, 4] }, { values: [1] }], slow_dequeue: [{ values: [7] }, { values: [] }], slow_empty: [{ values: [3] }],
  crawl_dequeue: [{ k: 5 }, { values: ['A'], k: 0 }], crawl_full: [{ k: 0 }, { values: ['A', 'B'], k: 2 }],
  ring_enqueue: [{ pre: [] }, { pre: ['A', 'B', 'C', 'D'] }, { cap: 1, pre: ['A'] }], ring_dequeue: [{ pre: [] }, { pre: ['A', 'B', 'C', 'D'] }, { cap: 1, pre: ['A'] }],
  ring_trace: [{ cap: 1 }, { ops: [null, 'A', null, null] }, { cap: 2, ops: [1, 2, 3, 4, 5, null, null, 6] }],
  ring_grow: [{ pre: ['A', 'B', 'C', 'D'] }, { cap: 1, pre: ['A'] }], ring_empty: [{ pre: ['A'] }],
  w_tail_nomod: [{ pre: [1, 2] }, { pre: [1, 2, 3] }], w_head_nomod: [{ pre: [1] }, { pre: [1, 2, 3, null, null, null, 4, 5, 6] }],
  w_noclear: [{ pre: [] }], w_naive_grow: [{ pre: ['A', 'B', 'C', 'D'] }], w_grow_nocap: [{ pre: ['A', 'B', 'C', 'D'] }],
  full_ht: [{ pre: [] }, { pre: ['A'] }], full_oneslot: [{ pre: [] }, { pre: ['A', 'B', 'C'], cap: 5 }], w_b3: [{ cap: 1 }],
  lq_enqueue: [{ values: [] }, { values: ['X'] }], lq_dequeue: [{ values: ['A'] }, { values: [] }], w_tail_stale: [{ values: ['A', 'B', 'C'] }],
  sq_dequeue: [{ values: [] }, { values: [9] }], sq_sequence: [{ ops: [null] }, { ops: [1, null, null] }], w_pour_every: [{ n: 1 }],
  josephus: [{ k: 1 }, { names: ['A'] }, { k: 4, names: [1, 2, 3, 4, 5, 6, 7] }], binary: [{ n: 0 }, { n: 1 }, { n: 7 }],
  mavg: [{ k: 0 }, { k: 1 }, { values: [5, 1] }, { values: [] }], deque_front: [{ pre: [] }, { cap: 3, pre: ['A', 'B', 'C'] }, { pre: ['A', null, 'B'] }],
};
/* Random inputs within each parameter's spec (a seeded generator, so runs repeat). */
function randomParams(sc, rnd) {
  const p = {};
  const val = () => rnd() < 0.5 ? Math.floor(rnd() * 99) : 'ABCDEFGHJK'[Math.floor(rnd() * 10)];
  for (const k in sc.params) {
    const sp = sc.params[k];
    if (sp.type === 'int') p[k] = sp.min + Math.floor(rnd() * (sp.max - sp.min + 1));
    else if (sp.type === 'value') p[k] = val();
    else {
      const n = sp.minLen + Math.floor(rnd() * (Math.min(sp.maxLen, 9) - sp.minLen + 1));
      const ints = sp.check && sp.check(['x']) !== true;
      p[k] = range(0, n).map(() => (k === 'ops' || k === 'pre') && rnd() < 0.35 ? null : ints ? Math.floor(rnd() * 50) : val());
    }
  }
  return p;
}
function selftest() {
  const lines = [];
  let seed = 12345; const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  for (const sc of SCENARIOS) {
    const base = {}; for (const k in sc.params) base[k] = sc.params[k].def;
    const runs = [base, ...(SELFTEST_EXTRA[sc.id] || []).map(e => Object.assign({}, base, e))];
    for (let r = 0; r < 6; r++) runs.push(randomParams(sc, rnd));
    for (const p of runs) {
      try {
        let bad = '';
        for (const k in sc.params) {
          const sp = sc.params[k], v = p[k];
          if (sp.type === 'int' && !(v >= sp.min && v <= sp.max)) bad = k;
          if (sp.type === 'list' && (v.length < sp.minLen || v.length > sp.maxLen || (sp.check && sp.check(v) !== true))) bad = k;
        }
        if (!bad && sc.check && sc.check(p) !== true) bad = 'check';
        if (bad) { lines.push(JSON.stringify({ id: sc.id, params: p, skipped: bad })); continue; }
        const T = build(sc, p);
        const shell = T.out.map(o => o.k === 'err' ? o.t.split('\n').pop() : o.t);
        const qs = T.steps.filter(x => x.q);
        const nlines = sc.code.split('\n').length;
        const badLine = T.steps.some(x => x.line > nlines || x.stack.some(f => f.line > nlines || (f.fn !== '<module>' && f.line < 1)));
        const badQ = qs.some(x => x.q.answer < 0 || x.q.choices.length < 2);
        state.sc = sc; state.T = T; state.params = p; state.prevSnap = null; state.idx = 0;
        picSetup();
        for (let i = 0; i < T.steps.length; i++) { state.prevSnap = i ? T.steps[i - 1] : null; state.idx = i; render(); }
        lines.push(JSON.stringify({ id: sc.id, cls: sc.cls, params: p, steps: T.steps.length, questions: qs.length, badLine, badQ, shell, code: sc.code,
          span: [T.spanStart, T.spanEnd], counters: T.spanCounters, verify: sc.verify || [] }));
      } catch (e) { lines.push(JSON.stringify({ id: sc.id, params: p, crash: e.message + ' ' + (e.stack || '').split('\n').slice(0, 3).join(' | ') })); }
    }
  }
  const pre = $('selftest'); pre.hidden = false; pre.textContent = lines.join('\n');
}
