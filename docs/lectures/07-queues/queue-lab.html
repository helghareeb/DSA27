<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queue Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen classroom console. Code on the left; the picture of the queue's storage on the
   right, with the variables and the shell under it; transport bar along the bottom. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --panel-2: #f4f6f9;
  --ink: #142033;
  --muted: #5a6679;
  --line: #d3d9e2;
  --accent: #c76a00;        /* the running line, the link about to change: a highlighter */
  --accent-bg: #ffefcc;
  --wait: #3456c7;          /* references held in variables */
  --wait-bg: #e6ecfc;
  --done: #23803a;          /* a link that just changed */
  --done-bg: #e2f4e6;
  --err: #c92a3a;
  --err-bg: #fde4e7;
  --hit: #0b7a8a;           /* prev links in a doubly linked list */
  --hit-bg: #dcf3f6;
  --kw: #8a2bb8; --str: #237a3a; --num: #b4520b; --com: #7b8798; --fn: #1d5fd0;
  --shadow: 0 1px 2px rgba(20,32,51,.06), 0 4px 14px rgba(20,32,51,.06);
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", Consolas, "Cascadia Mono", ui-monospace, monospace;
  --code-size: clamp(13px, 1.02vw, 19px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121a; --panel: #151c27; --panel-2: #1b2431; --ink: #e5eaf2; --muted: #95a1b4; --line: #2a3546;
    --accent: #f3a43a; --accent-bg: #3b2a0e; --wait: #8ea6ff; --wait-bg: #1d2747; --done: #5fd07a; --done-bg: #15301d;
    --err: #ff7a86; --err-bg: #3d1820; --hit: #4fd2e2; --hit-bg: #123338;
    --kw: #d39bff; --str: #8ad79a; --num: #ffb86b; --com: #7d8aa0; --fn: #7fb0ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121a; --panel: #151c27; --panel-2: #1b2431; --ink: #e5eaf2; --muted: #95a1b4; --line: #2a3546;
  --accent: #f3a43a; --accent-bg: #3b2a0e; --wait: #8ea6ff; --wait-bg: #1d2747; --done: #5fd07a; --done-bg: #15301d;
  --err: #ff7a86; --err-bg: #3d1820; --hit: #4fd2e2; --hit-bg: #123338;
  --kw: #d39bff; --str: #8ad79a; --num: #ffb86b; --com: #7d8aa0; --fn: #7fb0ff;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  display: flex; flex-direction: column;
  padding-inline: 16px; padding-block: 10px;
  gap: 10px;
}
body, code, pre, .mono, svg text, input { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
code, pre, .mono { font-family: var(--f-code); }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 22px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.picker { display: flex; align-items: center; gap: 8px; flex: 1 1 320px; min-width: 0; }
.picker select {
  flex: 1 1 auto; min-width: 0; max-width: 560px;
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  font-size: 16px; font-weight: 700;
}
.top .tools { display: flex; gap: 6px; }

/* ---------- main grid ---------- */
main {
  flex: 1 1 auto; min-height: 0;
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, .56fr) minmax(0, .62fr);
  grid-template-rows: minmax(0, 1.25fr) minmax(0, .75fr);
  grid-template-areas: "code pic pic" "code vars shell";
}
.code-pane { grid-area: code; } .pic-pane { grid-area: pic; } .vars-pane { grid-area: vars; } .shell-pane { grid-area: shell; }
.pane {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
}
.pane-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.pane-head .meta { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--f-code); font-size: 12px; text-align: right; }

/* ---------- code pane ---------- */
.about { padding: 8px 14px 0; display: flex; flex-direction: column; gap: 4px; }
.about h1 { margin: 0; font-size: 20px; line-height: 1.2; text-wrap: balance; }
.about p { margin: 0; color: var(--muted); font-size: 14px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.badge.works { background: var(--done-bg); color: var(--done); }
.badge.wrong { background: var(--err-bg); color: var(--err); }
.badge.cost { background: var(--accent-bg); color: var(--accent); }
.badge.ex { background: var(--wait-bg); color: var(--wait); }

.callstrip {
  margin: 8px 14px 0; padding: 6px 10px; border-radius: 8px; background: var(--panel-2);
  font-family: var(--f-code); font-size: var(--code-size);
  display: flex; align-items: center; flex-wrap: wrap; gap: 2px;
}
.callstrip .ps { color: var(--muted); margin-right: 6px; }
.callstrip .br { flex-basis: 100%; height: 0; }
.callstrip input {
  font-family: var(--f-code); font-size: inherit; padding: 1px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--num);
  min-width: 2.5ch; max-width: 100%; field-sizing: content;
}
.callstrip input.bad { border-color: var(--err); background: var(--err-bg); }
.callstrip .run { margin-left: auto; }
.callerr { margin: 4px 14px 0; color: var(--err); font-size: 13px; min-height: 0; }

.code {
  margin: 8px 14px; padding: 6px 0; border-radius: 8px; border: 1px solid var(--line);
  font-family: var(--f-code); font-size: var(--code-size); line-height: 1.45;
  overflow: auto; flex: 0 1 auto; min-height: 110px;
}
.ln { display: flex; align-items: center; min-width: max-content; padding-right: 10px; position: relative; }
.ln .no { width: 3ch; text-align: right; color: var(--com); padding-right: 12px; flex: 0 0 auto; user-select: none; }
.ln .src { white-space: pre; flex: 0 0 auto; }
.ln .tags { display: flex; gap: 4px; margin-left: 14px; flex: 0 0 auto; }
.ln .tag { font-family: var(--f-body); font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 999px; line-height: 1.6; }
.ln .tag.w { background: var(--wait-bg); color: var(--wait); }
.ln .tag.a { background: var(--accent); color: var(--panel); }
.ln .tag.r { background: var(--done); color: var(--panel); }
.ln .tag.e { background: var(--err); color: var(--panel); }
.ln.cur { background: var(--accent-bg); box-shadow: inset 4px 0 0 var(--accent); }
.ln.ret { background: var(--done-bg); box-shadow: inset 4px 0 0 var(--done); }
.ln.errl { background: var(--err-bg); box-shadow: inset 4px 0 0 var(--err); }
.ln.waitl { box-shadow: inset 4px 0 0 var(--wait); }
.ln.bug .no { color: var(--err); font-weight: 700; }
.t-kw { color: var(--kw); font-weight: 600; } .t-str { color: var(--str); } .t-num { color: var(--num); }
.t-com { color: var(--com); font-style: italic; } .t-fn { color: var(--fn); font-weight: 700; } .t-bi { color: var(--fn); }

.narr { margin: 0 14px 12px; flex: 1 0 100px; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.say { font-size: clamp(15px, 1.15vw, 21px); line-height: 1.45; max-width: 62ch; }
.say code, .qtext code, .choice code, .why code { font-size: .92em; background: var(--panel-2); padding: 0 4px; border-radius: 4px; }
.say.err { color: var(--err); }
.narr:has(.qcard) .say { font-size: clamp(14px, 1.0vw, 18px); }
.narr:has(.qcard) { flex-basis: 52%; }

/* question card */
.qcard { border: 2px solid var(--accent); border-radius: 10px; padding: 12px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 10px; }
.qlabel { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.qtext { font-size: clamp(16px, 1.3vw, 23px); font-weight: 700; line-height: 1.35; text-wrap: balance; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.choice {
  display: flex; gap: 10px; align-items: flex-start; text-align: left;
  padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer;
  font-size: clamp(14px, 1.0vw, 18px); line-height: 1.3;
}
.choice:hover { border-color: var(--accent); }
.choice .k { font-family: var(--f-code); font-weight: 700; color: var(--accent); flex: 0 0 auto; }
.choice.right { border-color: var(--done); background: var(--done-bg); }
.choice.wrong { border-color: var(--err); background: var(--err-bg); }
.choice[disabled] { cursor: default; }
.why { font-size: clamp(14px, 1.05vw, 19px); line-height: 1.45; padding: 8px 12px; border-radius: 8px; background: var(--panel-2); }
.why b { color: var(--done); }
.qactions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- references pane ---------- */
.varwrap { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.frame {
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--panel);
  display: flex; flex-direction: column; gap: 4px;
}
.frame .fh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.frame .fname { font-family: var(--f-code); font-weight: 700; font-size: clamp(13px, .95vw, 17px); overflow-wrap: anywhere; }
.frame .chip { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.frame .locals { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 10px; row-gap: 1px; font-family: var(--f-code); font-size: clamp(13px, .92vw, 16px); }
.frame .locals .k { color: var(--muted); }
.frame .locals .v { overflow-wrap: anywhere; }
.frame .locals .tmp { font-style: italic; }
.frame .locals .ref { color: var(--wait); font-weight: 600; }
.frame .locals .chg { background: var(--done-bg); border-radius: 4px; }
.frame .fnote { font-size: 13px; color: var(--muted); }
.frame.obj { border-color: var(--ink); border-width: 1.5px; }
.frame.obj .chip { background: var(--panel-2); color: var(--muted); }
.frame.active { border-color: var(--accent); background: var(--accent-bg); box-shadow: 0 0 0 1px var(--accent); }
.frame.active .chip { background: var(--accent); color: var(--panel); }
.frame.waiting { border-color: var(--wait); }
.frame.waiting .chip { background: var(--wait-bg); color: var(--wait); }
.frame.returning { border-color: var(--done); background: var(--done-bg); box-shadow: 0 0 0 1px var(--done); }
.frame.returning .chip { background: var(--done); color: var(--panel); }
.frame.error { border-color: var(--err); background: var(--err-bg); }
.frame.error .chip { background: var(--err); color: var(--panel); }
.frame.module { background: var(--panel-2); border-style: dashed; }
.frame.module .chip { background: var(--line); color: var(--muted); }
.frame.new { animation: push .32s ease-out; }
@keyframes push { from { transform: translateY(-10px); opacity: .2; } to { transform: none; opacity: 1; } }
.varfoot { padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

/* ---------- picture pane ---------- */
.views { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.picbox { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: safe center; overflow-x: auto; }
.picbox svg { display: block; max-width: 100%; max-height: 100%; width: 100%; height: auto; }
svg text { font-family: var(--f-code); }
.nd { transition: transform .38s ease, opacity .38s ease; }
.nd rect.box { fill: var(--panel-2); stroke: var(--ink); stroke-width: 1.6; }
.nd line.div { stroke: var(--ink); stroke-width: 1.2; }
.nd text.v { fill: var(--ink); font-size: 17px; font-weight: 700; }
.nd line.none { stroke: var(--muted); stroke-width: 1.4; }
.nd circle.dot { fill: var(--ink); }
.nd circle.dot.p { fill: var(--hit); }
.nd.ref rect.box { stroke: var(--wait); stroke-width: 2.4; fill: var(--wait-bg); }
.nd.focus rect.box { stroke: var(--accent); stroke-width: 3; fill: var(--accent-bg); }
.nd.fresh rect.box { stroke: var(--done); stroke-width: 2.6; }
.nd.sent rect.box { fill: var(--line); stroke-dasharray: 5 3; }
.nd.sent text.v { fill: var(--muted); font-size: 12px; font-weight: 400; }
.nd.garbage { opacity: .38; }
.nd.garbage rect.box { stroke-dasharray: 4 3; }
.nd text.gone { fill: var(--err); font-size: 11px; font-weight: 700; font-family: var(--f-body); }
.nd.born { animation: pop .34s ease-out; }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
.ar { fill: none; stroke: var(--ink); stroke-width: 1.8; transition: d .38s ease, opacity .3s; }
.ar.p { stroke: var(--hit); }
.ar.hot { stroke: var(--accent); stroke-width: 3.2; stroke-dasharray: 7 4; }
.ar.chg { stroke: var(--done); stroke-width: 3.2; }
.ar.garbage { opacity: .3; }
.tg { transition: transform .38s ease, opacity .3s; }
.tg rect { fill: var(--wait-bg); stroke: var(--wait); stroke-width: 1.2; }
.tg text { fill: var(--wait); font-size: 12.5px; font-weight: 700; }
.tg line { stroke: var(--wait); stroke-width: 1.4; }
.tg.self rect { fill: var(--ink); stroke: var(--ink); }
.tg.self text { fill: var(--panel); }
.tg.self line { stroke: var(--ink); }
.tg.tmp rect { fill: var(--panel); stroke-dasharray: 3 2; }
.tg.tmp text { font-style: italic; }
.tg.hot rect { fill: var(--accent); stroke: var(--accent); }
.tg.hot text { fill: var(--panel); }
.tg.hot line { stroke: var(--accent); stroke-width: 2.4; }
.tg.chg rect { fill: var(--done); stroke: var(--done); }
.tg.chg text { fill: var(--panel); }
.tg.isnone rect { fill: var(--panel); stroke: var(--muted); stroke-dasharray: 3 2; }
.tg.isnone text { fill: var(--muted); }
.tg.isnone line { stroke: var(--muted); }
.nonemark text { fill: var(--muted); font-size: 13px; }
/* array blocks, the ring, the stacks */
.blabel { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; font-family: var(--f-body); }
.blabel.old { fill: var(--err); }
.cl, .rs { transition: transform .38s ease, opacity .3s; }
.cl rect.bx, .rs path.bx { fill: transparent; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 3; transition: fill .25s, stroke .25s; }
.cl text.v, .rs text.v { fill: var(--ink); font-size: 15px; font-weight: 700; }
.cl text.ix, .rs text.ix { fill: var(--muted); font-size: 11px; }
.cl.live rect.bx, .rs.live path.bx { fill: var(--wait-bg); stroke: var(--wait); stroke-dasharray: none; }
.cl.stale text.v, .rs.stale text.v { fill: var(--err); }
.cl.stale rect.bx, .rs.stale path.bx { stroke: var(--err); }
.cl.dead rect.bx { fill: var(--line); stroke: var(--muted); }
.cl.dead text.v { fill: var(--muted); font-size: 11px; font-weight: 400; font-style: italic; }
.cl.rd rect.bx, .rs.rd path.bx { fill: var(--hit-bg); stroke: var(--hit); stroke-width: 3; stroke-dasharray: none; }
.cl.wr rect.bx, .rs.wr path.bx { fill: var(--done-bg); stroke: var(--done); stroke-width: 3; stroke-dasharray: none; }
.cl.clr rect.bx, .rs.clr path.bx { stroke: var(--done); stroke-width: 3; }
.cl.old { opacity: .55; }
.cl.oob rect.bx { fill: var(--err-bg); stroke: var(--err); stroke-width: 2.5; }
.cl.oob text { fill: var(--err); font-weight: 700; }
.cl.ghost { opacity: .45; }
.cl.ghost rect.bx { stroke: var(--muted); }
.cl.born { animation: pop .34s ease-out; }
.mv { fill: none; stroke: var(--done); stroke-width: 2.2; }
.szm line { stroke: var(--accent); stroke-width: 3; }
.szm text { fill: var(--accent); font-size: 11px; font-weight: 700; }
.szm { transition: transform .38s ease; }
.hand { stroke: var(--wait); stroke-width: 2.4; transition: x2 .38s ease, y2 .38s ease; }
.hand.tl { stroke: var(--accent); stroke-dasharray: 6 4; }
.tg.tl rect { fill: var(--accent-bg); stroke: var(--accent); }
.tg.tl text { fill: var(--accent); }
.tg.tl line { stroke: var(--accent); }
.rcount { fill: var(--muted); font-size: 13px; font-weight: 700; }
.sbase { fill: none; stroke: var(--muted); stroke-width: 2; }
.nd.outq rect.box { stroke: var(--err); stroke-dasharray: 5 3; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 18px; height: 0; display: inline-block; border-top: 3px solid; }
.legend i.box { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; }

.out { margin: 0; padding: 8px 12px; overflow: auto; font-size: clamp(13px, .92vw, 16px); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; flex: 1 1 auto; }
.out .prompt { color: var(--muted); } .out .ret { color: var(--done); font-weight: 700; } .out .err { color: var(--err); } .out .print { color: var(--ink); }
.out .ret.new, .out .err.new { background: var(--accent-bg); }

/* ---------- transport ---------- */
.transport {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow);
}
.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
  font-weight: 700; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.on { background: var(--wait-bg); border-color: var(--wait); color: var(--wait); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn kbd { font-family: var(--f-code); font-size: 11px; font-weight: 400; opacity: .75; }
.group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.scrub { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; min-width: 160px; }
.scrub input { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
.scrub .pos { font-family: var(--f-code); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-family: var(--f-code); font-size: 15px; font-variant-numeric: tabular-nums; }
.speed { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.speed input { width: 90px; accent-color: var(--accent); }
.nudge { color: var(--err); font-size: 13px; font-weight: 700; }

@media (max-width: 1150px) {
  html, body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "pic pic" "code vars" "code shell"; }
  .pic-pane { min-height: 340px; }
  .code-pane { min-height: 620px; }
  .vars-pane, .shell-pane { max-height: 420px; }
  .transport { position: sticky; bottom: 0; z-index: 2; }
}
@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "code" "pic" "vars" "shell"; }
  .code-pane { min-height: 0; }
  .pic-pane { min-height: 260px; }
  .narr { flex-basis: auto; }
  .vars-pane, .shell-pane { max-height: 60vh; }
}
@media (prefers-reduced-motion: reduce) {
  .frame.new, .nd.born { animation: none; }
  .nd, .ar, .tg, .cl, .rs, .szm, .hand { transition: none; }

<script>
/* =====================================================================
   ENGINE. Every scenario is a JavaScript mirror of the Python shown on
   screen. It runs once, and the Tracer records a snapshot at every step,
   so Back and the scrubber are just an index into that list.
   Objects (the queue, its DynamicArray, its stacks) are records of fields.
   Blocks are course Arrays; every slot read or written goes through
   T.rd / T.wr, which check the index exactly as dsa/array.py does.
   Nodes (the linked queue) live on a heap; a reference to node 3 is {n: 3}.
   ===================================================================== */

class PyErr extends Error {
  constructor(type, msg, extra) { super(msg); this.type = type; this.extra = extra || {}; }
}

const SELF = { self: true };
const R = id => (id === null || id === undefined ? null : { n: id });       // a reference to node id
const BLK = key => ({ blk: key });                                          // a reference to an Array block
const OBJ = key => ({ obj: key });                                          // a reference to an object
const FL = x => ({ f: x });                                                 // a Python float
const idOf = v => (v && v.n !== undefined ? v.n : null);
const isRef = v => !!(v && v.n !== undefined);

function pyrepr(v) {
  if (v === null || v === undefined) return 'None';
  if (typeof v === 'string') return "'" + v.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
  if (typeof v === 'boolean') return v ? 'True' : 'False';
  if (Array.isArray(v)) return '[' + v.map(pyrepr).join(', ') + ']';
  if (v && v.f !== undefined) return Number.isInteger(v.f) ? v.f + '.0' : String(v.f);
  if (v && v.self) return 'self';
  if (v && v.raw !== undefined) return v.raw;
  if (v && v.blk) return 'Array';
  if (v && v.obj) return v.obj;
  return String(v);
}
const C = v => '`' + pyrepr(v) + '`';           // a value, as code, in a message
const clip = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const plural = (k, w) => k + ' ' + w + (k === 1 ? '' : 's');
const mod = (a, n) => ((a % n) + n) % n;        // Python's %, for a positive n
const range = (a, b) => { const r = []; for (let i = a; i < b; i++) r.push(i); return r; };
const arrRepr = cells => 'Array([' + cells.map(pyrepr).join(', ') + '])';

/* The exact message dsa/array.py raises for a bad index. */
const arrayMsg = (i, n) => `Array index ${i} out of range for length ${n} (valid: 0..${n - 1}; no negative indices)`;

class Tracer {
  constructor(sc, p) {
    this.sc = sc; this.p = p;
    this.codeLines = sc.code.split('\n');
    this.steps = []; this.ids = 0;
    this.out = [];
    this.counters = { writes: 0, shifts: 0, moves: 0, ops: 0 };
    this.objs = [];                        // { key, cls, fields: [[name, value]] }
    this.blocks = {}; this.order = [];     // course Arrays: key -> { cells, label, old }
    this.heap = [];                        // nodes: { id, v, next }
    this.stacks = null;                    // { inbox: [...], outbox: [...] } bottom to top
    this.lptrs = [];                       // pointers set by the mirror: { b, i, l, a }
    this.flash = []; this.arrows = [];
    this.stack = [{ id: 0, fn: '<module>', label: '<module>', line: 0, locals: [], status: 'active', note: '' }];
    this.lastX = {}; this.freeX = {}; this.prevLinks = null;
    this.oob = null;
  }
  get top() { return this.stack[this.stack.length - 1]; }
  get depth() { return this.stack.length - 1; }
  get mod() { return this.stack[0]; }

  /* ---- objects ---- */
  obj(key, cls, fields, at) {
    const o = { key, cls, fields: fields.map(f => [f[0], f[1]]) };
    const k = this.objs.findIndex(x => x.key === key);
    if (k >= 0) this.objs[k] = o; else if (at !== undefined) this.objs.splice(at, 0, o); else this.objs.push(o);
    return o;
  }
  O(key) { return this.objs.find(o => o.key === key); }
  g(key, name) { const e = this.O(key).fields.find(x => x[0] === name); return e ? e[1] : undefined; }
  s(key, name, v) {
    const f = this.O(key).fields, e = f.find(x => x[0] === name);
    if (e) e[1] = v; else f.push([name, v]);
  }

  /* ---- Array blocks ---- */
  block(key, cells, opt) {
    opt = opt || {};
    this.blocks[key] = { cells: cells.slice(), label: opt.label || key, old: false };
    if (!this.order.includes(key)) this.order.push(key);
    return this.blocks[key];
  }
  drop(key) { delete this.blocks[key]; this.order = this.order.filter(k => k !== key); }
  B(key) { return this.blocks[key]; }
  check(key, i) {
    const n = this.B(key).cells.length;
    if (!(Number.isInteger(i) && i >= 0 && i < n)) {
      this.oob = { b: key, i };
      throw new PyErr('IndexError', arrayMsg(i, n), { arr: true });
    }
  }
  rd(key, i) {
    this.check(key, i);
    this.flash.push({ b: key, i, k: 'rd' });
    return this.B(key).cells[i];
  }
  wr(key, i, v, from) {
    this.check(key, i);
    this.counters.writes++;
    this.flash = this.flash.filter(f => !(f.b === key && f.i === i));
    this.flash.push({ b: key, i, k: v === null ? 'clr' : 'wr' });
    if (from) this.arrows.push({ b: key, from: from.i, fb: from.b || key, to: i });
    this.B(key).cells[i] = v;
  }
  ptr(list) { this.lptrs = list.map(p => ({ b: p[0], i: p[1], l: p[2], a: !!p[3] })); }

  /* ---- nodes ---- */
  newNode(v, next) { const nd = { id: this.heap.length, v, next: next === undefined ? null : next }; this.heap.push(nd); return nd.id; }
  nm(id) { return id === null ? '`None`' : '`Node(' + pyrepr(this.heap[id].v) + ')`'; }

  /* ---- frames ---- */
  set(name, val, frame) {
    const L = (frame || this.top).locals, e = L.find(x => x[0] === name);
    if (e) e[1] = val; else L.push([name, val]);
  }
  get(name) { const e = this.top.locals.find(x => x[0] === name); return e ? e[1] : undefined; }
  unset(name, frame) { const f = frame || this.top; f.locals = f.locals.filter(x => x[0] !== name); }

  /* where each node is drawn (the linked queue): the chain from head on row 0 */
  layout() {
    const H = this.heap; if (!H.length) return { chain: [], pos: {}, garbage: [] };
    const q = this.objs[0], head = idOf((q.fields.find(f => f[0] === 'head') || [])[1]);
    const chain = [], seen = new Set();
    for (let id = head; id !== null && !seen.has(id); id = H[id].next) { seen.add(id); chain.push(id); }
    const alive = new Set(), todo = [];
    const root = v => { const id = idOf(v); if (id !== null) todo.push(id); };
    q.fields.forEach(f => root(f[1]));
    this.stack.forEach(f => f.locals.forEach(l => root(l[1])));
    while (todo.length) { const id = todo.pop(); if (alive.has(id)) continue; alive.add(id); if (H[id].next !== null) todo.push(H[id].next); }
    const pos = {}, idx = new Map(chain.map((id, i) => [id, i]));
    chain.forEach((id, i) => { pos[id] = { x: i, row: 0 }; this.lastX[id] = i; });
    const taken = new Set();
    for (const nd of H) {
      if (idx.has(nd.id)) continue;
      let x = nd.id in this.lastX ? this.lastX[nd.id] : (nd.id in this.freeX ? this.freeX[nd.id] : chain.length);
      while (taken.has(x)) x++;                    // two nodes off the chain never share a place
      taken.add(x); this.freeX[nd.id] = x;
      pos[nd.id] = { x, row: 1 };
    }
    const garbage = H.filter(nd => !alive.has(nd.id)).map(nd => nd.id);
    return { chain, pos, garbage };
  }
  links() {
    const L = {};
    for (const nd of this.heap) L['n' + nd.id] = nd.next;
    if (this.objs[0]) for (const [k, v] of this.objs[0].fields) if (isRef(v) || v === null) L['f' + k] = idOf(v);
    return L;
  }

  snap(msg, opt) {
    opt = opt || {};
    if (this.steps.length > 3000) throw new Error('too many steps');
    const view = VIEWS[this.sc.kind] ? VIEWS[this.sc.kind](this) : {};
    const lay = this.heap.length ? this.layout() : null, chg = [];
    if (lay) {
      const links = this.links();
      if (this.prevLinks) for (const k in links) if (k in this.prevLinks && this.prevLinks[k] !== links[k]) chg.push(k);
      this.prevLinks = links;
    }
    this.steps.push(structuredClone({
      line: this.top.line, stack: this.stack, depth: this.depth, out: this.out, counters: this.counters,
      objs: this.objs, blocks: this.blocks, order: this.order, heap: this.heap, stacks: this.stacks,
      ptrs: (view.ptrs || []).concat(this.lptrs), ring: view.ring || null, live: view.live || {}, dead: view.dead || {}, sizemark: view.size || null, flash: this.flash, arrows: this.arrows,
      oob: this.oob, lay, chg, hot: opt.hot || [], focus: opt.focus === undefined ? null : opt.focus, sflash: opt.sflash || null,
      msg, kind: opt.kind || '', q: null, loop: opt.loop || null
    }));
    this.flash = []; this.arrows = [];
    if (opt.kind !== 'err') this.oob = null;
  }
  at(line, msg, opt) { const f = this.top; f.line = line; f.status = 'active'; this.snap(msg, opt); }

  /* A question about what happens NEXT, shown on the step just recorded. */
  ask(text, correct, distractors, why) {
    const seen = new Set([String(correct)]), opts = [String(correct)];
    for (const d of distractors) { const s = String(d); if (!seen.has(s) && opts.length < 4) { seen.add(s); opts.push(s); } }
    let h = 0; for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const order = opts.map((o, i) => [o, (h ^ (i * 2654435761)) >>> 0 ^ (i * 7919)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
    this.steps[this.steps.length - 1].q = { text, choices: order, answer: order.indexOf(String(correct)), why };
  }

  call(fn, args, label, msg, line) {
    const caller = this.top;
    caller.status = 'waiting';
    caller.note = 'waiting for ' + label;
    const f = { id: ++this.ids, fn, label, line: line || 1, locals: args.map(a => [a[0], a[1]]), status: 'active', note: '' };
    this.stack.push(f);
    this.snap(msg || `Call \`${label}\`. Python makes a new frame for it, with its own local variables.`);
    return f;
  }

  ret(val, line, msg, opt) {
    opt = opt || {};
    const f = this.top;
    f.line = line; f.status = 'returning'; f.ret = val;
    this.snap(msg || `Return ${C(val)}.`);
    this.stack.pop();
    const c = this.top;
    c.status = 'active';
    const none = val === null || val === undefined;
    if (c.fn === '<module>') {
      if (!none && !this.noEcho) this.out.push({ k: 'ret', t: pyrepr(val), fresh: true });
      c.note = none ? `${f.label} finished` : 'result: ' + pyrepr(val);
      if (!opt.quiet) this.snap(`\`${f.label}\` is finished and its frame is gone.` + (none ? ' It returned None, so the shell prints nothing.' : this.noEcho ? ` It returned ${C(val)}; inside a \`for\` loop the shell prints nothing.` : ` The shell prints the result, ${C(val)}.`));
    } else {
      c.note = none ? `${f.label} finished` : `${f.label} returned ${pyrepr(val)}`;
      if (!opt.quiet) this.snap(`\`${f.label}\` is finished. \`${c.label}\` carries on from line ${c.line}.`);
    }
    return val;
  }

  /* An exception: every frame on the stack is abandoned. */
  raise(e) {
    const frames = this.stack.slice(1);
    for (const f of frames) f.status = 'error';
    if (frames.length) this.top.note = `${e.type}: ${e.message}`;
    const tb = ['Traceback (most recent call last):', '  File "<stdin>", line 1, in <module>'];
    for (const f of frames) tb.push(`  File "lab.py", line ${f.line}, in ${f.fn}\n    ${(this.codeLines[f.line - 1] || '').trim()}`);
    if (e.extra.arr) tb.push('  File "dsa/array.py", line 63, in _check', '    raise IndexError(');
    tb.push(`${e.type}: ${e.message}`);
    this.out.push({ k: 'err', t: tb.join('\n'), fresh: true });
    this.snap(`**${e.type}: ${e.message}.** ${e.extra.why || ''}`, { kind: 'err' });
    this.stack = [this.stack[0]];
    this.stack[0].status = 'error';
    this.stack[0].note = `${e.type}: no result`;
    this.stack[0].line = 0;
  }

  /* A line typed at the shell. */
  prompt(text) { this.out.push({ k: 'prompt', t: '>>> ' + text }); }
  result(v) { if (v !== null && v !== undefined) this.out.push({ k: 'ret', t: pyrepr(v), fresh: true }); }
  /* Run one shell line that is not traced line by line: fn does the work. */
  line(text, fn) {
    this.prompt(text);
    const n = this.out.length, loop = /^for /.test(text), was = this.noEcho;
    if (loop) this.noEcho = true;
    try { const v = fn(); if (this.out.length === n && !loop) this.result(v); return true; }
    catch (e) {
      if (!(e instanceof PyErr)) throw e;
      this.stack = [this.stack[0]]; this.stack[0].status = 'active'; this.lptrs = [];
      this.out.push({ k: 'err', t: `Traceback (most recent call last):\n  ...\n${e.type}: ${e.message}`, fresh: true });
      return false;
    }
    finally { this.noEcho = was; }
  }
}

/* ---------------------------------------------------------------------
   Views: what the picture shows for each kind of queue, computed from the
   object's fields at every snapshot.
   --------------------------------------------------------------------- */
const blockOf = (T, key, field) => { const v = T.g(key, field || '_block'); return v && v.blk; };
const VIEWS = {
  /* SlowQueue: q._items is a DynamicArray; its block holds the queue from slot 0 */
  slow: T => {
    const n = T.g('items', '_size'), b = blockOf(T, 'items');
    const ptrs = [[b, 0, 'front'], n > 0 ? [b, n - 1, 'back'] : null].filter(Boolean);
    return { ptrs: n ? ptrs.map(p => ({ b: p[0], i: p[1], l: p[2] })) : [], size: { b, n }, live: { [b]: range(0, n) } };
  },
  crawl: T => {
    const b = blockOf(T, 'q'), h = T.g('q', '_head'), e = T.g('q', '_end');
    return { ptrs: [{ b, i: h, l: '_head' }, { b, i: e, l: '_end', t: true }], live: { [b]: range(h, e) }, dead: { [b]: range(0, h) } };
  },
  ring: T => {
    const q = T.objs[0];
    if (!q) return {};
    const b = blockOf(T, q.key);
    if (!b || !T.B(b)) return {};
    const cap = T.g(q.key, '_capacity'), head = T.g(q.key, '_head');
    const size = T.g(q.key, '_size');
    const stored = size === undefined;              // HeadTailRing: the tail is a field
    const tail = stored ? T.g(q.key, '_tail') : (cap > 0 ? mod(head + size, cap) : 0);
    const n = stored ? mod(tail - head, cap) : size;
    const ptrs = [{ b, i: head, l: 'head' }, { b, i: tail, l: stored ? 'tail' : 'tail = (head + size) % cap', t: true }];
    return { ptrs, ring: { b, cap, head, tail, size: n, stored, len: T.B(b).cells.length }, live: { [b]: range(0, n).map(o => mod(head + o, cap)) } };
  },
};

/* ---------------------------------------------------------------------
   Scenarios. `code` is exactly what students see. The mirror calls
   T.at(line, ...) with the line numbers of that code. `strip` is the
   editable shell input: plain text, parameter names, and '\n' between
   shell lines. sc.lines(p), when given, makes the shell lines instead.
   --------------------------------------------------------------------- */
const SCENARIOS = [];
const def = sc => SCENARIOS.push(sc);
const GROUPS = {
  slow: 'The obvious designs: SlowQueue, and idea 1',
  ring: 'CircularQueue: the ring buffer',
  full: 'Full or empty?',
  linked: 'Linked queue and two stacks',
  apps: 'Queues at work',
  wrong: 'Goes wrong',
};
const BADGES = {
  course: 'dsa/queue.py: exercise solution',
  practice: 'practice/week07.py: solution',
  demo: 'Written for this demo: not in dsa/',
  bug: 'A buggy version, on purpose',
};

/* Parameter specs and checks. */
const isSmall = x => (typeof x === 'number' && Number.isInteger(x) && Math.abs(x) < 1000) || (typeof x === 'string' && x.length >= 1 && x.length <= 3);
const valList = (def, min, max) => ({ type: 'list', def, minLen: min === undefined ? 0 : min, maxLen: max || 8,
  check: v => v.every(isSmall) || 'Use whole numbers below 1000, or strings of 1 to 3 characters.' });
const intP = (def, min, max) => ({ type: 'int', def, min, max });
const valP = def => ({ type: 'value', def });
const opsP = (def, max) => ({ type: 'list', def, minLen: 1, maxLen: max || 12,
  check: v => v.every(x => x === null || isSmall(x)) || 'Each op is a value to enqueue, or None to dequeue.' });

/* ---- helpers shared by the scenarios ---------------------------------- */

/* The line of `def name(` in the code shown (the n-th one, from 1). */
Tracer.prototype.fn = function (name, nth) {
  let k = 0;
  for (let i = 0; i < this.codeLines.length; i++) if (this.codeLines[i].startsWith(`def ${name}(`) && ++k === (nth || 1)) return i + 1;
  if (this.quiet) return 0;
  throw new Error('no def ' + name);
};
/* Run fn without recording steps: setup lines, and whole operations in a sequence. */
Tracer.prototype.quietly = function (fn) {
  const was = this.quiet; this.quiet = true;
  try { return fn(); } finally { this.quiet = was; }
};
const _snap = Tracer.prototype.snap, _ask = Tracer.prototype.ask;
Tracer.prototype.snap = function (msg, opt) { if (!this.quiet) _snap.call(this, msg, opt); };
Tracer.prototype.ask = function (...a) { if (!this.quiet) _ask.apply(this, a); };
const _ret = Tracer.prototype.ret;
Tracer.prototype.ret = function (val, line, msg, opt) { const r = _ret.call(this, val, line, msg, opt); if (this.depth === 0) this.lptrs = []; return r; };
/* One shell line, run whole: the steps inside are not shown, one step after. */
Tracer.prototype.op = function (text, fn, msg, opt) {
  this.prompt(text);
  let v, err = null;
  const n = this.out.length;
  try { v = this.quietly(fn); if (this.out.length === n) this.result(v); }
  catch (e) {
    if (!(e instanceof PyErr)) throw e;
    err = e;
    this.stack = [this.stack[0]]; this.stack[0].status = 'active';
    this.out.push({ k: 'err', t: `Traceback (most recent call last):\n  ...\n${e.type}: ${e.message}`, fresh: true });
  }
  this.lptrs = [];
  this.snap(typeof msg === 'function' ? msg(v, err) : msg, Object.assign({ kind: err ? 'err' : '' }, opt || {}));
  return err ? undefined : v;
};
Tracer.prototype.uid = function (p) { this._u = (this._u || 0) + 1; return p + this._u; };

/* ---- DynamicArray: the course code, under SlowQueue ------------------- */

/* The state DynamicArray(values) is in: capacity 1, doubled whenever full. */
function makeDA(T, key, values, label) {
  let cap = 1, resizes = 0;
  for (let n = 1; n <= values.length; n++) if (n - 1 === cap) { cap *= 2; resizes++; }
  const cells = Array(cap).fill(null);
  values.forEach((v, i) => { cells[i] = v; });
  T.block(key, cells, { label });
  T.obj(key, 'DynamicArray', [['_size', values.length], ['_capacity', cap], ['_block', BLK(key)], ['growth', 2], ['resize_count', resizes]]);
}
const daVals = (T, key) => { const b = T.B(T.g(key, '_block').blk); return b.cells.slice(0, T.g(key, '_size')); };

function daAppend(T, key, value) {
  const o = T.fn('append');
  T.call('append', [['self', OBJ(key)], ['value', value]], `_items.append(${pyrepr(value)})`, null, o);
  const size = T.g(key, '_size'), cap = T.g(key, '_capacity');

function daResize(T, key, capacity) {
  const o = T.fn('_resize');
  T.call('_resize', [['self', OBJ(key)], ['capacity', capacity]], `_resize(${capacity})`, null, o);
  const nb = T.uid('blk');
  T.block(nb, Array(capacity).fill(null), { label: 'block (new)' });
  T.set('block', BLK(nb));
  T.at(o + 1, `\`make_block(${capacity})\`: a fresh Array of ${capacity} empty slots.`);
  const ob = T.g(key, '_block').blk, size = T.g(key, '_size');

    T.set('i', i); T.ptr([[ob, i, 'i'], [nb, i, 'i', true]]);
    T.at(o + 2, `Loop: \`i\` is ${i}.`, { loop: 'copy' });
    T.wr(nb, i, T.rd(ob, i), { b: ob, i });
    T.at(o + 3, `Copy slot ${i} into the new block.`, { loop: 'copy' });
  }
  T.ptr([]);
  T.s(key, '_block', BLK(nb)); T.B(ob).old = true; T.B(nb).label = '_block';
  T.at(o + 4, 'Switch: `self._block` now refers to the new block. Nothing refers to the old one, so Python frees it.');
  T.drop(ob);
  T.s(key, '_capacity', capacity);
  T.at(o + 5, `\`_capacity\` becomes ${capacity}.`);
  T.s(key, 'resize_count', T.g(key, 'resize_count') + 1);
  T.at(o + 6, `\`resize_count\` goes up to ${T.g(key, 'resize_count')}.`);
  T.unset('block');
  return T.ret(null, o + 6, '_resize returns None.');
}

function daPop0(T, key) {
  const o = T.fn('pop');

  const size = T.g(key, '_size'), b = T.g(key, '_block').blk;
  T.at(o + 1, `Is the array empty? \`_size\` is ${size}: no.`);
  T.at(o + 3, 'Is `index < 0`? No, it is 0.');
  T.at(o + 5, `Is \`0 <= 0 < ${size}\`? Yes.`);
  const value = T.rd(b, 0);
  T.set('value', value);
  T.at(o + 7, `Keep the value in slot 0, ${C(value)}: it is the front of the queue, and it will be returned.`);
  if (size >= 2) T.ask(`To close the gap at slot 0, how many values must move one slot to the left?`, size - 1, [1, 0, size],
    `Every value after slot 0 moves: slots 1 to ${size - 1}, that is ${size - 1}. A queue twice as long shifts twice as many: O(n) per dequeue.`);
  for (let i = 0; i < size - 1; i++) {
    T.set('i', i); T.ptr([[b, i, 'i', true]]);
    T.at(o + 8, `Loop: \`i\` is ${i}, from \`range(0, ${size - 1})\`.`, { loop: 'shift' });
    T.wr(b, i, T.rd(b, i + 1), { i: i + 1 });
    T.counters.shifts++;
    T.at(o + 9, `\`self._block[${i}] = self._block[${i + 1}]\`: ${C(T.B(b).cells[i])} moves one slot left.`, { loop: 'shift' });
  }
  T.ptr([]);
  T.s(key, '_size', size - 1);
  T.at(o + 10, `\`_size\` becomes ${size - 1}.`);
  T.wr(b, size - 1, null);
  T.at(o + 11, `Clear slot ${size - 1}, which now holds a copy of the last value, so the block keeps no stray reference.`);
  return T.ret(value, o + 12, `Return ${C(value)}.`, { quiet: false });
}

/* ---- SlowQueue --------------------------------------------------------- */
const SLOW_ENQ = `# SlowQueue (dsa/queue.py)
def enqueue(self, value):
    self._items.append(value)

# DynamicArray (dsa/dynamic_array.py)
def append(self, value):
    if self._size == self._capacity:
        self._resize(self._capacity * self.growth)
    self._block[self._size] = value
    self._size += 1

def _resize(self, capacity):
    block = make_block(capacity)
    for i in range(self._size):
        block[i] = self._block[i]
    self._block = block
    self._capacity = capacity
    self.resize_count += 1`;
const SLOW_DEQ = `# SlowQueue (dsa/queue.py)
def dequeue(self):
    if len(self._items) == 0:
        raise IndexError("dequeue from empty queue")
    return self._items.pop(0)

# DynamicArray (dsa/dynamic_array.py)
def pop(self, index=-1):
    if self._size == 0:
        raise IndexError("pop from empty DynamicArray")
    if index < 0:
        index += self._size
    if not 0 <= index < self._size:
        raise IndexError("index out of range")
    value = self._block[index]
    for i in range(index, self._size - 1):
        self._block[i] = self._block[i + 1]
    self._size -= 1
    self._block[self._size] = None
    return value`;

function setupSlow(T, values) {
  T.obj('q', 'SlowQueue', [['_items', OBJ('items')]]);

}

  T.at(o + 1, 'SlowQueue hands the job to its DynamicArray: the back of the queue is the END of the array.');
  daAppend(T, 'items', value);
  return T.ret(null, o + 1, 'enqueue returns None.');
}
function slowDequeue(T) {

  if (n === 0) T.ask('The queue is empty. Which error will the shell show?', 'IndexError: dequeue from empty queue', ['IndexError: pop from empty DynamicArray', 'None: dequeue returns None', 'IndexError: index out of range'],
    'SlowQueue checks first, on line 3, so `pop(0)` is never called and its own message never appears. The queue speaks the language of queues.');

const CRAWL = `def enqueue(self, value):
    if self._end == len(self._block):
        raise IndexError("no room at the end")
    self._block[self._end] = value
    self._end += 1

def dequeue(self):
    if self._head == self._end:
        raise IndexError("dequeue from empty queue")
    value = self._block[self._head]
    self._block[self._head] = None
    self._head += 1             # nothing shifts: the front moves
    return value`;
function crawlEnqueue(T, value) {
  const o = T.fn('enqueue');
  T.call('enqueue', [['self', SELF], ['value', value]], `q.enqueue(${pyrepr(value)})`, null, o);
  const end = T.g('q', '_end'), n = T.B('blk').cells.length, head = T.g('q', '_head');
  T.at(o + 1, `Is there room at the end? \`_end\` is ${end} and the block has ${n} slots: ${end === n ? '**no**.' : 'yes.'}`);
  if (end === n) {
    T.ask(`The queue holds only ${end - head} values in ${n} slots. What does this enqueue do?`, 'Raise IndexError: no room at the end',
      [`Write into slot 0, which is free`, 'Shift the values back to slot 0, then write', `Write into slot ${n}`],
      `This design only ever writes at \`_end\`, and \`_end\` has reached the end of the block. Slots 0 to ${head - 1} are free, but nothing ever goes back to use them: they are dead.`);
    T.at(o + 2, 'Raise IndexError.');
    throw new PyErr('IndexError', 'no room at the end', { why: `Slots 0 to ${head - 1} are empty, yet there is no room: the used part has crawled to the right.` });
  }
  T.wr('blk', end, value);
  T.at(o + 3, `Write ${C(value)} into slot ${end}.`);
  T.s('q', '_end', end + 1);
  T.at(o + 4, `\`_end\` becomes ${end + 1}.`);
  return T.ret(null, o + 4, 'enqueue returns None.');
}
function crawlDequeue(T) {
  const o = T.fn('dequeue');
  T.call('dequeue', [['self', SELF]], 'q.dequeue()', null, o);
  const head = T.g('q', '_head'), end = T.g('q', '_end');
  T.at(o + 1, `Is it empty? \`_head\` is ${head} and \`_end\` is ${end}: ${head === end ? '**yes**.' : 'no.'}`);
  if (head === end) { T.at(o + 2, 'Raise IndexError.'); throw new PyErr('IndexError', 'dequeue from empty queue'); }
  const v = T.rd('blk', head); T.set('value', v);
  T.at(o + 3, `Read the front, slot ${head}: ${C(v)}.`);
  T.wr('blk', head, null);
  T.at(o + 4, `Clear slot ${head}.`);
  T.ask('How many values does this dequeue shift?', '0: the front index moves instead', ['All the others', 'One', 'Half of them'],

  T.s('q', '_head', head + 1);
  T.at(o + 5, `\`_head\` becomes ${head + 1}. Slot ${head} is now dead: nothing will ever write there again.`);
  return T.ret(v, o + 6);
}
function setupCrawl(T, cap) {

const crawlProbes = () => [['len(q)', T => T.g('q', '_end') - T.g('q', '_head')], ['q._head, q._end', T => ({ raw: `(${T.g('q', '_head')}, ${T.g('q', '_end')})` })], ['q._block', T => ({ raw: arrRepr(T.B('blk').cells) })]];

/* ---- CircularQueue: the course code ------------------------------------ */
const R_ENQ = `def enqueue(self, value):
    if self._size == self._capacity:
        self._grow(max(1, 2 * self._capacity))
    self._block[(self._head + self._size) % self._capacity] = value
    self._size += 1`;
const R_DEQ = `def dequeue(self):
    if self._size == 0:
        raise IndexError("dequeue from empty queue")
    value = self._block[self._head]
    self._block[self._head] = None
    self._head = (self._head + 1) % self._capacity
    self._size -= 1
    return value`;
const R_GROW = `def _grow(self, capacity):
    bigger = Array(capacity)
    for offset in range(self._size):
        bigger[offset] = self._block[(self._head + offset) % self._capacity]
    self._block, self._capacity, self._head = bigger, capacity, 0`;

function setupRing(T, key, cap, cls) {
  const b = key + 'blk';
  T.block(b, Array(cap).fill(null), { label: key + '._block' });
  const f = [['_block', BLK(b)], ['_capacity', cap], ['_head', 0]];
  if (cls === 'HeadTailRing' || cls === 'OneSlotRing') f.push(['_tail', 0]); else f.push(['_size', 0]);
  T.obj(key, cls || 'CircularQueue', f);
}
const rb = (T, k) => T.g(k, '_block').blk;
const ringList = (T, k) => { const cap = T.g(k, '_capacity'), h = T.g(k, '_head'), n = T.g(k, '_size'), c = T.B(rb(T, k)).cells; return range(0, n).map(o => c[mod(h + o, cap)]); };

/* enqueue. mode: '' (the course code), 'nomod' (W7-S2), 'b3' (full when tail == head) */
function ringEnqueue(T, k, value, mode) {
  const o = T.fn('enqueue');
  T.call('enqueue', [['self', SELF], ['value', value]], `${k}.enqueue(${pyrepr(value)})`, null, o);
  const cap = T.g(k, '_capacity'), size = T.g(k, '_size'), head = T.g(k, '_head');
  if (mode === 'b3') {
    const tail = mod(head + size, cap);
    T.set('tail', tail);
    T.at(o + 1, `\`tail = (${head} + ${size}) % ${cap}\` = ${tail}.`);
    T.at(o + 2, `Is \`tail == self._head\`? ${tail} == ${head}: ${tail === head ? '**yes**.' : 'no.'}`);
    if (size === 0) T.ask(`The queue is EMPTY: size is 0. What will line 3 do?`, 'Raise "queue is full"', ['Write into slot ' + tail, 'Grow the ring', 'Raise "dequeue from empty queue"'],
      `On an empty ring the tail IS the head: (head + 0) % capacity. So this test cannot tell empty from full, and it refuses the very first value.`);
    if (tail === head) {
      T.at(o + 3, 'Raise "queue is full".');
      throw new PyErr('IndexError', 'queue is full', { why: size === 0 ? `The ring is empty, size 0, yet the test says full. \`head == tail\` means empty OR full; only \`_size\` tells them apart.` : 'This time the ring really is full.' });
    }
    T.wr(rb(T, k), tail, value);
    T.at(o + 4, `Write ${C(value)} into slot ${tail}.`);
    T.s(k, '_size', size + 1);
    T.at(o + 5, `\`_size\` becomes ${size + 1}.`);
    return T.ret(null, o + 5, 'enqueue returns None.');
  }
  T.at(o + 1, `Is the ring full? \`_size\` is ${size}, \`_capacity\` is ${cap}: ${size === cap ? '**yes**.' : 'no.'}`);
  if (size === cap) {
    if (mode === 'nomod') { T.at(o + 2, 'Raise "queue is full".'); throw new PyErr('IndexError', 'queue is full'); }
    T.ask(`The ring is full. What does line 3 do?`, `Grow to ${Math.max(1, 2 * cap)} slots, copying in queue order`,
      ['Raise IndexError("queue is full")', 'Overwrite the oldest value', `Grow to ${cap + 1} slots`],
      `The challenge version grows instead of refusing: a block twice as big, so that enqueue stays amortised O(1), as in Lecture 04.`);
    T.at(o + 2, `Grow first: \`_grow(max(1, 2 * ${cap}))\` asks for ${Math.max(1, 2 * cap)} slots.`);
    (T.sc.grow || ringGrow)(T, k, Math.max(1, 2 * cap));
  }
  const c2 = T.g(k, '_capacity'), h2 = T.g(k, '_head'), s2 = T.g(k, '_size');
  const raw = h2 + s2, slot = mode === 'nomod' ? raw : mod(raw, c2);
  if (mode === 'nomod') {
    if (raw >= c2) T.ask(`\`_head + _size\` is ${h2} + ${s2} = ${raw}, and the block has slots 0 to ${c2 - 1}. What does line 4 do?`, 'Raise IndexError from the Array',
      [`Write into slot ${mod(raw, c2)}`, `Write into slot ${c2 - 1}`, 'Grow the block'],
      `Without \`% self._capacity\`, the index runs off the end. The free slot is ${mod(raw, c2)}, but only the modulo would take us there.`);
    T.at(o + 3, `The slot is \`self._head + self._size\` = ${h2} + ${s2} = **${raw}**, with no \`% capacity\`.`);
  } else {
    T.at(o + 3, `The tail is \`(${h2} + ${s2}) % ${c2}\` = ${raw} % ${c2} = **${slot}**${raw >= c2 ? `: past the end, so it wraps round to slot ${slot}` : ''}.`);
    if (raw >= c2 && !T.sc.noAskWrap) T.ask(`\`(head + size)\` is ${raw}, but the block has slots 0 to ${c2 - 1}. Where does ${C(value)} go?`, `Slot ${slot}`,
      [`Slot ${raw}`, `Slot ${c2 - 1}`, `Slot ${h2}`],
      `The \`% ${c2}\` makes slot ${c2 - 1} join up with slot 0. Slot ${slot} was freed by an earlier dequeue, so the ring reuses it, and no value moves.`);
  }
  T.wr(rb(T, k), slot, value);
  T.at(o + 3, `Write ${C(value)} into slot ${slot}.${raw >= c2 && mode !== 'nomod' ? ' The ring has wrapped round.' : ''}`);
  T.s(k, '_size', s2 + 1);
  T.at(o + 4, `\`_size\` becomes ${s2 + 1}.${s2 + 1 === c2 ? ' The ring is now full.' : ''}`);

}

/* dequeue. mode: '' (the course code), 'nomod' (W7-B2), 'noclear' */
function ringDequeue(T, k, mode) {
  const o = T.fn('dequeue');
  T.call('dequeue', [['self', SELF]], `${k}.dequeue()`, null, o);
  const cap = T.g(k, '_capacity'), size = T.g(k, '_size'), head = T.g(k, '_head'), b = rb(T, k);
  T.at(o + 1, `Is the ring empty? \`_size\` is ${size}: ${size === 0 ? '**yes**.' : 'no.'}`);
  if (size === 0) {
    T.ask(`\`_head\` is ${head}. How does dequeue know that the ring is empty?`, '`_size` is 0', ['`_head` is 0', `slot ${head} holds None`, '`_head == _capacity`'],
      `Head can be anywhere in an empty ring: it is wherever the last dequeue left it. A None in a slot proves nothing either: None could be a value in the queue. Only the count says it.`);
    T.at(o + 2, 'Raise IndexError.');

function ringGrow(T, k, capacity) {

  T.block(nb, Array(capacity).fill(null), { label: 'bigger' });
  T.set('bigger', BLK(nb));
  T.at(o + 1, `\`bigger = Array(${capacity})\`: a new block of ${capacity} empty slots.`);
  if (head > 0) T.ask(`The front, ${C(T.B(ob).cells[head])}, is in slot ${head} of the old block. Which slot of \`bigger\` will it go to?`, 'Slot 0', [`Slot ${head}`, `Slot ${head + cap}`, `Slot ${size - 1}`],

    const src = mod(head + off, cap);
    T.set('offset', off); T.ptr([[ob, src, 'from'], [nb, off, 'offset', true]]);
    T.at(o + 2, `Loop: \`offset\` is ${off}.`, { loop: 'copy' });
    T.wr(nb, off, T.rd(ob, src), { b: ob, i: src });
    T.at(o + 3, `The value ${off} places behind the front lives in slot \`(${head} + ${off}) % ${cap}\` = ${src}. It goes to slot ${off} of \`bigger\`.`, { loop: 'copy' });
  }
  T.ptr([]);
  T.s(k, '_block', BLK(nb)); T.s(k, '_capacity', capacity); T.s(k, '_head', 0);
  T.B(ob).old = true; T.B(nb).label = k + '._block';
  T.at(o + 4, `Switch all three: \`_block\` is the bigger block, \`_capacity\` is ${capacity}, \`_head\` is 0. The queue reads front to back from slot 0.`);

/* A sequence of whole operations, one step each, with the state after each. */
function ringSequence(T, p) {
  const k = 'q'; let asked = 0, wrapped = false;
  for (const x of p.ops) {
    const cap = T.g(k, '_capacity'), head = T.g(k, '_head'), size = T.g(k, '_size');
    const text = opLine(k, x);
    if (x !== null && size === cap && asked < 3) {
      T.at(0, `Next: \`${text}\`. The ring is full.`);
      T.ask(`Next: \`${text}\`, on a full ring of capacity ${cap}. What happens?`, `It grows to ${2 * cap} slots, then writes`, ['IndexError: queue is full', 'It overwrites the front', 'It writes into slot ' + cap],
        'This CircularQueue grows when full: a block twice as big, copied in queue order, so the front is in slot 0 afterwards.'); asked++;
    } else if (x !== null && head + size >= cap && !wrapped && asked < 3) {
      wrapped = true;
      T.at(0, `Next: \`${text}\`.`);
      T.ask(`Next: \`${text}\`. head is ${head}, size is ${size}, capacity ${cap}. Which slot does ${C(x)} go into?`, `Slot ${mod(head + size, cap)}`, [`Slot ${head + size}`, `Slot ${head}`, `Slot ${cap - 1}`],
        `tail = (${head} + ${size}) % ${cap} = ${mod(head + size, cap)}. The ring wraps round and reuses a slot freed by a dequeue.`); asked++;
    } else if (x === null && size > 0 && asked < 3 && wrapped && T.B(rb(T, k)).cells[head] !== null && head > 0) {
      T.at(0, `Next: \`${text}\`.`);
      const L = ringList(T, k).map(pyrepr);
      T.ask(`Next: \`${text}\`. Which value comes out?`, L[0], [L[L.length - 1], L[1], 'None', pyrepr(T.B(rb(T, k)).cells[0])],
        `The front is at \`head\` = slot ${head}: the oldest value still in the queue. FIFO.`); asked++;
    }
    T.op(text, () => ringOp(T, k, x), (v, err) => {
      const c = T.g(k, '_capacity'), h = T.g(k, '_head'), s = T.g(k, '_size');
      const state = `head = ${h}, size = ${s}, tail = (${h} + ${s}) % ${c} = ${mod(h + s, c)}.`;
      if (err) return `**${err.type}: ${err.message}.** ${state}`;
      if (x === null) return `Dequeue returns ${C(v)}. ${state}`;
      return `${C(x)} enqueued${c !== cap ? `: the ring grew to ${c} slots first` : ''}. ${state}${s === c ? ' The ring is full.' : ''}`;

}

          pour ? `The outbox is empty, so all ${n} values are poured: a pop and a push each, ${2 * n} operations, then one pop. Expensive, but it happens once per value.` : 'The outbox is not empty, so there is no pouring: one pop. Most dequeues are like this one, which is why the average stays O(1).');

const JOS = `def josephus(names, k):
    circle = CircularQueue(max(1, len(names)))
    for name in names:
        circle.enqueue(name)
    order = []
    while len(circle) > 0:
        for _ in range(k - 1):
            circle.enqueue(circle.dequeue())   # passed by: front to back
        order.append(circle.dequeue())          # the k-th leaves
    return order`;
function qq(T, f) { return T.quietly(f); }
function josephusRun(T, names, k) {
  T.call('josephus', [['names', names], ['k', k]], `josephus(${pyrepr(names)}, ${k})`, null, 1);
  const cap = Math.max(1, names.length);
  setupRing(T, 'circle', cap); T.set('circle', OBJ('circle'));
  T.at(2, `A ring with room for everyone: capacity ${cap}.`);
  for (const nm of names) {
    T.set('name', nm);
    T.at(3, `Loop: \`name\` is ${C(nm)}.`, { loop: 'fill' });
    qq(T, () => ringEnqueue(T, 'circle', nm));
    T.at(4, `${C(nm)} joins the circle at the back.`, { loop: 'fill' });
  }
  T.unset('name');
  const order = []; T.set('order', order);
  T.at(5, '`order` will collect the names as they leave.');
  let first = true;
  while (T.g('circle', '_size') > 0) {
    const n = T.g('circle', '_size');
    T.at(6, `${plural(n, 'person')} left in the circle.`);
    if (first && n >= 2) {
      const L = ringList(T, 'circle');
      T.ask(`Counting from the front, every ${k === 1 ? '' : k === 2 ? 'second' : k === 3 ? 'third' : k + 'th'} person leaves. Who leaves first?`, pyrepr(L[(k - 1) % n]),
        [pyrepr(L[k % n]), pyrepr(L[mod(k - 2, n)]), pyrepr(L[0]), pyrepr(L[n - 1])].filter(x => x !== pyrepr(L[(k - 1) % n])),
        `The first ${k - 1} are passed by: each is dequeued and enqueued again at the back. The ${k}-th is dequeued for good${(k - 1) >= n ? `, counting round the circle, since there are only ${n}` : ''}.`);
      first = false;
    }
    for (let i = 0; i < k - 1; i++) {
      T.set('_', i);
      T.at(7, `Pass ${i + 1} of ${k - 1}.`, { loop: 'pass' });
      const v = qq(T, () => ringDequeue(T, 'circle')); qq(T, () => ringEnqueue(T, 'circle', v));
      T.at(8, `${C(v)} is passed by: out at the front, in at the back.`, { loop: 'pass' });
    }
    T.unset('_');
    const out = qq(T, () => ringDequeue(T, 'circle')); order.push(out); T.set('order', order.slice());
    T.at(9, `${C(out)} leaves the circle.${T.g('circle', '_size') === 1 ? ` Only ${C(ringList(T, 'circle')[0])} is left.` : ''}`);
  }
  T.at(6, 'The circle is empty.');
  return T.ret(order.slice(), 10, `Return the order. The last name, ${C(order[order.length - 1])}, is the survivor.`);
}

const BIN = `def binary_numbers(n):
    result = []
    pending = CircularQueue(2 * n + 1)          # never needs to grow
    pending.enqueue("1")
    while len(result) < n:
        s = pending.dequeue()
        result.append(s)
        pending.enqueue(s + "0")
        pending.enqueue(s + "1")

  setupRing(T, 'pending', 2 * n + 1); T.set('pending', OBJ('pending'));
  T.at(3, `A ring of ${2 * n + 1} slots: each of the n dequeues adds two strings, so it never fills.`);
  qq(T, () => ringEnqueue(T, 'pending', '1'));
  T.at(4, 'Start with "1".');
  let it = 0;
  while (result.length < n) {
    T.at(5, `\`len(result)\` is ${result.length}, less than ${n}: go on.`, { loop: 'gen' });
    if (it === 1) T.ask('Which string comes out of the queue next?', pyrepr(ringList(T, 'pending')[0]), [pyrepr(ringList(T, 'pending')[1]), "'11'", "'100'"],
      'The queue holds "10" then "11", in the order they were made. FIFO hands out the shorter strings first: breadth-first.');
    const s = qq(T, () => ringDequeue(T, 'pending')); T.set('s', s);
    T.at(6, `Dequeue the front: ${C(s)}.`, { loop: 'gen' });
    result.push(s); T.set('result', result.slice());
    T.at(7, `${C(s)} is the next number in binary.`, { loop: 'gen' });
    qq(T, () => ringEnqueue(T, 'pending', s + '0'));
    T.at(8, `Enqueue ${C(s + '0')}: ${C(s)} times two.`, { loop: 'gen' });
    qq(T, () => ringEnqueue(T, 'pending', s + '1'));
    T.at(9, `Enqueue ${C(s + '1')}: ${C(s)} times two, plus one.`, { loop: 'gen' });

const MAVG = `def moving_averages(values, k):
    if k < 1:
        raise ValueError("k must be at least 1")
    window = CircularQueue(k)
    total, result = 0, []
    for value in values:
        if len(window) == k:
            total -= window.dequeue()           # the oldest value leaves
        window.enqueue(value)
        total += value
        if len(window) == k:
            result.append(total / k)
    return result`;

  T.call('moving_averages', [['values', values], ['k', k]], `moving_averages(${pyrepr(values)}, ${k})`, null, 1);
  T.at(2, `Is \`k < 1\`? ${k < 1 ? '**Yes.**' : 'No.'}`);
  if (k < 1) { T.at(3, 'Raise ValueError.'); throw new PyErr('ValueError', 'k must be at least 1'); }
  setupRing(T, 'window', k); T.set('window', OBJ('window'));
  T.at(4, `The window: a ring of exactly ${k} slots.`);
  let total = 0; const result = []; T.set('total', 0); T.set('result', []);
  T.at(5, '`total` is the sum of the window, kept up to date as values come and go.');
  let asked = false;
  for (const value of values) {
    T.set('value', value);
    T.at(6, `Loop: \`value\` is ${value}.`, { loop: 'win' });
    const full = T.g('window', '_size') === k;
    T.at(7, `Is the window full? ${full ? '**Yes**.' : 'No.'}`, { loop: 'win' });
    if (full) {
      if (!asked) { asked = true; T.ask(`The window ${pyrepr(ringList(T, 'window'))} is full and ${value} is coming in. How many additions and subtractions will the new total cost?`, '2: subtract the oldest, add the newest', [`${k}: add up the window again`, `${k + 1}`, '1'],

      const old = qq(T, () => ringDequeue(T, 'window')); total -= old; T.set('total', total);
      T.at(8, `The oldest value, ${old}, leaves: \`total\` is ${total}.`, { loop: 'win' });
    }
    qq(T, () => ringEnqueue(T, 'window', value));
    T.at(9, `${value} enters the window.`, { loop: 'win' });
    total += value; T.set('total', total);
    T.at(10, `\`total\` is ${total}.`, { loop: 'win' });
    const nowFull = T.g('window', '_size') === k;
    T.at(11, `Is the window full now? ${nowFull ? 'Yes.' : 'No: no average yet.'}`, { loop: 'win' });
    if (nowFull) {
      result.push(FL(total / k)); T.set('result', result.slice());
      T.at(12, `Append ${total} / ${k} = ${pyrepr(FL(total / k))}.`, { loop: 'win' });

/* Build the full trace for one scenario and its inputs. */
function shellLines(sc, p) {
  return sc.strip.map(part => (part in (sc.params || {})) ? pyrepr(p[part]) : part).join('').split('\n');
}
function build(sc, p) {
  const T = new Tracer(sc, p);
  const lines = sc.lines ? sc.lines(p) : shellLines(sc, p);
  sc.setup(T, p);
  if (!T.out.length && !sc.seq) lines.slice(0, -1).forEach(l => T.prompt(l));
  for (const k in T.counters) T.counters[k] = 0;
  T.flash = []; T.arrows = []; T.lptrs = []; T.sflash = null;
  const last = lines[lines.length - 1];
  T.spanStart = T.out.filter(o => o.k === 'prompt').length;
  T.snap(sc.seq ? 'Ready. Press **Step** to run the operations one at a time.' : `Ready. Press **Step** to run \`${last}\`.`);
  if (!sc.seq) T.prompt(last);
  let failed = false;
  try { sc.run(T, p); } catch (e) { if (e instanceof PyErr) { T.raise(e); failed = true; } else throw e; }
  T.spanEnd = T.out.filter(o => o.k === 'prompt').length;
  T.spanCounters = Object.assign({}, T.counters);
  if (sc.summary && !failed) T.steps[T.steps.length - 1].msg += sc.summary(T, p);
  if (sc.probes) {
    for (const [cmd, fn] of sc.probes(T, p)) T.line(cmd, () => T.quietly(() => fn(T)));
    T.flash = []; T.arrows = []; T.lptrs = [];
    T.stack = [T.stack[0]]; T.stack[0].status = 'active'; T.stack[0].line = 0; T.stack[0].note = '';
    T.snap(sc.finale ? '**What went wrong?** ' + sc.finale(T, p) : 'The shell checks the result: the queue front to back, its length, and what the storage really holds.',
      { kind: sc.group === 'wrong' ? 'err' : '' });
  }
  return T;
}

const $ = id => document.getElementById(id);

const KW = new Set(['def', 'class', 'if', 'return', 'for', 'in', 'not', 'is', 'None', 'else', 'and', 'or', 'True', 'False', 'while', 'raise']);
const BI = new Set(['print', 'len', 'str', 'range', 'max', 'IndexError', 'ValueError', 'Node', 'Array', 'CircularQueue', 'make_block']);
function highlight(line) {
  const re = /(#.*$)|([fF]?"(?:[^"\\]|\\.)*"|[fF]?'(?:[^'\\]|\\.)*')|(\b\d+\b)|([A-Za-z_]\w*)|(\s+|.)/g;
  let m, html = '', prev = '';
  while ((m = re.exec(line))) {
    if (m[1]) html += `<span class="t-com">${esc(m[1])}</span>`;
    else if (m[2]) html += `<span class="t-str">${esc(m[2])}</span>`;
    else if (m[3]) html += `<span class="t-num">${m[3]}</span>`;
    else if (m[4]) {
      const w = m[4];
      if (prev === 'def' || prev === 'class') html += `<span class="t-fn">${w}</span>`;
      else if (KW.has(w)) html += `<span class="t-kw">${w}</span>`;
      else if (BI.has(w)) html += `<span class="t-bi">${w}</span>`;
      else html += esc(w);
      prev = w; continue;
    } else html += esc(m[5]);
    if (m[5] && /\S/.test(m[5])) prev = m[5];
  }
  return html;
}

const state = { sc: null, params: {}, T: null, idx: 0, answered: new Map(), quiz: true, timer: null, prevSnap: null, nudge: '', pic: null };

function loadScenario(id) {

  state.params = {};

function renderCallStrip() {
  const sc = state.sc, box = $('callstrip');
  box.innerHTML = '<span class="ps">&gt;&gt;&gt;</span>';
  for (const part of sc.strip) {
    if (part === '\n') { box.insertAdjacentHTML('beforeend', '<span class="br"></span><span class="ps">&gt;&gt;&gt;</span>'); continue; }
    if (part in sc.params) {
      const inp = document.createElement('input');
      inp.id = 'param-' + part; inp.value = pyrepr(state.params[part]); inp.spellcheck = false;
      inp.setAttribute('aria-label', part);
      inp.size = Math.max(2, inp.value.length);
      inp.addEventListener('input', () => { inp.size = Math.max(2, inp.value.length); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyParams(); } e.stopPropagation(); });
      inp.addEventListener('change', applyParams);
      box.appendChild(inp);
    } else {
      const s = document.createElement('span'); s.innerHTML = highlight(part); box.appendChild(s);
    }
  }
  const run = document.createElement('button'); run.className = 'btn run'; run.textContent = 'Run';
  run.addEventListener('click', applyParams); box.appendChild(run);
